[project]
name = "reqctl"
version = "0.1.1"
description = "Requirements control: schema, impact closure, baselines, traceability."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.21",
  "PyYAML>=6.0",
]

[project.scripts]
reqctl = "reqctl.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reqctl*"]

[tool.setuptools.package-data]
reqctl = ["schemas/*.schema.yaml", "portal.html"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"yaml.safe_load".msg = "Load corpus files through corpus.read, which reports an unreadable path as `reqctl: <message>` instead of ending the command in a traceback."
"yaml.load".msg = "Load corpus files through corpus.read, which reports an unreadable path as `reqctl: <message>` instead of ending the command in a traceback. corpus itself chooses the loader, libyaml where the wheel carries it."

[tool.ruff.lint.per-file-ignores]
"reqctl/corpus.py" = ["TID251"]
"tests/**" = ["TID251"]

[tool.mypy]
python_version = "3.11"
