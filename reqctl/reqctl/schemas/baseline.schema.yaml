# @req> REQ-97751594@BwWOFlFOjjyU dlcdx3
$schema: "https://json-schema.org/draft/2020-12/schema"
# @req> REQ-83218477@nthDaUhwd58l ch4k3s
$id: "reqctl/baseline.schema.yaml"
# @req> REQ-52846482@4k8T0YLN4n97 uuo4su
type: object
# @req> REQ-20678879@c210nefD6kHQ 3jp6m3
additionalProperties: false

# @req> REQ-10511199@UQZ6Ch88aIpW ucy2b5
# @req> REQ-85783763@3jU8EBlXjjXR u3vnla
# @req> REQ-14619822@tGPby0EQMjQz h5lv42
# @req> REQ-54257918@2pAThuxToYwU dvuoot
required: [baseline, commit, items, supersedes]

# @req> REQ-20678879@c210nefD6kHQ qke5hh
properties:

  # @req> REQ-10511199@UQZ6Ch88aIpW zv72fc
  baseline:
    type: integer
    minimum: 1

  # @req> REQ-85783763@3jU8EBlXjjXR er6rq5
  commit:
    type: string
    pattern: "^[0-9a-f]{40}$"

  # @req> REQ-14619822@tGPby0EQMjQz zpbdvj
  supersedes:
    type: [integer, "null"]

  # @req> REQ-54257918@2pAThuxToYwU cpbxhm
  items:
    type: object
    minProperties: 1
    # @req> REQ-64078604@z4ggvy8qxGN6 bwtwmt
    propertyNames:
      pattern: "^((REQ|GUARD|PARAM|TERM|DATA)-[0-9]{8}|[a-z][a-z0-9_]*)$"
    additionalProperties:
      type: string
      minLength: 1
