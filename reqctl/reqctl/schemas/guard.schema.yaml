# @req> REQ-97751594@BwWOFlFOjjyU 2loty3
$schema: "https://json-schema.org/draft/2020-12/schema"
# @req> REQ-83218477@nthDaUhwd58l slnxeo
$id: "reqctl/guard.schema.yaml"
# @req> REQ-52846482@4k8T0YLN4n97 izj5r2
type: object
# @req> REQ-20678879@c210nefD6kHQ bioa7v
additionalProperties: false

# @req> REQ-20098211@G2knHaytDioI tvzckc
# @req> REQ-60231841@jePDPrjCGq74 w7yc5t
# @req> REQ-95625116@kUyiwf6F3QNx xvuqs4
# @req> REQ-72206066@or5GPpF3qRjD e7qjzi
# @req> REQ-29717668@RIdwMpfLVtSN d4na4n
required: [text, status, acceptance_criteria, relations, assessed]

# @req> REQ-20678879@c210nefD6kHQ gky3ek
properties:

  # @req> REQ-20098211@G2knHaytDioI 7d6syh
  text:
    type: string
    minLength: 1
    # @req> REQ-51326810@tZsTSo6pwmwE dcdmk5
    # @req> REQ-67358511@6v5ZhXIOqAkD wn4rwf
    # @req> REQ-59874866@fH6bFHN-Lwa8 525gw6
    # @req> REQ-76604940@SEVyiDrbH-Ez tviwnj
    x-prose: true

  # @req> REQ-60231841@jePDPrjCGq74 d4xw2k
  status:
    enum: [draft, approved, deprecated, superseded]
    # @req> REQ-21532897@4mlJA_VkJWru j4mcvz
    default: draft

  # @req> REQ-95625116@kUyiwf6F3QNx hlxsuk
  acceptance_criteria:
    type: array
    # @req> REQ-40805826@MwrhRhY2S8aV utxx4z
    default: []
    # @req> REQ-91205530@FiUaykViw6dQ apmpds
    # @req> REQ-71965656@F8ulVugEMpD- fiorno
    x-flag: criterion
    # @req> REQ-64010477@RC2labUfeA7H 3zaepd
    items:
      type: object
      additionalProperties: false
      required: [given, when, then]
      properties:
        # @req> REQ-51326810@tZsTSo6pwmwE ifmpy5
        # @req> REQ-67358511@6v5ZhXIOqAkD 7b7u4g
        # @req> REQ-59874866@fH6bFHN-Lwa8 5p2alw
        # @req> REQ-76604940@SEVyiDrbH-Ez 5mnihj
        given: {type: string, minLength: 1, x-prose: true}
        # @req> REQ-51326810@tZsTSo6pwmwE bvmam4
        # @req> REQ-67358511@6v5ZhXIOqAkD rlimsw
        # @req> REQ-59874866@fH6bFHN-Lwa8 wsl2ie
        # @req> REQ-76604940@SEVyiDrbH-Ez uizjht
        when: {type: string, minLength: 1, x-prose: true}
        # @req> REQ-51326810@tZsTSo6pwmwE 46mdi7
        # @req> REQ-67358511@6v5ZhXIOqAkD yikagx
        # @req> REQ-59874866@fH6bFHN-Lwa8 siwuzx
        # @req> REQ-76604940@SEVyiDrbH-Ez 65k6m5
        then: {type: string, minLength: 1, x-prose: true}

  # @req> REQ-12136510@Q7qxyHYKDLns w5buq3
  rationale:
    type: string
    # @req> REQ-51326810@tZsTSo6pwmwE zhkpa6
    # @req> REQ-67358511@6v5ZhXIOqAkD utmgyj
    # @req> REQ-59874866@fH6bFHN-Lwa8 py3hox
    # @req> REQ-76604940@SEVyiDrbH-Ez gtawtc
    x-prose: true

  # @req> REQ-72206066@or5GPpF3qRjD rzaqpj
  relations:
    type: object
    # @req> REQ-65468432@457yPXcCJ7jW ddw4ix
    readOnly: true
    # @req> REQ-79941148@1tVAUwfYfzOT zexepm
    default: {}
    # @req> REQ-27469480@hig9PDBc8EAL sl6rd2
    propertyNames:
      pattern: "^GUARD-[0-9]{8}$"
    additionalProperties:
      enum: [derives_from, depends_on, constrains, supersedes, conflicts_with]

  # @req> REQ-29717668@RIdwMpfLVtSN 7tsbiq
  assessed:
    type: object
    # @req> REQ-20438611@e9DfaZdZU0eT xvebja
    readOnly: true
    # @req> REQ-91894254@HA2Tpgi5MW9m romwk6
    default: {}
    # @req> REQ-76117220@AaFqkR9MGAa- vm2npn
    propertyNames:
      pattern: "^(GUARD-[0-9]{8}|[a-z][a-z0-9_]*)(\\..+)?$"
    additionalProperties:
      type: string
      minLength: 1

  # @req> REQ-29452949@uJo5VABUlYBe c6uqqp
  citations:
    type: object
    # @req> REQ-89946019@X4MY0OTFXbag dqr3vu
    readOnly: true
    # @req> REQ-64498551@plqPhZrcgNff yv3eko
    propertyNames:
      pattern: "^[a-z2-7]{6}$"
    # @req> REQ-60525163@3OcsvouN9GFx k5clyz
    additionalProperties:
      type: string
      pattern: "^[A-Za-z0-9_-]{43}$"

  # @req> REQ-40478019@_dwqsOpSOQXA aem4lb
  whole_file_citations:
    type: object
    readOnly: true
    propertyNames:
      minLength: 1
    additionalProperties:
      type: object
      additionalProperties: false
      required: [pinned, digest]
      properties:
        pinned:
          type: string
          pattern: "^[A-Za-z0-9_-]{12}$"
        digest:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
