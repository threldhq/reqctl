# @req> REQ-97751594@BwWOFlFOjjyU 5sbikq
$schema: "https://json-schema.org/draft/2020-12/schema"
# @req> REQ-83218477@nthDaUhwd58l 7kxgvq
$id: "reqctl/requirement.schema.yaml"
# @req> REQ-52846482@4k8T0YLN4n97 ho5alx
type: object
# @req> REQ-20678879@c210nefD6kHQ sj2at6
additionalProperties: false

# @req> REQ-20098211@G2knHaytDioI 7wuse3
# @req> REQ-75098293@uTbLO-CtERyf lq5h2w
# @req> REQ-60231841@jePDPrjCGq74 r3skuz
# @req> REQ-18969680@m-TFl7mdkBH_ rmqb2t
# @req> REQ-34233802@zs99YCdQML6g 2wgdwc
# @req> REQ-95625116@kUyiwf6F3QNx xxnnyy
# @req> REQ-72206066@or5GPpF3qRjD oeehhz
# @req> REQ-29717668@RIdwMpfLVtSN btnn3m
required: [text, type, status, verification, priority, acceptance_criteria, relations, assessed]

# @req> REQ-20678879@c210nefD6kHQ d42jgw
properties:

  # @req> REQ-20098211@G2knHaytDioI barydb
  text:
    type: string
    minLength: 1
    # @req> REQ-51326810@tZsTSo6pwmwE herx2o
    # @req> REQ-67358511@6v5ZhXIOqAkD scvw2e
    # @req> REQ-59874866@fH6bFHN-Lwa8 bb4d4e
    # @req> REQ-76604940@SEVyiDrbH-Ez 733htw
    x-prose: true

  # @req> REQ-75098293@uTbLO-CtERyf udnboc
  type:
    enum: [functional, non_functional, constraint]
    # @req> REQ-13331330@P4lNv8GZIYi5 suidvz
    default: functional

  # @req> REQ-60231841@jePDPrjCGq74 wtgfve
  status:
    enum: [draft, approved, deprecated, superseded]
    # @req> REQ-21532897@4mlJA_VkJWru bqeoev
    default: draft

  # @req> REQ-35443917@I_xqd07AsRI5 efas27
  # @req> REQ-87380206@s24vYGZICHft idouod
  verification:
    enum: [inspection, analysis, demonstration]
    default: inspection

  # @req> REQ-95625116@kUyiwf6F3QNx 3n7kdx
  acceptance_criteria:
    type: array
    # @req> REQ-40805826@MwrhRhY2S8aV 5hswio
    default: []
    # @req> REQ-91205530@FiUaykViw6dQ e3xspv
    # @req> REQ-71965656@F8ulVugEMpD- q4nno6
    x-flag: criterion
    # @req> REQ-64010477@RC2labUfeA7H ens75t
    items:
      type: object
      additionalProperties: false
      required: [given, when, then]
      properties:
        # @req> REQ-51326810@tZsTSo6pwmwE vnflam
        # @req> REQ-67358511@6v5ZhXIOqAkD f6o5gy
        # @req> REQ-59874866@fH6bFHN-Lwa8 3jfz4j
        # @req> REQ-76604940@SEVyiDrbH-Ez 6q22bn
        given: {type: string, minLength: 1, x-prose: true}
        # @req> REQ-51326810@tZsTSo6pwmwE oaaz6i
        # @req> REQ-67358511@6v5ZhXIOqAkD lfrvre
        # @req> REQ-59874866@fH6bFHN-Lwa8 6z6dih
        # @req> REQ-76604940@SEVyiDrbH-Ez yec3ne
        when: {type: string, minLength: 1, x-prose: true}
        # @req> REQ-51326810@tZsTSo6pwmwE innu6u
        # @req> REQ-67358511@6v5ZhXIOqAkD tihnkp
        # @req> REQ-59874866@fH6bFHN-Lwa8 rgv7rq
        # @req> REQ-76604940@SEVyiDrbH-Ez 5o7gi4
        then: {type: string, minLength: 1, x-prose: true}

  # @req> REQ-34233802@zs99YCdQML6g x3wn7x
  priority:
    enum: [high, medium, low]
    # @req> REQ-24203829@voUq-k4sF1lM oqje27
    default: medium

  # @req> REQ-12136510@Q7qxyHYKDLns 6jxptq
  rationale:
    type: string
    # @req> REQ-51326810@tZsTSo6pwmwE w7r4bo
    # @req> REQ-67358511@6v5ZhXIOqAkD myuvtx
    # @req> REQ-59874866@fH6bFHN-Lwa8 gxhhuc
    # @req> REQ-76604940@SEVyiDrbH-Ez ostref
    x-prose: true

  # @req> REQ-72206066@or5GPpF3qRjD rebolx
  relations:
    type: object
    # @req> REQ-65468432@457yPXcCJ7jW xdlpsu
    readOnly: true
    # @req> REQ-79941148@1tVAUwfYfzOT c3ap4f
    default: {}
    # @req> REQ-79353110@BkH49V7f27Ux 5hl4ke
    propertyNames:
      pattern: "^REQ-[0-9]{8}$"
    additionalProperties:
      enum: [derives_from, depends_on, constrains, supersedes, conflicts_with]

  # @req> REQ-29717668@RIdwMpfLVtSN hzpraj
  assessed:
    type: object
    # @req> REQ-20438611@e9DfaZdZU0eT hjvz6r
    readOnly: true
    # @req> REQ-91894254@HA2Tpgi5MW9m qzqq6g
    default: {}
    # @req> REQ-61848293@mqx_oBnVQn8f r55whv
    propertyNames:
      pattern: "^(REQ-[0-9]{8}|[a-z][a-z0-9_]*)(\\..+)?$"
    additionalProperties:
      type: string
      minLength: 1

  # @req> REQ-29452949@uJo5VABUlYBe zkmdiw
  citations:
    type: object
    # @req> REQ-89946019@X4MY0OTFXbag osv6l4
    readOnly: true
    # @req> REQ-64498551@plqPhZrcgNff 5sdhfc
    propertyNames:
      pattern: "^[a-z2-7]{6}$"
    # @req> REQ-60525163@3OcsvouN9GFx 3hchvm
    additionalProperties:
      type: string
      pattern: "^[A-Za-z0-9_-]{43}$"

  # @req> REQ-40478019@_dwqsOpSOQXA bormph
  whole_file_citations:
    type: object
    readOnly: true
    propertyNames:
      minLength: 1
    additionalProperties:
      type: object
      additionalProperties: false
      required: [pinned, digest]
      properties:
        pinned:
          type: string
          pattern: "^[A-Za-z0-9_-]{12}$"
        digest:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"
