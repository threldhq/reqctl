# @req> REQ-97751594@BwWOFlFOjjyU bw5pgk
$schema: "https://json-schema.org/draft/2020-12/schema"
# @req> REQ-83218477@nthDaUhwd58l hvachr
$id: "reqctl/dictionary.schema.yaml"
# @req> REQ-52846482@4k8T0YLN4n97 w3ligq
type: object
# @req> REQ-20678879@c210nefD6kHQ 2j2acz
additionalProperties: false

# @req> REQ-70136689@kGycTrf0_sOP y7gjxb
# @req> REQ-60231841@jePDPrjCGq74 whtum4
# @req> REQ-55732743@ELdWYlfmjgH0 osucvy
required: [kind, status, entries]

# @req> REQ-20678879@c210nefD6kHQ wvisqw
properties:

  # @req> REQ-60231841@jePDPrjCGq74 6txmwh
  status:
    enum: [draft, approved, deprecated, superseded]
    # @req> REQ-21532897@4mlJA_VkJWru w2ix3u
    default: draft

  # @req> REQ-70136689@kGycTrf0_sOP ga7747
  kind:
    enum: [term, parameter, data]
    # @req> REQ-95557166@iVuq5MGUC4wD glk266
    readOnly: true

  # @req> REQ-15824835@Yz8PdrMb9q2F 2or7iw
  name:
    type: string
    pattern: "^[a-z][a-z0-9_]*$"
    # @req> REQ-91205530@FiUaykViw6dQ b6cnwg
    # @req> REQ-71965656@F8ulVugEMpD- h5i2tk
    x-address: true

  # @req> REQ-95242849@qtpUa2UbKM6O vfi7sv
  carried:
    type: array
    uniqueItems: true
    # @req> REQ-38278436@G9G7n7d2Ke-7 yyw6vd
    readOnly: true
    items:
      type: string
      pattern: "^[a-z][a-z0-9_]*$"

  # @req> REQ-54705070@azHphsRsbfJl gmnzxo
  text:
    type: string
    minLength: 1
    # @req> REQ-51326810@tZsTSo6pwmwE 365hpf
    # @req> REQ-67358511@6v5ZhXIOqAkD c2dajd
    # @req> REQ-59874866@fH6bFHN-Lwa8 7okmvn
    # @req> REQ-76604940@SEVyiDrbH-Ez vw3dbe
    x-prose: true

  # @req> REQ-38954638@497pbk7J9sqk hpuute
  value_type:
    enum: [duration, size, count, ratio, percentage, currency, boolean, text]
    # @req> REQ-52544202@FdBPIIOU8f_v qyhuti
    x-entry-of: value_types

  # @req> REQ-92926466@dhyvKSDWQfjw wc43aq
  unit:
    type: string
    minLength: 1

  # @req> REQ-21045294@UE8gAjNCLsm8 6mwqw2
  default:
    type: string
    minLength: 1

  # @req> REQ-36099384@oqIHWa_e7CDN qukf5f
  ceiling:
    type: string
    minLength: 1

  # @req> REQ-22682482@F_OIMxlkifKy 3uk233
  fields:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}

  # @req> REQ-12136510@Q7qxyHYKDLns mpjvzb
  rationale:
    type: string
    # @req> REQ-51326810@tZsTSo6pwmwE z5vxyy
    # @req> REQ-67358511@6v5ZhXIOqAkD wi4wcd
    # @req> REQ-59874866@fH6bFHN-Lwa8 zf2lsy
    # @req> REQ-76604940@SEVyiDrbH-Ez bqzsae
    x-prose: true

  # @req> REQ-55732743@ELdWYlfmjgH0 lyffll
  entries:
    type: object
    minProperties: 1
    propertyNames:
      type: string
      minLength: 1

  # @req> REQ-66350758@mhvWsKLsPGHC qttgzd
  assessed:
    type: object
    # @req> REQ-20438611@e9DfaZdZU0eT zbz6r3
    readOnly: true
    # @req> REQ-91894254@HA2Tpgi5MW9m qow7p3
    default: {}
    # @req> REQ-77349514@c5tXalbMeD2i g5owzj
    propertyNames:
      pattern: "^[a-z][a-z0-9_]*(\\..+)?$"
    additionalProperties:
      type: string
      minLength: 1

  # @req> REQ-88203622@wlZ9orsr9c7q jez5bu
  citations:
    type: object
    # @req> REQ-89946019@X4MY0OTFXbag wkgpw2
    readOnly: true
    propertyNames:
      pattern: "^[a-z2-7]{6}$"
    additionalProperties:
      type: string
      pattern: "^[A-Za-z0-9_-]{43}$"

  # @req> REQ-40478019@_dwqsOpSOQXA wg7rlk
  whole_file_citations:
    type: object
    readOnly: true
    propertyNames:
      minLength: 1
    additionalProperties:
      type: object
      additionalProperties: false
      required: [pinned, digest]
      properties:
        pinned:
          type: string
          pattern: "^[A-Za-z0-9_-]{12}$"
        digest:
          type: string
          pattern: "^[A-Za-z0-9_-]{43}$"

# @req> REQ-52555712@ifLOKFIGhkgf j4awd6
# @req> REQ-20003259@dUyU2uLqjsIF v56wyu
# @req> REQ-76262680@k4Ti3hJfcZ14 ltndty
# @req> REQ-12896387@jvS0Os1oYPbk z3j5vy
# @req> REQ-49304907@NSnffmSJBDm1 umaqja
allOf:

  # @req> REQ-52555712@ifLOKFIGhkgf e5mj2f
  - if: {required: [kind], properties: {kind: {const: term}}}
    then:
      properties:
        citations: {not: {}}
        whole_file_citations: {not: {}}
        name: {not: {}}
        text: {not: {}}
        value_type: {not: {}}
        unit: {not: {}}
        default: {not: {}}
        ceiling: {not: {}}
        fields: {not: {}}
        rationale: {not: {}}
        entries:
          # @req> REQ-79013939@LHWesLk8a6d7 2yhttw
          maxProperties: 1
          additionalProperties: {$ref: "#/$defs/term"}

  # @req> REQ-76262680@k4Ti3hJfcZ14 y4ql4s
  - if: {required: [kind], properties: {kind: {const: parameter}}}
    then:
      # @req> REQ-20003259@dUyU2uLqjsIF gbexkl
      required: [name, text, value_type]
      properties:
        ceiling: {not: {}}
        fields: {not: {}}
        # @req> REQ-91205530@FiUaykViw6dQ shltxs
        # @req> REQ-71965656@F8ulVugEMpD- w2nm2t
        entries: {x-flag: value, additionalProperties: {$ref: "#/$defs/entry"}}

  # @req> REQ-49304907@NSnffmSJBDm1 2ihvkk
  - if: {required: [kind], properties: {kind: {const: data}}}
    then:
      # @req> REQ-12896387@jvS0Os1oYPbk crwhts
      required: [name]
      properties:
        value_type: {not: {}}
        unit: {not: {}}
        # @req> REQ-91205530@FiUaykViw6dQ dss2lp
        # @req> REQ-71965656@F8ulVugEMpD- zxdanu
        entries: {x-flag: entry, additionalProperties: {$ref: "#/$defs/entry"}}

# @req> REQ-19756275@hGspvTpsKkDR xr244n
$defs:

  # @req> REQ-19756275@hGspvTpsKkDR pbyoly
  entry:
    type: object
    additionalProperties: {$ref: "#/$defs/field"}
    properties:
      # @req> REQ-52544202@FdBPIIOU8f_v mfnskt
      value_type: {$ref: "#/$defs/field", x-entry-of: value_types}
      # @req> REQ-36712960@kffnEhw1AEbI f2vzxe
      definition:
        type: string
        minLength: 1
        # @req> REQ-51326810@tZsTSo6pwmwE wprnd5
        # @req> REQ-67358511@6v5ZhXIOqAkD 54mfrx
        # @req> REQ-59874866@fH6bFHN-Lwa8 fappkf
        # @req> REQ-76604940@SEVyiDrbH-Ez qemprc
        x-prose: true
      # @req> REQ-42019737@90sIiSl5qAyl 46pfik
      aliases: {not: {}}
      # @req> REQ-42147485@VsERY4C491hX g5qe2q
      unclaimed: {not: {}}
      # @req> REQ-42335087@EHhmRZP7XeYW g6kvgb
      name:
        type: string
        minLength: 1
        maxLength: 40

  term:
    # @req> REQ-92166241@HTHjlgOGlMF7 6p6gqt
    required: [word, definition]
    # @req> REQ-19756275@hGspvTpsKkDR kanmmn
    additionalProperties: {$ref: "#/$defs/field"}
    properties:
      # @req> REQ-47317077@nmlbp2InoWXJ 5i5a5b
      word:
        type: string
        # @req> REQ-91205530@FiUaykViw6dQ jy2drg
        # @req> REQ-71965656@F8ulVugEMpD- ixutwk
        x-flag: term
      # @req> REQ-36712960@kffnEhw1AEbI 46cyrm
      definition: {$ref: "#/$defs/entry/properties/definition"}
      # @req> REQ-91205530@FiUaykViw6dQ 4sfqcl
      # @req> REQ-71965656@F8ulVugEMpD- w3rrjk
      # @req> REQ-48736295@BEVQZyse_96M x3zziz
      aliases: {type: array, uniqueItems: true, items: {type: string, minLength: 1}, x-flag: alias}
      # @req> REQ-20106088@5vCa8KN82s2L jar5fh
      unclaimed:
        type: object
        # @req> REQ-24370000@L3oFZSuyf_lZ jrazmf
        additionalProperties: {type: string, x-prose: true}

  # @req> REQ-19756275@hGspvTpsKkDR bb4ooz
  field:
    type: [string, number, boolean, array, object]
    items: {type: [string, number, boolean]}
    propertyNames:
      type: string
      minLength: 1
    additionalProperties: {$ref: "#/$defs/entry"}
