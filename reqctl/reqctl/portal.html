<style>
:root {
  color-scheme: light dark;
  --bg: #fbfbfa; --panel: #fff; --line: #e4e2dd; --ink: #1a1917;
  --mut: #565049; --dim: #8a8279; --accent: #00a4a4; --warn: #be7c1c;
  --bad: #b4392f; --ok: #3f7d3a;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16161a; --panel: #1e1e24; --line: #2f2f38; --ink: #e8e6e1;
    --mut: #a8a29a; --dim: #736d65; --accent: #4fd0d0; --warn: #d99a3e;
    --bad: #e0685c; --ok: #6fbf68;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
button, input, select, textarea {
  font: inherit; color: inherit; background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px;
}
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button.go { background: var(--accent); color: #08201f; border-color: var(--accent);
            font-weight: 600; }
button.go:disabled { opacity: .5; cursor: default; }
header {
  position: sticky; top: 0; z-index: 5; background: var(--panel);
  border-bottom: 1px solid var(--line); padding: 10px 14px;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
header h1 { font-size: 14px; margin: 0; font-weight: 650; letter-spacing: .02em; }
header .grow { flex: 1 1 160px; }
header input[type=search] { width: 100%; }
.facets { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 14px 0; }
.facet {
  border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
  padding: 4px 11px; font-size: 12px; color: var(--mut);
}
.facet[aria-pressed=true] { border-color: var(--accent); color: var(--ink); font-weight: 600; }
main { display: grid; grid-template-columns: 1fr; gap: 14px; padding: 12px 14px 40px; }
@media (min-width: 900px) {
  main { grid-template-columns: minmax(280px, 380px) 1fr; align-items: start; }
  #detail { position: sticky; top: 62px; max-height: calc(100vh - 76px); overflow: auto; }
}
.rows { display: flex; flex-direction: column; gap: 6px; }
.row {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 11px; cursor: pointer; text-align: left; width: 100%;
}
.row:hover, .row[aria-current=true] { border-color: var(--accent); }
.row .uid { font-size: 11px; color: var(--dim); }
.row .txt {
  margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 3;
  -webkit-box-orient: vertical; overflow: hidden;
}
.row.gone .txt { text-decoration: line-through; color: var(--dim); }
#detail { background: var(--panel); border: 1px solid var(--line);
          border-radius: 10px; padding: 16px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
         color: var(--dim); margin: 16px 0 6px; }
.card { border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px;
        margin-bottom: 6px; }
.chip { display: inline-block; font-size: 11px; border-radius: 999px;
        padding: 1px 8px; border: 1px solid var(--line); color: var(--mut); }
.chip.suspect { border-color: var(--warn); color: var(--warn); }
.chip.missing { border-color: var(--bad); color: var(--bad); }
.crit { border-left: 2px solid var(--line); padding-left: 10px; margin-bottom: 8px; }
.crit div { display: flex; gap: 8px; }
.crit b { color: var(--dim); font-size: 11px; min-width: 44px; }
a { color: var(--accent); }
.uidlink { cursor: pointer; text-decoration: underline dotted; }
.empty { color: var(--dim); }
.setup { max-width: 620px; margin: 8vh auto; padding: 0 18px; }
.setup ol { padding-left: 20px; color: var(--mut); }
.setup li { margin-bottom: 7px; }
.setup input { width: 100%; margin: 10px 0; }
.note { border-left: 3px solid var(--warn); padding: 8px 12px; color: var(--mut);
        background: var(--panel); border-radius: 0 7px 7px 0; margin: 14px 0; }
dialog {
  border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
  color: var(--ink); max-width: 620px; width: calc(100vw - 28px); padding: 18px;
}
dialog::backdrop { background: rgba(0,0,0,.5); }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--mut); margin-bottom: 4px; }
.field input, .field select, .field textarea { width: 100%; }
.field textarea { min-height: 80px; resize: vertical; }
.status { padding: 10px 14px; font-size: 13px; color: var(--mut); }
.status.bad { color: var(--bad); }
button.thin { padding: 2px 8px; font-size: 11px; }
.pair { display: flex; gap: 6px; margin-bottom: 6px; }
.pair input { flex: 1 1 0; min-width: 0; }
.pick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
dialog.wide { max-width: none; height: calc(100vh - 28px);
              display: flex; flex-direction: column; }
.treebox { flex: 1 1 auto; overflow: auto; margin-top: 10px; }
.tree { position: relative; }
.tree svg { position: absolute; inset: 0; pointer-events: none; }
.tree svg > path { fill: none; stroke: var(--line); stroke-width: 1.5; }
.tree svg > path.side { stroke: var(--warn); stroke-dasharray: 4 3; }
.tree marker path { fill: var(--warn); }
.node { position: absolute; width: 168px; height: 54px; padding: 5px 7px;
        text-align: left; overflow: hidden; }
.node .uid { display: block; font-size: 10px; color: var(--dim); }

.node.here { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.node.gone .txt { text-decoration: line-through; color: var(--dim); }

    ? field.parts.map((part) => each[part]).join(" | ") : String(each));

const LINKED_WORD = /\[([^\]\n]+)\]\(([a-z][a-z0-9_]*)\)/g;

function proseOf(item) {
  const held = [item.text, item.definition, item.rationale];
  held.push(criteriaText(item));
  for (const fields of Object.values(item.entries ?? {})) {
    for (const [name, value] of Object.entries(fields ?? {})) {
      if (name !== "aliases") held.push(...(Array.isArray(value) ? value : [value]));
    }
  }
  return held.filter((each) => typeof each === "string");
}

function wordsShown(uid) {
  const seen = new Map();
  for (const item of corpus) {
    for (const text of proseOf(item)) {
      for (const [, word, target] of text.matchAll(LINKED_WORD)) {
        if (target === uid) seen.set(word, (seen.get(word) ?? 0) + 1);
      }
    }
  }
  return seen;
}

const KIN = { w: 168, h: 54, gapx: 20, gapy: 46 };

function kinship() {
  const up = {}, down = {}, side = {};
  for (const item of corpus) {
    for (const link of item.outgoing ?? []) {
      if (link.relation === "derives_from") {
        (up[item.uid] ??= []).push(link.target);
        (down[link.target] ??= []).push(item.uid);

}

function family(uid, { up, down }) {
  const seen = new Set(), stack = [uid];

    const at = stack.pop();

    stack.push(...(up[at] ?? []), ...(down[at] ?? []));
  }
  return seen;
}

function generations(clan, up) {
  const gen = Object.fromEntries([...clan].map((at) => [at, 0]));

    let moved = false;

        if (clan.has(over) && gen[over] + 1 > gen[at]) {
          gen[at] = gen[over] + 1;

}
