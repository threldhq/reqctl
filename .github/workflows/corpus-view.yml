# @req> REQ-71344419@No0izFxAdVKW knrefg
# @req> REQ-81795630@6p2bA0ZHqY-j mezc3i
on:
  push:
    branches: [main]
  # @req> REQ-71344419@No0izFxAdVKW ctqcb6
  workflow_call:
    inputs:
      reqctl:
        description: the reqctl release that publishes the corpus, as a ref of threldhq/reqctl
        required: true
        type: string
    secrets:
      CORPUS_APP_CLIENT_ID:
        required: true
      CORPUS_APP_PRIVATE_KEY:
        required: true

# @req> GUARD-52037270@OztX8T4vOmsH cfvmff
permissions:
  contents: read

# @req> REQ-51143332@Mf4bIqJxqvPM 77hzez
concurrency:
  group: corpus-view
  cancel-in-progress: true

# @req> GUARD-37835776@0Spg60Mwp26J zqgwhm
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # @req> REQ-84875536@dj6Y7xTDeN6r xuffpt
      - name: Stop a pull request caller before any secret is read
        env:
          EVENT: ${{ github.event_name }}
        run: |
          case "$EVENT" in
            pull_request | pull_request_*)
              echo "::error::the caller was triggered by $EVENT; call this workflow from a push or a workflow dispatch"
              exit 1 ;;
          esac

      # @req> REQ-45437338@K7K_kLnTNJPw vyjmfj
      - name: Stop an unpinned reqctl before any secret is read
        env:
          REF: ${{ inputs.reqctl }}
          CALLER: ${{ github.repository }}
        run: |
          if [ -n "$REF" ] || [ "$CALLER" != threldhq/reqctl ]; then
            if ! [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
              printf '::error::reqctl input %q is not a forty-character commit SHA; pass the full commit SHA of the release\n' "$REF"
              exit 1
            fi
          fi

      # @req> REQ-71344419@No0izFxAdVKW zejtog
      # @req> GUARD-85664071@zrnITtEG0Lqc 6hs7vh
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app-token
        with:
          client-id: ${{ secrets.CORPUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORPUS_APP_PRIVATE_KEY }}
          permission-contents: write

      # @req> REQ-71344419@No0izFxAdVKW sctliw
      # @req> GUARD-85664071@zrnITtEG0Lqc f546ii
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: # zizmor: ignore[artipacked]
          token: ${{ steps.app-token.outputs.token }}

      # @req> REQ-71344419@No0izFxAdVKW 5zzevb
      # @req> GUARD-85664071@zrnITtEG0Lqc hsiia2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: threldhq/reqctl
          ref: ${{ inputs.reqctl || github.sha }}
          path: .reqctl
          persist-credentials: false

      # @req> GUARD-85664071@zrnITtEG0Lqc medqn7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .reqctl/reqctl/requirements-lock.txt

      # @req> GUARD-20154572@z2_hbXJO9sHn dlnedu
      # @req> GUARD-26421773@SDQf4TqpYtSB kiduae
      # @req> GUARD-72877772@JfdZ18LPQLEi bosol2
      - name: Install reqctl at the release the caller pins
        run: |
          echo .reqctl/ >> .git/info/exclude
          pip install --require-hashes -r .reqctl/reqctl/requirements-lock.txt
          pip install -e .reqctl/reqctl --no-deps --no-build-isolation

      # @req> REQ-71344419@No0izFxAdVKW ot3c3q
      - name: Publish the corpus where the portal reads it
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python .reqctl/.github/corpus_view.py
