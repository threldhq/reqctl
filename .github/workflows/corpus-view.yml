name: Corpus view

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      reqctl:
        description: the reqctl release that publishes the corpus, as a ref of threldhq/reqctl
        required: true
        type: string
    secrets:
      CORPUS_APP_CLIENT_ID:
        required: true
      CORPUS_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: corpus-view
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: app-token
        with:
          client-id: ${{ secrets.CORPUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORPUS_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: # zizmor: ignore[artipacked]
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: threldhq/reqctl
          ref: ${{ inputs.reqctl || github.sha }}
          path: .reqctl
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .reqctl/reqctl/requirements-lock.txt

      - name: Install reqctl at the release the caller pins
        run: |
          echo .reqctl/ >> .git/info/exclude
          pip install --require-hashes -r .reqctl/reqctl/requirements-lock.txt
          pip install -e .reqctl/reqctl --no-deps --no-build-isolation

      - name: Publish the corpus where the portal reads it
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python .reqctl/.github/corpus_view.py
