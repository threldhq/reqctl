name: Corpus view

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: corpus-view
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: app-token
        with:
          client-id: ${{ secrets.CORPUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORPUS_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: # zizmor: ignore[artipacked]
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install --require-hashes -r reqctl/requirements-lock.txt
          pip install -e reqctl --no-deps --no-build-isolation

      - name: The merged corpus holds
        run: |
          reqctl validate
          reqctl baseline --check

      - name: Compute the view
        run: |
          python3 - <<'VIEW' > "${RUNNER_TEMP}/corpus.json"
          import json
          import subprocess

          def reqctl(*args):
              return subprocess.run(["reqctl", "--json", *args], check=True,
                                    capture_output=True, text=True).stdout

          uids = list(json.loads(reqctl("export", "--all")))
          print(reqctl("context", *uids), end="")
          VIEW

      - name: Publish it
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          export GIT_AUTHOR_NAME="$bot"
          export GIT_COMMITTER_NAME="$bot"
          export GIT_AUTHOR_EMAIL="${bot_id}+${bot}@users.noreply.github.com"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          found=0
          git ls-remote --exit-code --heads origin corpus-view >/dev/null || found=$?
          if [ "$found" -eq 0 ]; then
            git fetch origin corpus-view --depth 1
            git checkout -B corpus-view FETCH_HEAD
          elif [ "$found" -eq 2 ]; then
            git checkout --orphan corpus-view
            git rm -r --cached . --quiet
          else
            echo "::error::git ls-remote exited $found; cannot tell whether corpus-view exists"
            exit 1
          fi
          cp "${RUNNER_TEMP}/corpus.json" corpus.json
          git add corpus.json
          if git diff --cached --quiet; then
            echo "the corpus has not moved"
            exit 0
          fi
          git commit -m "corpus at ${GITHUB_SHA}"
          git push origin corpus-view
