name: Corpus gates

on:
  pull_request:
  workflow_call:
    inputs:
      reqctl:
        description: the reqctl release whose gates judge the corpus, as a ref of threldhq/reqctl
        required: true
        type: string

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: inputs.reqctl != ''
        with:
          repository: threldhq/reqctl
          ref: ${{ inputs.reqctl }}
          path: .reqctl
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install reqctl
        if: inputs.reqctl == ''
        run: |
          pip install --require-hashes -r reqctl/requirements-lock.txt
          pip install -e reqctl --no-deps --no-build-isolation

      - name: Install reqctl at the release the caller pins
        if: inputs.reqctl != ''
        run: |
          echo .reqctl/ >> .git/info/exclude
          pip install --require-hashes -r .reqctl/reqctl/requirements-lock.txt
          pip install -e .reqctl/reqctl --no-deps --no-build-isolation

      - name: The corpus passes every gate
        if: inputs.reqctl == ''
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python .github/corpus_gates.py

      - name: The corpus passes every gate at the release the caller pins
        if: inputs.reqctl != ''
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python .reqctl/.github/corpus_gates.py
