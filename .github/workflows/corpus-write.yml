name: Corpus write

on:
  workflow_dispatch:
    inputs:
      change:
        description: the change, as JSON steps for reqctl
        required: true
      title:
        description: what the pull request is called
        required: true
  workflow_call:
    inputs:
      change:
        description: the change, as JSON steps for reqctl
        required: true
        type: string
      title:
        description: what the pull request is called
        required: true
        type: string
      reqctl:
        description: the reqctl release that applies the steps, as a ref of threldhq/reqctl
        required: true
        type: string
    secrets:
      CORPUS_APP_CLIENT_ID:
        required: true
      CORPUS_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: corpus-write
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      # @req+ REQ-84875536@dj6Y7xTDeN6r zbm5to
      # @req+ REQ-45437338@K7K_kLnTNJPw 75roge
      - name: Stop a pull request caller or an unpinned reqctl before any secret is read
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ inputs.reqctl }}
          CALLER: ${{ github.repository }}
        run: |
          case "$EVENT" in
            pull_request | pull_request_*)
              echo "::error::the caller was triggered by $EVENT; call this workflow from a push or a workflow dispatch"
              exit 1 ;;
          esac
          if [ -n "$REF" ] || [ "$CALLER" != threldhq/reqctl ]; then
            if ! [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
              printf '::error::reqctl input %q is not a forty-character commit SHA; pass the full commit SHA of the release\n' "$REF"
              exit 1
            fi
          fi
      # @req- 75roge
      # @req- zbm5to

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: app-token
        with:
          client-id: ${{ secrets.CORPUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORPUS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: # zizmor: ignore[artipacked]
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: threldhq/reqctl
          ref: ${{ inputs.reqctl || github.sha }}
          path: .reqctl
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .reqctl/reqctl/requirements-lock.txt

      - name: Install reqctl at the release the caller pins
        run: |
          echo .reqctl/ >> .git/info/exclude
          pip install --require-hashes -r .reqctl/reqctl/requirements-lock.txt
          pip install -e .reqctl/reqctl --no-deps --no-build-isolation

      - name: Apply the steps and open the pull request
        env:
          CORPUS_CHANGE: ${{ inputs.change }}
          TITLE: ${{ inputs.title }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python .reqctl/.github/corpus_write.py
