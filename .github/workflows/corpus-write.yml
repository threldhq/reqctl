name: Corpus write

on:
  workflow_dispatch:
    inputs:
      change:
        description: the change, as JSON steps for reqctl
        required: true
      title:
        description: what the pull request is called
        required: true

permissions:
  contents: read

concurrency:
  group: corpus-write
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: app-token
        with:
          client-id: ${{ secrets.CORPUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CORPUS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: # zizmor: ignore[artipacked]
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install --require-hashes -r reqctl/requirements-lock.txt
          pip install -e reqctl --no-deps --no-build-isolation

      - name: Apply the change
        env:
          CORPUS_CHANGE: ${{ inputs.change }}
        run: python .github/corpus_write.py

      - name: Corpus is valid
        run: reqctl validate

      - name: Settle the baseline
        run: |
          set -euo pipefail
          if reqctl baseline --check; then
            echo "the baseline already stands"
            exit 0
          fi
          reqctl baseline --generate
          reqctl baseline --check

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          TITLE: ${{ inputs.title }}
          CORPUS_CHANGE: ${{ inputs.change }}
        run: |
          set -euo pipefail
          branch="corpus/${GITHUB_RUN_ID}"
          bot="${APP_SLUG}[bot]"
          bot_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "$bot"
          git config user.email "${bot_id}+${bot}@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::the change altered nothing"
            exit 1
          fi
          git commit -m "$TITLE"
          git push -u origin "$branch"
          # shellcheck disable=SC2016
          {
            printf 'Dispatched from the requirements portal.\n\n'
            printf 'Every item here was written by `reqctl`; nothing hand-edited the corpus.\n\n'
            printf 'Steps dispatched:\n\n```json\n%s\n```\n' "$CORPUS_CHANGE"
          } > "${RUNNER_TEMP}/body.md"
          gh pr create --base main --head "$branch" \
            --title "$TITLE" --body-file "${RUNNER_TEMP}/body.md"
