# @req> GUARD-93604824@iZUC-hUk7h1_ 4oweq6
# @req> GUARD-54236737@mQ9hKg4LFSMf kssz27
on:
  pull_request:
    # @req> GUARD-18239610@b7HqEiGpFOuy 7crqqf
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# @req> GUARD-52037270@OztX8T4vOmsH i2oqdm
permissions:
  contents: read

# @req> GUARD-37835776@0Spg60Mwp26J vldfar
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # @req> GUARD-85664071@zrnITtEG0Lqc kgi3k3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # @req> GUARD-85664071@zrnITtEG0Lqc 66tbpa
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            reqctl/requirements-lock.txt
            reqctl/requirements-dev-lock.txt
            reqctl/pyproject.toml

      # @req> GUARD-72754574@N8arWm_QVCXZ vcqgik
      # @req> GUARD-93604824@iZUC-hUk7h1_ tbptvl
      # @req> GUARD-70807721@hKTqJj264iEQ yot3ub
      - name: What this change touches
        id: touched
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            changed=$(git diff --name-only "origin/$BASE...HEAD")
          else
            changed=$(git ls-files)
          fi
          mark() {
            if grep -qE "$2" <<<"$changed"; then held=true; else held=false; fi
            echo "$1=$held" | tee -a "$GITHUB_OUTPUT"
          }
          mark deps '^reqctl/(requirements|pyproject\.toml$)'

      # @req+ GUARD-80541636@FrimpbfW1XMa 645kyy
      - name: Install gitleaks
        run: .github/install-gitleaks.sh "$RUNNER_TEMP/bin"

      - name: No credential in the commits the pull request adds
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: '"$RUNNER_TEMP/bin/gitleaks" git . --no-banner --log-opts="origin/$BASE..HEAD"'

      - name: No credential in the tracked files
        if: github.event_name != 'pull_request'
        run: '"$RUNNER_TEMP/bin/gitleaks" dir . --no-banner'
      # @req- 645kyy

      # @req> REQ-51060455@Z5EVUURxm1nV qzo4x7
      - name: Hook exits are explicit decisions
        run: python .github/guards/exit_paths.py

      # @req> GUARD-93589588@yH4bykpGUeLb 22yzb5
      - name: Session start installs what CI installs
        run: python .github/guards/install_parity.py

      # @req> GUARD-96541664@oB0GqG8AdVP9 fz2bbm
      # @req> GUARD-10823996@bfm-dN6H_Udf bibl65
      # @req> GUARD-27748979@G-APnovHS9P3 ukc4qb
      # @req> GUARD-32820195@-N_pWkH7K8rC h2oqan
      - name: Owned paths still need the owner
        run: python .github/guards/codeowners.py

      # @req> GUARD-30872791@76ZvH9aeC5ry o3kb6k
      # @req> GUARD-32527345@r3WSOnuqI9M1 3ybvei
      # @req> GUARD-56838909@xIKhRXKhnYS1 lfk7zr
      # @req> GUARD-65225392@myxez9Yz6SOi zfrwkz
      # @req> GUARD-70682435@wxuZzo-y7Z-b vr4w3y
      - name: The plugin ships from this repository at the wheel's version
        run: python .github/guards/plugin_build.py

      # @req> GUARD-24141585@HmP4W4nJNHmc ig5bha
      - name: No decision records
        run: |
          if [ -d docs/adr ] || [ -d docs/decisions ]; then
            echo "::error::decision records do not persist; put the constraint in a requirement, a guard or a schema"
            exit 1
          fi

      # @req> GUARD-21526521@G_BddcqGKnJP 5xduhm
      # @req> GUARD-75672058@ekQlMqKRpmul hri6op
      # @req> GUARD-83751348@rb37sHKC5bnL yo5ejy
      - name: Help budget, what a session reads through reqctl --help
        run: python .github/guards/help_budget.py --max 41

      # @req> GUARD-39219434@QVmE7MsFwn8t 7wet6o
      # @req> GUARD-83168738@zhoOQpGgBd9R yekgof
      - name: Lockfile inputs state their versions
        run: |
          python3 - <<'CHECK'
          import re, sys

          def norm(name):
              return re.sub(r"[-_.]+", "-", name).lower()

          def lines(path):
              try:
                  with open(path, encoding="utf-8") as held:
                      return held.read().splitlines()
              except (OSError, UnicodeDecodeError) as broken:
                  print(f"::error::cannot read {path}: {broken}")
                  sys.exit(1)

          lock = {}
          for line in lines("reqctl/requirements-dev-lock.txt"):
              found = re.match(r"([A-Za-z0-9_.\-]+)(\[[^\]]+\])?==([^\s\\]+)", line)
              if found:
                  lock[norm(found.group(1))] = found.group(3)

          fails, checked = [], 0
          for line in lines("reqctl/requirements-dev.in"):
              stated = line.split("#", 1)[0].strip()
              if not stated or stated.startswith("-c"):
                  continue
              checked += 1
              if "==" not in stated:
                  fails.append(f"{stated}: names no version")
                  continue
              name, want = stated.split("==", 1)
              held = lock.get(norm(re.sub(r"\[[^\]]+\]", "", name)))
              if held is None:
                  fails.append(f"{name}: pinned but absent from the lock")
              elif held != want.strip():
                  fails.append(f"{name}: input says {want.strip()}, lock says {held}")
          if not checked:
              fails.append("reqctl/requirements-dev.in: nothing left to check")

          for fault in fails:
              print(f"::error::{fault}")
          sys.exit(1 if fails else 0)
          CHECK

      # @req> GUARD-20154572@z2_hbXJO9sHn jgnjez
      # @req> GUARD-26421773@SDQf4TqpYtSB v6b7zv
      # @req> GUARD-72877772@JfdZ18LPQLEi hikod6
      # @req> GUARD-24264620@IECSQ_EeiXfC oez7bw
      # @req> GUARD-93589588@yH4bykpGUeLb nbibxq
      - name: Install
        run: |
          pip install --require-hashes -r reqctl/requirements-lock.txt -r reqctl/requirements-dev-lock.txt
          pip install -e reqctl --no-deps --no-build-isolation

      # @req> GUARD-12128145@mFuOqNbkyV1o jipptc
      # @req> GUARD-20154572@z2_hbXJO9sHn tbj3mb
      # @req> GUARD-20209566@zkKPlDbnzFuA nijiqj
      # @req> GUARD-24264620@IECSQ_EeiXfC dq2cxm
      # @req> GUARD-26421773@SDQf4TqpYtSB b4rdwn
      # @req> GUARD-37835776@0Spg60Mwp26J rwzekc
      # @req> GUARD-40603760@BjP6UvmNcOQT fusl76
      # @req> GUARD-52037270@OztX8T4vOmsH whtw5s
      # @req> GUARD-72877772@JfdZ18LPQLEi wg3djt
      # @req> GUARD-84344643@C0RxmQgbeF_W dbsuxc
      # @req> GUARD-85664071@zrnITtEG0Lqc baiftz
      # @req> REQ-74823322@YWZT0Srw2y2d bnanl5
      # @req> REQ-81795630@6p2bA0ZHqY-j tpnudv
      - name: Workflow shape
        run: python .github/guards/workflow_shape.py

      # @req> GUARD-79122074@9WbEAGS3ea8D ft2tnz
      - name: Workflow syntax
        run: actionlint

      # @req> GUARD-79122074@9WbEAGS3ea8D p5n7ah
      - name: Shell scripts
        run: python .github/guards/shell_scripts.py

      # @req> GUARD-79122074@9WbEAGS3ea8D ldqwzq
      - name: Workflow security
        run: zizmor --offline .github/workflows

      # @req> GUARD-46596073@qu9cFP2Awo-x 2ebkbc
      # @req> GUARD-46665858@h9A_bfvOyNF7 iaxpiz
      # @req> GUARD-39430403@Gm7cxHsAQzHL o6egeg
      # @req> GUARD-95027749@peJtUX9xJXL_ e3yprg
      - name: Rules scope
        run: python .github/guards/rules_scope.py

      # @req> GUARD-12128145@mFuOqNbkyV1o ox7ckl
      - name: Corpus is valid
        run: reqctl validate

      # @req> GUARD-54236737@mQ9hKg4LFSMf 5l323g
      # @req> GUARD-80881960@UfZQs_f1P8Qb ccfqlz
      - name: The pull request names an issue
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/guards/pr_issue.py

      # @req> GUARD-85510467@S-FtmL033UTY ez2foh
      - name: Citations match the corpus, with no base branch
        if: github.event_name != 'pull_request'
        run: python .github/guards/citations.py

      # @req> GUARD-21296330@1vKKetZd35C0 hjxagh
      - name: Cited values match the corpus
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python .github/guards/cited_values.py

      # @req> GUARD-86063188@GFGejAdpTlxL vtdyiv
      - name: The repository holds no test
        run: python .github/guards/no_tests.py

      # @req> GUARD-27671623@3zDwoF3LwQkw c6frt7
      # @req> GUARD-63366473@wqNzDR34_aRK 73aduy
      # @req> GUARD-21085755@-uspUi1-r2Pe 46klq3
      # @req> GUARD-76151755@kec8SwUpDtFd 3wjvh7
      - name: Comment budget
        run: python .github/guards/comment_budget.py --max 0

      # @req> GUARD-56877438@R8tS_bbVly0h hfsgbs
      - name: A skill mints what the corpus accepts
        run: python .github/guards/skill_minting.py

      # @req> GUARD-87984565@VEipgV2EseNW lskl4e
      # @req> GUARD-46345440@qP_IWjdqHBUF op6u4p
      - name: Every plugin file belongs to one component
        run: python .github/guards/plugin_components.py

      # @req> GUARD-58772071@qal1M_8xilDP srindy
      - name: The guard hook fingerprints the plugin files naming the corpus
        run: python .github/guards/fingerprints.py

      # @req> GUARD-70400787@-g-3MXzRn6hr ap6aqt
      - name: Citations this change touches
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          {
            echo '```'
            reqctl compare --base "origin/$BASE_REF"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"

      # @req> GUARD-50228923@hESHdAl7Kn_w scvm7k
      # @req> GUARD-22794969@9zSROQYCCtPU qxcqba
      # @req> GUARD-50817018@Yqq4j4T1WIhv 2owrd4
      - name: Names resolve
        run: python .github/guards/references.py

      # @req> GUARD-15820124@9ypnh2GEXx5T oq66de
      # @req> GUARD-37890983@MBBp99PJwOhl w54c25
      - name: No write bypasses the journal
        run: python .github/guards/journal_writes.py

      # @req> GUARD-99113200@u605TKfh4fwm 464eon
      - name: Lint and types over linted_paths
        run: python .github/guards/linted.py

      # @req> GUARD-79122074@9WbEAGS3ea8D ptxdhr
      - name: Spelling
        run: typos

      # @req> GUARD-39842261@bWyFMC8rM_YC u4yxij
      - name: The runtime lock holds what pyproject.toml requires
        run: python .github/guards/pyproject_lock.py

      # @req> GUARD-72754574@N8arWm_QVCXZ v76ub4
      - name: Dependencies have no known vulnerabilities
        if: steps.touched.outputs.deps == 'true'
        run: pip-audit -r reqctl/requirements-lock.txt -r reqctl/requirements-dev-lock.txt --progress-spinner off

