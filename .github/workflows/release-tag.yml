# @req> GUARD-20209566@zkKPlDbnzFuA ltm563
on:
  push:
    branches: [main]

# @req> GUARD-52037270@qgJuN0jv2_H8 mluwis
permissions:
  contents: read

# @req> GUARD-37835776@0Spg60Mwp26J b7hrzj
jobs:
  tag:
    runs-on: ubuntu-latest
    # @req> GUARD-37876391@588H-w2rsk8r 6eylkz
    environment: pypi
    # @req> GUARD-52037270@qgJuN0jv2_H8 e5x4kz
    # @req> GUARD-37876391@588H-w2rsk8r dxwufx
    permissions:
      contents: write
      id-token: write
    steps:
      # @req> GUARD-85664071@zrnITtEG0Lqc t3vtxh
      # @req> GUARD-60575106@cyDaQHsIDZhK dgxdy4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # @req> GUARD-85664071@zrnITtEG0Lqc zq5gnn
      # @req> GUARD-14769016@T01UILpAY633 szwngx
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"

      # @req> GUARD-60575106@cyDaQHsIDZhK csdio5
      # @req> GUARD-14769016@T01UILpAY633 dcuk6f
      # @req> GUARD-37876391@588H-w2rsk8r yzyq3f
      - name: Push the release tag the change first pins the plugin to, attach the reqctl wheel to its release, and fetch the wheel the release carries
        id: release
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/release_tag.py "$BEFORE" "$GITHUB_SHA" dist

      # @req> GUARD-37876391@588H-w2rsk8r whjai5
      # @req> GUARD-34120803@Vbp-5MOZe5-V pqigdq
      - name: Upload the wheel the release carries to PyPI by trusted publishing, with its attestation
        if: steps.release.outputs.dist
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: ${{ steps.release.outputs.dist }}
          skip-existing: true
          attestations: true
