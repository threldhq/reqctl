acceptance_criteria:
- given: a file tracked under the plugin that the paths of no plugin component cover
  then: the build refuses the change, naming the file
  when: the build runs
- given: a file tracked under the plugin that the paths of two plugin components both
    cover
  then: the build refuses the change, naming the file and both components
  when: the build runs
- given: every file tracked under the plugin covered by the paths of exactly one plugin
    component
  then: the build does not refuse the change on that ground
  when: the build runs
- given: a plugin component path that ends in a slash
  then: it covers every file tracked under that directory of the plugin and no other
  when: the build reads which files it covers
- given: a plugin component path that does not end in a slash
  then: it covers the one file at exactly that path of the plugin and no other
  when: the build reads which files it covers
- given: a plugin component path holding *, ? or [
  then: it reads those characters as written, never as a pattern
  when: the build reads which files it covers
