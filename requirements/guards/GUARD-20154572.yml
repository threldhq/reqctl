acceptance_criteria:
- given: a workflow installing reqctl without --require-hashes, or as an editable
    package without --no-deps or --no-build-isolation
  then: the build refuses
  when: the build runs
- given: a workflow installing reqctl from the runtime lockfile alone, without the
    development lockfile the check job also installs
  then: the build does not refuse on that ground
  when: the build runs
- given: installs that differ only in --quiet or --disable-pip-version-check
  then: the build does not refuse on that ground
  when: the build runs
