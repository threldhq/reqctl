acceptance_criteria:
- given: a pattern admitting the stamp of an item that also admits a string one character
    longer or shorter
  then: the build refuses the change
  when: the build runs
- given: a pattern admitting the uid of an item that also admits a prefix reqctl does
    not mint or a number of other than eight digits
  then: the build refuses the change
  when: the build runs
- given: an allowlist for stamps joining its paths and its pattern other than with
    AND
  then: the build refuses the change
  when: the build runs
