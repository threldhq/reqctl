acceptance_criteria:
- given: reqctl/requirements-dev.in naming mypy at one version and reqctl/requirements-dev-lock.txt
    holding another
  then: the build refuses the change, naming mypy and both versions
  when: the build runs
- given: reqctl/requirements-dev.in naming a package without a version
  then: the build refuses the change, naming the package
  when: the build runs
- given: reqctl/requirements-dev.in naming a package reqctl/requirements-dev-lock.txt
    does not hold
  then: the build refuses the change, naming the package
  when: the build runs
- given: reqctl/requirements-dev.in naming a package by a version range rather than
    one version
  then: the build refuses the change, naming the package
  when: the build runs
- given: reqctl/requirements-dev-lock.txt holding a package reqctl/requirements-dev.in
    does not name, which a named one depends on
  then: the build does not refuse on that ground
  when: the build runs
assessed: {}
relations: {}
status: approved
text: If reqctl/requirements-dev-lock.txt does not hold each package that reqctl/requirements-dev.in
  names at the version reqctl/requirements-dev.in states for it, then the build shall
  refuse the change.
