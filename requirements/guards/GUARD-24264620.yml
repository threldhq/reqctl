acceptance_criteria:
- given: a workflow installing by name a package that reqctl/requirements-dev-lock.txt
    holds
  then: the build refuses the change
  when: the build runs
- given: the session-start hook installing by name a package that reqctl/requirements-dev-lock.txt
    holds
  then: the build refuses the change
  when: the build runs
- given: a workflow installing a package that both lockfiles hold from reqctl/requirements-lock.txt
    alone
  then: the build does not refuse on that ground
  when: the build runs
- given: gitleaks installed by its script at one version checked against a SHA-256
  then: the build does not refuse on that ground
  when: the build runs
- given: a workflow installing with -r reqctl/requirements-dev-lock.txt and --require-hashes
  then: the build does not refuse on that ground
  when: the build runs
