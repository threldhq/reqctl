acceptance_criteria:
- given: a tracked plugin file whose text names the [corpus root](corpus_root) as
    the requirements guard hook judges it, and whose digest the [fingerprint list](fingerprint_list)
    does not hold
  then: the build refuses the change
  when: the build checks the change
- given: a digest in the [fingerprint list](fingerprint_list) that no tracked plugin
    file naming the corpus has
  then: the build refuses the change
  when: the build checks the change
