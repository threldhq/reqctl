acceptance_criteria:
- given: a release pull request moving the [reqctl wheel](reqctl_wheel) to 0.1.6 and
    the Claude Code plugin to a source pinned to reqctl--v0.1.6
  then: releases/download/reqctl--v0.1.6/reqctl-0.1.6-py3-none-any.whl of the repository
    serves the [reqctl wheel](reqctl_wheel) built at that merge commit, with no manual
    step
  when: it merges into the default branch and the build pushes reqctl--v0.1.6 at the
    merge commit
- given: a change that reached the default branch, at whose merge commit the build
    pushed reqctl--v0.1.6 while attaching the [reqctl wheel](reqctl_wheel) failed
  then: releases/download/reqctl--v0.1.6/reqctl-0.1.6-py3-none-any.whl of the repository
    serves the [reqctl wheel](reqctl_wheel) built at that merge commit
  when: the build runs on that change again
