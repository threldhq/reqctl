text: While a [release tag](release_tag) stands at the commit of a change that has
  reached the default branch, whether pushed before the build runs on that change
  or while it does, and no GitHub release for that [release tag](release_tag) carries
  a [reqctl wheel](reqctl_wheel), when the build runs on that change, the build shall
  attach the [reqctl wheel](reqctl_wheel) built at that [release tag](release_tag)
  to a GitHub release for that [release tag](release_tag), creating that release where
  none exists.
