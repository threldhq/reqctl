acceptance_criteria:
- given: a [statement citation](statement_citation) reqctl trace reports as behind
    the corpus, in a pull request that changes a file under the [corpus root](corpus_root)
  then: the build names the citation and does not refuse the change
  when: the build runs
- given: a [statement citation](statement_citation) reqctl trace reports as behind
    the corpus, in a pull request that changes no file under the [corpus root](corpus_root)
  then: the build refuses the change and names the citation
  when: the build runs
- given: a [statement citation](statement_citation) reqctl trace reports as behind
    the corpus, in a run no pull request started
  then: the build refuses the change and names the citation
  when: the build runs
