acceptance_criteria:
- given: a change moving the [reqctl wheel](reqctl_wheel) to a new version while the
    plugin marketplace of the repository lists the Claude Code plugin by a source
    pinned to the [release tag](release_tag) of the old one
  then: the build refuses the change
  when: the build runs
- given: the plugin marketplace of the repository listing the Claude Code plugin from
    a path in the repository, pinned to no tag
  then: the build refuses the change
  when: the build runs
- given: the plugin marketplace of the repository listing no Claude Code plugin
  then: the build refuses the change
  when: the build runs
