acceptance_criteria:
- given: a step running a gate whose command discards its failure through an or-list
    running true
  then: the build refuses the change
  when: the build runs
- given: a step running a gate whose script begins with set +e
  then: the build refuses the change
  when: the build runs
- given: 'a step running a gate under if: false'
  then: the build refuses the change
  when: the build runs
- given: a step running a gate in a job that sets continue-on-error
  then: the build refuses the change
  when: the build runs
- given: a step running no gate whose command discards its failure through an or-list
    running true
  then: the build does not refuse the change on that ground
  when: the build runs
assessed:
