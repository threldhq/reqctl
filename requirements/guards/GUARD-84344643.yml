acceptance_criteria:
- given: a step running a gate whose command pipes the gate into another command
  then: the build refuses the change
  when: the build runs
- given: a step running a gate whose command joins the gate to another command with
    &&
  then: the build refuses the change
  when: the build runs
- given: a step running a gate whose command separates the gate from another command
    with ;
  then: the build refuses the change
  when: the build runs
- given: a step running a gate as the condition of a shell if
  then: the build refuses the change
  when: the build runs
- given: a step running a gate whose script holds a second line, such as an install
    before the gate
  then: the build refuses the change
  when: the build runs
- given: a step running a gate whose command discards its failure through an or-list
  then: the build refuses the change
  when: the build runs
- given: a step running a gate whose command negates the gate with !
  then: the build refuses the change
  when: the build runs
- given: a step running a gate under a shell other than bash or sh, such as python
    or pwsh
  then: the build refuses the change
  when: the build runs
- given: 'a step running a gate under if: false'
  then: the build refuses the change
  when: the build runs
- given: a step running a gate in a job that sets continue-on-error
  then: the build refuses the change
  when: the build runs
- given: a step whose script runs a gate alone, with its arguments, under bash, sh
    or no shell named
  then: the build does not refuse the change on that ground
  when: the build runs
- given: a step running no gate whose command discards its failure through an or-list
    running true
  then: the build does not refuse the change on that ground
  when: the build runs
- given: a step whose own script checks a condition across several lines and exits
    non-zero, calling no gate
  then: the build does not refuse the change on that ground
  when: the build runs
