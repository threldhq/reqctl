acceptance_criteria:
- given: 'a body writing Refs #N where N is an issue of this repository'
  then: the body names an issue
  when: the build checks it
- given: 'a body writing Closes #N where N is a pull request'
  then: the body names no issue
  when: the build checks it
- given: 'a body writing #N with no keyword before it'
  then: the body names no issue
  when: the build checks it
- given: 'a body writing closes: #N or FIXES #N where N is an issue of this repository'
  then: the body names an issue
  when: the build checks it
- given: 'a body writing Refs # N, a space between # and the number'
  then: the body names no issue
  when: the build checks it
- given: 'a body writing Refs #N where the build cannot learn whether N is an issue'
  then: the body names no issue and the refusal names N
  when: the build checks it
