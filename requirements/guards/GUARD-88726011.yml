acceptance_criteria:
- given: a pull request dependabot opened whose body holds no [evidence block](evidence_block)
  then: the build does not refuse it on that ground
  when: the build checks it
- given: a body holding the [evidence block](evidence_block) and, beside it, the verdicts
    the session added
  then: the build does not refuse it on that ground
  when: the build checks it
- given: a body whose [evidence block](evidence_block) differs from the one reqctl
    prints for the head commit only in the gate steps it states
  then: the build does not refuse it on that ground
  when: the build checks it
- given: a pull request changing only files under the [corpus root](corpus_root)
  then: the build does not refuse it on that ground
  when: the build checks it
