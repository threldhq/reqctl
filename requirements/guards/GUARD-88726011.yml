text: If the body of a pull request that dependabot did not open and that changes
  a file outside the [corpus root](corpus_root) does not hold, other than in the gate
  steps and the verdicts that the body states, the [evidence block](evidence_block)
  that reqctl prints for the head commit of the pull request, then the build shall
  refuse the pull request.
