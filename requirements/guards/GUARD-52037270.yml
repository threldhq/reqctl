acceptance_criteria:
- given: a workflow stating no permissions
  then: the build refuses the change
  when: the build runs
- given: a workflow granting read access to contents with a job in it, other than
    the job that pushes a [release tag](release_tag), granting write access to contents
  then: the build refuses the change
  when: the build runs
- given: the job that pushes a [release tag](release_tag) granting write access to
    contents and to pull requests
  then: the build refuses the change
  when: the build runs
- given: the workflow holding the job that pushes a [release tag](release_tag) granting
    write access to contents at the workflow level
  then: the build refuses the change
  when: the build runs
