acceptance_criteria:
- given: a file holding a comment line that is neither a [statement citation](statement_citation)
    nor a tool directive the comment budget names against the file
  then: the build refuses the change
  when: the build runs
- given: a comment holding commented-out code
  then: the build refuses the change
  when: the build runs
- given: a comment holding a [statement citation](statement_citation) and other words
  then: the build refuses the change
  when: the build runs
- given: a directive the comment budget names against one file, written in another
    file
  then: the build refuses the change
  when: the build runs
- given: a binary file, or a file whose first five lines say the file is generated
  then: the build counts nothing in the file
  when: the build runs
