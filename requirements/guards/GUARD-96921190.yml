acceptance_criteria:
- given: a pull request changing a requirement's text and a code file
  then: the build refuses the change and names the files on each side
  when: the build runs
- given: a pull request changing a requirement's text and re-pinning a [statement
    citation](statement_citation) of it
  then: the build does not refuse the change
  when: the build runs
- given: a pull request changing the baseline and a code file
  then: the build does not refuse the change
  when: the build runs
- given: a pull request changing only the pins a corpus item records as assessed and
    a code file
  then: the build does not refuse the change
  when: the build runs
- given: a pull request changing a requirement's text and adding a [statement citation](statement_citation)
    of it
  then: the build refuses the change
  when: the build runs
- given: a pull request changing a schema under the [corpus root](corpus_root) and
    a code file
  then: the build refuses the change
  when: the build runs
