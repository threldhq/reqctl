acceptance_criteria:
- given: a help string written as a string literal or an f-string
  then: the build counts the string
  when: the build runs
- given: a help string built by joining strings or by calling a function
  then: the build refuses the change
  when: the build runs
- given: a helper function passing on the help text a caller gives, where a caller
    gives text that is not written out
  then: the build refuses the change
  when: the build runs
