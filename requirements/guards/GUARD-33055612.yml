acceptance_criteria:
- given: no [gate results file](gate_results_file)
  then: the build takes its steps and states no fault
  when: .github/verify.py starts
- given: a [gate results file](gate_results_file) an earlier run wrote, and a run
    that stops before it has taken every step
  then: no [gate results file](gate_results_file) is left
  when: the run stops
- given: a [gate results file](gate_results_file) the build cannot remove
  then: the build stops .github/verify.py and states the fault
  when: .github/verify.py starts
