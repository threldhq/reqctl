acceptance_criteria:
- given: pyproject.toml declaring a lowest version of PyYAML above the version requirements-lock.txt
    holds
  then: the build refuses, naming PyYAML and both versions, and rewrites no file
  when: the build runs
- given: requirements-lock.txt holding a package no requirement of pyproject.toml
    names, which a declared one depends on
  then: the build does not refuse on that ground
  when: the build runs
