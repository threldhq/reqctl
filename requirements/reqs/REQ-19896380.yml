acceptance_criteria:
- given: a requirement cited by a [test](test) and by code outside every [test](test)
  then: the product names the code outside every [test](test) and names no [test](test)
  when: reqctl context is run for the requirement
- given: a requirement cited by a [test](test) and by code outside every [test](test)
  then: the [portal](portal) names no [test](test) as citing the requirement
  when: the [portal](portal) shows the requirement
- given: a requirement cited by a [test](test)
  then: the product names the [test](test) only in reporting as a problem the [statement
    citation](statement_citation) the [test](test) carries or a [whole-file citation](whole_file_citation)
    of the [test](test)
  when: trace is run
