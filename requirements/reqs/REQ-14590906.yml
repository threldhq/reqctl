acceptance_criteria:
- given: origin's default branch is main and the local origin/HEAD ref names feature
  then: the product refuses the [tool call](tool_call)
  when: git push writes to main on origin
- given: origin's default branch is main and the local origin/HEAD ref names feature
  then: the product does not refuse the [tool call](tool_call) on that ground
  when: git push writes to feature on origin
- given: origin's default branch is main and the local origin/HEAD ref names feature
  then: the product refuses the [tool call](tool_call)
  when: gh api, an HTTP request to api.github.com or a connector call writes a file
    to main
- given: origin cannot be reached when the [tool call](tool_call) is judged
  then: the product refuses the [tool call](tool_call)
  when: a [tool call](tool_call) writes through git push, a gh command, a request
    to GitHub's API or a GitHub connector
- given: origin has not reported its default branch within ${origin_query_seconds}
    of the product asking
  then: the product refuses the [tool call](tool_call)
  when: a [tool call](tool_call) writes through git push, a gh command, a request
    to GitHub's API or a GitHub connector
