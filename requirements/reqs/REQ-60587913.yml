acceptance_criteria:
- given: a git push carrying --force, -f or a flag cluster holding f such as -uf
  then: the product refuses it and names the flag
  when: the [tool call](tool_call) is made
- given: a git push carrying --force-with-lease or --force-if-includes
  then: the product refuses it
  when: the [tool call](tool_call) is made
- given: a git push carrying --mirror, --delete or -d
  then: the product refuses it
  when: the [tool call](tool_call) is made
- given: a git push naming a refspec that begins with + or :, quoted or not
  then: the product refuses it
  when: the [tool call](tool_call) is made
- given: a force push inside sh -c, or after an env, command or assignment prefix
  then: the product refuses it
  when: the [tool call](tool_call) is made
- given: a git push carrying -u, -n or --follow-tags, or naming a refspec with a colon
    inside it
  then: the product does not refuse it as a force push
  when: the [tool call](tool_call) is made
