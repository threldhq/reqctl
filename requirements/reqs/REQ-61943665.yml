acceptance_criteria:
- given: a source whose first attempt ends in a [transient failure](transient_failure)
    and whose second serves its page
  then: the product reads the page and names no fault for the source
  when: the review is checked
- given: a source whose every attempt ends in a [transient failure](transient_failure)
  then: the product makes ${review_limits.fetch_attempts.quantity} attempts at the
    source, refuses the review, and names the failure of the last attempt only
  when: the review is checked
- given: a source whose server answers with a status that is not a [transient failure](transient_failure)
  then: the product makes one attempt at the source
  when: the review is checked
