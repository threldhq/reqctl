acceptance_criteria:
- given: a repository whose corpus holds no data item named review_limits, and whose
    [settings file](settings_file) states no page_bytes quantity
  then: the product reads no more of a page than ${review_limits.page_bytes.quantity}
    bytes
  when: the [best-in-class review](best_in_class_review) is checked there
- given: a repository whose corpus holds a data item named review_limits whose page_bytes
    entry states another quantity, and whose [settings file](settings_file) states
    no page_bytes quantity
  then: the product reads no more of a page than ${review_limits.page_bytes.quantity}
    bytes
  when: the [best-in-class review](best_in_class_review) is checked there
- given: a repository whose corpus states a challenge_roles data item, or an elucidate_agents
    data item naming other models or efforts, and whose [settings file](settings_file)
    states no model or effort for any agent
  then: the product spawns each agent on the model and at the effort that ${elucidate_agents}
    states for it
  when: a run is built there
