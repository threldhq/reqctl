acceptance_criteria:
- given: a repository whose corpus holds no parameter named review_page_bytes
  then: the product reads no more of a page than ${review_page_bytes} bytes
  when: the [best-in-class review](best_in_class_review) is checked there
- given: a repository whose corpus holds a parameter named review_page_bytes stating
    another value
  then: the product reads no more of a page than ${review_page_bytes} bytes
  when: the [best-in-class review](best_in_class_review) is checked there
- given: a repository whose corpus states a challenge_roles data item, or an elucidate_agents
    data item naming other models or efforts
  then: the product spawns each agent on the model and at the effort that ${elucidate_agents}
    states for it
  when: a run is built there
