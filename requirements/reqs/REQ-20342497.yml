acceptance_criteria:
- given: a [data item](data_item) whose schema declares an [addressable block](addressable_block)
  then: the product refuses, naming the key and the block, and states renaming the
    [entry](entry) as the fix
  when: an [entry](entry) keyed for the block's name is [minted](mint) or revised
    into the [data item](data_item)
- given: a corpus holding a [data item](data_item) with an [entry](entry) keyed for
    the name of an [addressable block](addressable_block)
  then: the product refuses and names the key
  when: the corpus is validated
- given: a [data item](data_item) holding an [entry](entry) keyed for the name of
    an [addressable block](addressable_block) the schema governing it under a new
    name declares
  then: the product refuses the rename, naming the key, and changes nothing
  when: reqctl rename gives the [data item](data_item) that name
