acceptance_criteria:
- given: a parameter [minted](mint) with a bracketed set
  then: the product refuses and states that a set member is duplicated
  when: the set states one member more than once
- given: a parameter whose value is revised to a bracketed set
  then: the product refuses and states that a set member is duplicated
  when: the set states one member more than once
- given: a [data item](data_item)
  then: the product refuses and names the key given more than once
  when: an [entry](entry) list names one key more than once
- given: a parameter whose value type is duration
  then: the product refuses and states that a set member is duplicated
  when: the set states one number in two spellings
