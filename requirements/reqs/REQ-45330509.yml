text: Where the lines a [statement citation](statement_citation) covers are TypeScript,
  in a .ts or a .tsx file, the product shall take into the [citation digest](citation_digest),
  as it takes the covered lines, each function, each const, let or var binding and
  each enum declared at the top level of the same file to which a name in those lines
  resolves without running the code, and no declaration that only a name in those
  declarations resolves to.
