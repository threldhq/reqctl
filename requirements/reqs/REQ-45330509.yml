acceptance_criteria:
- given: a .tsx file whose covered lines render a JSX element named as a function
    declared at the top level of the file
  then: the [citation digest](citation_digest) takes in that function
  when: the product takes the [citation digest](citation_digest)
- given: a .ts file whose covered lines name an enum declared at the top level of
    the file
  then: the [citation digest](citation_digest) takes in that enum
  when: the product takes the [citation digest](citation_digest)
- given: a .ts file whose covered lines call a top-level function that calls a second
    top-level function, which the covered lines do not name
  then: the [citation digest](citation_digest) does not take in the second function
  when: the product takes the [citation digest](citation_digest)
