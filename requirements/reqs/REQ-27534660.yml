acceptance_criteria:
- given: a repository whose [settings file](settings_file) sets the uncited-code mode
    to all, and a function that no [statement citation](statement_citation) covers
    and no [citation digest](citation_digest) takes in
  then: the product reports each line of the function as a problem
  when: trace is run
- given: a repository whose [settings file](settings_file) sets the uncited-code mode
    to all, and a Python helper that no [statement citation](statement_citation) covers
    but a cited line calls by name
  then: the product reports no line of the helper
  when: trace is run
- given: a repository whose [settings file](settings_file) sets the uncited-code mode
    to all, and a lockfile an [item](item) holds a [whole-file citation](whole_file_citation)
    of
  then: the product reports no line of the lockfile
  when: trace is run
- given: a repository whose [settings file](settings_file) states no uncited-code
    mode, and a function no [statement citation](statement_citation) covers
  then: the product reports no line of the function as uncited
  when: trace is run
- given: a repository whose [settings file](settings_file) sets the uncited-code mode
    to all, and a file in a folder the product skips when it scans for [statement
    citations](statement_citation)
  then: the product reports no line of the file
  when: trace is run
- given: a repository whose [settings file](settings_file) sets the uncited-code mode
    to all, and an uncited [unknown-syntax file](unknown_syntax_file)
  then: the product reports no line of the file
  when: trace is run
