acceptance_criteria:
- given: a term whose reason for a phrase it does not claim links the reworded term
    showing the word
  then: the link in the reason shows the replacement and still links the term
  when: revise is run with the reword
- given: a [data item](data_item) whose [entry](entry) field the schema declares as
    prose links the reworded term showing the word
  then: the link in the field shows the replacement and still links the term
  when: revise is run with the reword
- given: a draft [item](item) whose text links the reworded term showing the word
  then: the link in the text shows the replacement
  when: revise is run with the reword
