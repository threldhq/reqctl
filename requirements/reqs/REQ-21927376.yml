acceptance_criteria:
- given: an idea that a [practice](practice) the review recommends adopting bears
    on
  then: that [practice](practice), assessed against the README at the [project root](project_root)
    for fit to the project and then adapted to the approved requirements the idea
    touches, is proposed as the default answer, and no [proposal](proposal) beyond
    it is drafted until the owner answers
  when: the owner's words are converted
- given: an adapted [practice](practice) that conflicts with an approved requirement
  then: the conflict is named with the requirement it conflicts with and put to the
    owner as a [question for the owner](question_for_the_owner)
  when: it is proposed as the default answer
- given: no README at the [project root](project_root)
  then: it is adapted to the approved requirements the idea touches without a fit
    assessment, and the run states that no README was found
  when: a [practice](practice) is proposed as the default answer
- given: an idea that no [practice](practice) the review recommends adopting bears
    on
  then: the idea is converted as the owner's words state it
  when: the owner's words are converted
