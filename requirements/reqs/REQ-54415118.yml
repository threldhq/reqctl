acceptance_criteria:
- given: a branch changing code that enforces a [rule of the build](rule_of_the_build)
    a guard states, the change citing nothing
  then: the guard is cited over the change before the pass goes on
  when: the pre-pr skill makes its pass over the branch
- given: a branch changing code that enforces a [rule of the build](rule_of_the_build)
    no guard states
  then: the pass stops, and the owner is asked to create the governing statement
  when: the pre-pr skill makes its pass over the branch
- given: a branch changing only code that carries the build, such as dependency pins,
    CI wiring or lockfiles
  then: the pass cites nothing over the change and does not stop for want of a [citation](statement_citation)
  when: the pre-pr skill makes its pass over the branch
