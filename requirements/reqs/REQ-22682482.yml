text: If an [entry](entry) of a [data item](data_item) holds a field that the governing
  schema does not declare by name for that [entry](entry) and that the [data item](data_item)
  does not name in its own list of the fields its [entries](entry) hold, and the governing
  schema is not one named for the [data item](data_item) that refuses every such field
  of that [entry](entry) or states a schema each must fit, then the product shall
  refuse the [data item](data_item), naming the field.
