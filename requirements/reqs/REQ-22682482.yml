acceptance_criteria:
- given: a [data item](data_item) whose fields list names quantity
  then: the product refuses, naming quantty and the fields the [data item](data_item)
    lists
  when: reqctl revise gives an [entry](entry) a field named quantty
- given: a [data item](data_item) whose [entries](entry) hold only fields the governing
    schema declares by name, and which states no fields list
  then: the product accepts the [data item](data_item)
  when: the corpus is validated
- given: a [data item](data_item) that no schema is named for, whose [entry](entry)
    holds a field model that the [kind schema](kind_schema) admits without declaring
    it by name and that its fields list does not name
  then: the product refuses the [data item](data_item), naming model
  when: the corpus is validated
- given: a [data item](data_item) whose fields list names a field the governing schema
    forbids
  then: the product refuses the field as the governing schema does not admit it
  when: the corpus is validated
- given: a schema named for a [data item](data_item) that declares quantity by name
    in the schema it states for each [entry](entry), and an [entry](entry) holding
    quantity that no fields list names
  then: the product accepts the [data item](data_item)
  when: the corpus is validated
- given: a schema named for a [data item](data_item) that states for the [entry](entry)
    keyed other a schema of its own declaring viewed by name, and that [entry](entry)
    holding viewed
  then: the product accepts the [data item](data_item)
  when: the corpus is validated
- given: a schema named for a [data item](data_item) whose schema for each [entry](entry)
    declares reviewed by name and states a schema each other field must fit, and an
    [entry](entry) holding a field offering that fits it and that no fields list names
  then: the product accepts the [data item](data_item)
  when: the corpus is validated
- given: a schema named for a [data item](data_item) whose schema for each [entry](entry)
    refuses every field it does not declare by name, and an [entry](entry) holding
    a field quantty
  then: the product refuses quantty as that schema does not admit it, and names no
    fields list as the remedy
  when: the corpus is validated
