acceptance_criteria:
- given: a [data item](data_item) whose fields list names quantity
  then: the product refuses, naming quantty and the fields the [data item](data_item)
    lists
  when: reqctl revise gives an [entry](entry) a field named quantty
- given: a [data item](data_item) whose [entries](entry) hold only fields the [kind
    schema](kind_schema) declares by name, and which states no fields list
  then: the product accepts the [data item](data_item)
  when: the corpus is validated
- given: a [data item](data_item) whose [entry](entry) holds a field model that its
    fields list does not name
  then: the product refuses the [data item](data_item), naming model
  when: the corpus is validated
- given: a [data item](data_item) whose fields list names a field the [kind schema](kind_schema)
    forbids
  then: the product refuses the field as the [kind schema](kind_schema) does not admit
    it
  when: the corpus is validated
