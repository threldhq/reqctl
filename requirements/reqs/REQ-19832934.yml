acceptance_criteria:
- given: a recall return that stopped at the output bound with forty [proposals](proposal)
    in the batch
  then: the shard's prompts are rebuilt carrying at most twenty [proposals](proposal)
    each, and the stopped return is retired
  when: the returns are read
- given: a recall return that does not fit the recall shape
  then: the shard's prompts are rebuilt in batches of half the size
  when: the returns are read
- given: a recall agent that wrote no return
  then: the shard's prompts are rebuilt in batches of half the size
  when: the returns are read
