acceptance_criteria:
- given: a [statement citation](statement_citation) of a requirement whose acceptance
    criterion was revised after the [statement citation](statement_citation) was [pinned](pin)
  then: it shows the requirement's text and acceptance criteria as they read at the
    [stamp](stamp) the [statement citation](statement_citation) is [pinned](pin) to,
    beside them as they read now
  when: trace reports the [statement citation](statement_citation)
- given: an [item](item) binding a parameter whose value was revised
  then: it shows the parameter's value as it read at the [stamp](stamp) the binder
    is [pinned](pin) to, beside the value now
  when: reqctl validate or reqctl context reports the binder as suspect
- given: a [statement citation](statement_citation) of one [entry](entry) of a [data
    item](data_item), the [entry](entry) since revised
  then: it shows that [entry](entry) and the [data item](data_item)'s own fields as
    they read at the [stamp](stamp) the [statement citation](statement_citation) is
    [pinned](pin) to, beside them as they read now
  when: trace reports the [statement citation](statement_citation)
