text: When the product reports a [statement citation](statement_citation) naming a
  [stamp](stamp) that the [item](item) it names no longer carries, or reports an [item](item)
  it has made suspect, the product shall show each field the [stamp](stamp) of the
  named or bound [item](item) covers as it reads now, beside that field as the history
  reachable from HEAD holds it at the [stamp](stamp) the [statement citation](statement_citation)
  or the suspect [item](item) is [pinned](pin) to.
