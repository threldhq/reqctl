acceptance_criteria:
- given: hook input that does not parse as a JSON object, including input cut off
    part way
  then: the product refuses the [tool call](tool_call) rather than crash
  when: the product reads it
- given: a [tool call](tool_call) whose input is not an object, or whose file path,
    notebook path, command or edit text is not a string
  then: the product refuses it
  when: the product reads it
- given: a [tool call](tool_call) whose path field holds a number
  then: the product refuses it
  when: the product reads it
