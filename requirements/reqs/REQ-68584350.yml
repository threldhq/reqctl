acceptance_criteria:
- given: 'an [item](item) file holding renameable: yes'
  then: the product refuses the command, naming the file and yes
  when: the corpus is validated
- given: 'a [settings file](settings_file) holding mode: off'
  then: the product refuses the command, naming the file and off, and naming quoting
    the word as a step that clears the refusal
  when: a command reads the [settings file](settings_file)
- given: 'an [item](item) file holding country: NO'
  then: the product refuses the command rather than reading NO as false or as text
  when: the corpus is validated
- given: a schema file holding a mapping key yes
  then: the product refuses the command, naming the file and yes
  when: a command loads the schema file
- given: 'an [item](item) file holding renameable: ''yes'''
  then: the product refuses nothing on that ground
  when: the corpus is validated
- given: 'an [item](item) file holding renameable: true'
  then: the product refuses nothing on that ground
  when: the corpus is validated
