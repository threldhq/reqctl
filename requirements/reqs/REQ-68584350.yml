  unquoted, as a value or as a mapping key, a word that ${yaml_boolean_spellings}
  lists, in a casing it lists for that word, then the product shall refuse each command
  that loads the file, naming the file and the word, and naming writing true or false,
  or quoting the word, as the steps that clear the refusal.
