acceptance_criteria:
- given: a repository holding no third-party notices file
  then: it creates THIRD_PARTY_NOTICES.md at the repository's root and records the
    copy there
  when: the session copies an example's code
- given: a repository already holding a third-party notices file
  then: it records the copy in that file
  when: the session copies an example's code
- given: a copy recorded in the notices file
  then: no comment in it names the source
  when: the copied code is read
