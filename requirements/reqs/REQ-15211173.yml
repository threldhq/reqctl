acceptance_criteria:
- given: a [data item](data_item) whose schema declares a field beside its [entries](entry)
    without marking it addressable
  then: the product refuses and names the reference or the link
  when: a statement referencing or linking a key of that field is written
- given: a corpus holding a statement that references a key of a field its [data item](data_item)'s
    schema does not mark addressable
  then: the product refuses and names the reference
  when: the corpus is validated
- given: a [data item](data_item) whose schema declares a field beside its [entries](entry)
    without marking it addressable
  then: the product refuses the revision and changes nothing
  when: reqctl revise names a key of that field as the [entry](entry) to change, add
    or drop
