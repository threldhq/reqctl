acceptance_criteria:
- given: a [corpus root](corpus_root) holding a [settings file](settings_file) that
    states a value under review_limits.page_byte
  then: the product refuses the corpus, naming the file and the key
  when: the corpus is validated
- given: a [corpus root](corpus_root) holding a [settings file](settings_file) that
    states a whole number below one for the quantity of the fetch_attempts [entry](entry)
    of review_limits
  then: the product refuses the corpus, naming the file, the key and the value
  when: the corpus is validated
- given: a [corpus root](corpus_root) holding no [settings file](settings_file)
  then: the product does not refuse the corpus for want of one
  when: the corpus is validated
