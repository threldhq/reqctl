acceptance_criteria:
- given: origin's default branch is main
  then: the product refuses the [tool call](tool_call) and names a branch and a pull
    request as the route
  when: a connector call writes a file naming branch main, or naming no branch
- given: origin's default branch is main
  then: the product refuses the [tool call](tool_call)
  when: gh api, another gh command or an HTTP request to api.github.com named in the
    [tool call](tool_call) writes a file to main, moves its ref, renames it or deletes
    it
- given: origin's default branch is main
  then: the product refuses the [tool call](tool_call)
  when: git push writes to main on origin, including git push -u origin feature:main
    and git push origin HEAD:main
- given: a write whose target branch the product cannot resolve, or an origin naming
    no default branch
  then: the product refuses the [tool call](tool_call)
  when: the [tool call](tool_call) is made
- given: origin's default branch is main
  then: the product does not refuse the [tool call](tool_call) on that ground
  when: a [tool call](tool_call) writes to another branch, creates a tag or changes
    the protection of main
- given: an open pull request into main
  then: the product does not refuse the [tool call](tool_call) on that ground
  when: a [tool call](tool_call) merges it, through a connector or gh pr merge with
    or without --admin
