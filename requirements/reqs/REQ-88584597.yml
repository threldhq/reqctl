acceptance_criteria:
- given: a source whose server sends its page a few bytes at a time, each within the
    product's wait for one read, for longer than ${review_fetch_seconds} seconds
  then: the product refuses the review and names the source, having stopped reading
    the source once ${review_fetch_seconds} seconds had passed
  when: the review is checked
- given: a source whose redirects and page together take longer than ${review_fetch_seconds}
    seconds, though no one response does
  then: the product refuses the review and names the source
  when: the review is checked
- given: a source whose response carries interim responses, chunk framing or trailers
    without end
  then: the product refuses the review and names the source once ${review_fetch_seconds}
    seconds have passed
  when: the review is checked
- given: a source whose fetch waits for an earlier fetch under its host name to end
  then: the product counts none of the wait toward the ${review_fetch_seconds} seconds
  when: the review is checked
