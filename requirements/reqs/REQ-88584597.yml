acceptance_criteria:
- given: a source whose server sends its page a few bytes at a time, each within the
    product's wait for one read, for longer than ${review_limits.fetch_seconds.quantity}
    seconds on every attempt
  then: the product ends each attempt once ${review_limits.fetch_seconds.quantity}
    seconds of it have passed, then refuses the review and names the source
  when: the review is checked
- given: a source whose redirects and page together take longer than ${review_limits.fetch_seconds.quantity}
    seconds, though no one response does
  then: the product ends the attempt once ${review_limits.fetch_seconds.quantity}
    seconds of it have passed
  when: the review is checked
- given: a source whose response carries interim responses, chunk framing or trailers
    without end
  then: the product ends the attempt once ${review_limits.fetch_seconds.quantity}
    seconds of it have passed
  when: the review is checked
- given: a source whose first attempt takes longer than ${review_limits.fetch_seconds.quantity}
    seconds and whose second serves its page at once
  then: the product reads the page and names no fault for the source
  when: the review is checked
- given: a source whose fetch waits for an earlier fetch under its host name to end
  then: the product counts none of the wait toward an attempt's ${review_limits.fetch_seconds.quantity}
    seconds
  when: the review is checked
