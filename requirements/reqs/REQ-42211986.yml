acceptance_criteria:
- given: a file whose licence is copyleft, weak copyleft included
  then: it copies none of it and writes its own code from the idea
  when: the session would copy its code
- given: a receiving repository whose licence the ${licence_compatibility} [entry](entry)
    for the file's licence does not name
  then: it copies none of it and writes its own code from the idea
  when: the session would copy the file's code
- given: a file stating no SPDX licence identifier with no licence file in any folder
    above it
  then: it copies none of it and writes its own code from the idea
  when: the session would copy its code
