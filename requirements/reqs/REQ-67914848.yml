acceptance_criteria:
- given: a parameter whose value is a set
  then: the product refuses and states that the default is not a member of the set
  when: a default naming no member of the set is stated
- given: a [data item](data_item)
  then: the product refuses and states that the default is not an [entry](entry)
  when: a default naming no [entry](entry) of the [data item](data_item) is stated
- given: a corpus holding an [item](item) whose default names no [entry](entry) of
    that [item](item)
  then: the product refuses and names the default
  when: the corpus is validated
