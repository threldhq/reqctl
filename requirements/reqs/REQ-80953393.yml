acceptance_criteria:
- given: a library naming two sources, one whose [page text](page_text) holds words
    only in its title elements and not the passage, the other holding its passage
  then: the product sets the first source aside, keeps the library with the second
    source, and does not refuse the check
  when: the check is checked
- given: a source whose [page text](page_text) holds a word outside its title elements
    and does not hold the passage quoted from it
  then: the product refuses the check and names the source
  when: the check is checked
