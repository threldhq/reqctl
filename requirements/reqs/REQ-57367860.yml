acceptance_criteria:
- given: a change that edits a line covered by a [statement citation](statement_citation)
    naming a [stamp](stamp) its requirement no longer carries
  then: the product reports the [statement citation](statement_citation) as a problem
  when: trace is given the change's base branch
- given: a change that adds a [statement citation](statement_citation) naming a [stamp](stamp)
    its requirement no longer carries
  then: the product reports the [statement citation](statement_citation) as a problem
  when: trace is given the change's base branch
- given: a pull request touching a file under the [corpus root](corpus_root) in more
    than its [citation list](citation_list) and moving a [statement citation](statement_citation)
    naming a [stamp](stamp) its requirement no longer carries
  then: the product refuses the pull request
  when: the ${corpus_gates.traceability} gate runs trace against the pull request's
    base branch
- given: a [statement citation](statement_citation) the base branch added after the
    change branched from it
  then: the product does not count the [statement citation](statement_citation) as
    one the change added
  when: trace is given that base branch
