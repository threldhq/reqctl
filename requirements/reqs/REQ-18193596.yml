acceptance_criteria:
- given: an [item](item) with two [statement citations](statement_citation), one of
    which the branch touches
  then: the prompt holds the code both [citation digests](citation_digest) take in
  when: the prompt of its [reading agent](reading_agent) is built
- given: a [data item](data_item) the branch touches
  then: the prompt holds the text and each [entry](entry) of the [data item](data_item)
    as reqctl context prints them
  when: the prompt of its [reading agent](reading_agent) is built
- given: a requirement whose statement names a parameter and links a term
  then: the prompt holds the value of the parameter and the definition of the term
    as reqctl context prints them
  when: the prompt of its [reading agent](reading_agent) is built
- given: a [statement citation](statement_citation) in a Python file whose covered
    lines name a function of the [code base](code_base)
  then: the prompt holds the function, as far as the [citation digest](citation_digest)
    takes it in
  when: the prompt of its [reading agent](reading_agent) is built
- given: an [item](item) the branch touches only through a [whole-file citation](whole_file_citation)
  then: the prompt holds the file
  when: the prompt of its [reading agent](reading_agent) is built
- given: a function that the covered lines of a [statement citation](statement_citation)
    name, changed while the covered lines stand
  then: the prompt differs from the prompt built before the change
  when: the prompt of the [reading agent](reading_agent) of the [item](item) is built
    again
