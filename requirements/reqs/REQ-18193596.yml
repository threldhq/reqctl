text: When the ${plugin_components.pre_pr_skill} spawns a [reading agent](reading_agent)
  for an [item](item), the product shall build the prompt of the [reading agent](reading_agent)
  by a script from the text, acceptance criteria, value and [entries](entry) that
  reqctl context prints for the [item](item), the value of each parameter and [data
  item](data_item) and the definition of each term that reqctl context prints as named
  by the [item](item), the code that the [citation digest](citation_digest) of each
  [statement citation](statement_citation) of the [item](item) touched by the branch
  takes in, and each file that a [whole-file citation](whole_file_citation) of the
  [item](item) touched by the branch holds.
