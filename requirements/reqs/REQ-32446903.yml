acceptance_criteria:
- given: a run of the elucidate skill whose [challenge](challenge) raises no [question
    for the owner](question_for_the_owner)
  then: the product puts to the owner, as a [question for the owner](question_for_the_owner),
    which of the run's [proposals](proposal) to [mint](mint), and states with it that
    the [challenge](challenge) raised none
  when: its verdicts are read and its coverage findings are checked
- given: a run of the elucidate skill whose [challenge](challenge) raises [questions
    for the owner](question_for_the_owner)
  then: the product puts which of the run's [proposals](proposal) to [mint](mint)
    to the owner in the same message as those questions
  when: its verdicts are read and its coverage findings are checked
- given: a run of the elucidate skill whose owner declines to [mint](mint) one of
    its [proposals](proposal)
  then: the description states that [proposal](proposal) in the run's declined list
    with the owner's reason
  when: the run's pull request description is rendered
