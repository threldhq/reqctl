acceptance_criteria:
- given: a corpus holding a [data item](data_item) named value_types, and an [entry](entry)
    of a [data item](data_item) whose at_most names an [entry](entry) the [data item](data_item)
    does not hold
  then: the product refuses the [data item](data_item) and names the at_most
  when: the [data item](data_item) is written
- given: a corpus holding a [data item](data_item) named value_types, and an [entry](entry)
    of a [data item](data_item) whose at_least names an [entry](entry) stating no
    quantity
  then: the product refuses the [data item](data_item) and names the at_least
  when: the [data item](data_item) is written
- given: a corpus holding a [data item](data_item) named value_types, and an [entry](entry)
    stating the value type duration whose at_least names an [entry](entry) stating
    the value type size
  then: the product refuses the [data item](data_item), stating that a duration and
    a size cannot be compared
  when: the [data item](data_item) is written
- given: a corpus holding no [data item](data_item) named value_types, and an [entry](entry)
    of a [data item](data_item) whose at_most names an [entry](entry) the [data item](data_item)
    does not hold
  then: the product accepts the [data item](data_item)
  when: the corpus is validated
