acceptance_criteria:
- given: a run recording a binding as an empty list
  then: the product refuses the run and states that the form is a list of members
    or all
  when: the run is built
- given: a run recording one proposal twice under a dimension, once as 3 and once
    as "3"
  then: the product refuses the run
  when: the run is built
- given: a run recording its bindings as a list rather than by dimension
  then: the product refuses the run and states the form
  when: the run is built
