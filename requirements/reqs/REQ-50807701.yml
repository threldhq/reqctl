acceptance_criteria:
- given: a passage ending in a full stop, whose page holds its words followed by a
    comma
  then: the product names no fault for the source
  when: the review is checked
- given: a passage ending in a full stop and a closing quotation mark, whose page
    holds its words followed by a comma
  then: the product names no fault for the source
  when: the review is checked
- given: a passage holding a full stop before its last word, whose page holds its
    words with a comma in place of that full stop
  then: the product refuses the review and names the source as not holding the passage
  when: the review is checked
- given: a passage holding nothing but full stops, exclamation marks and question
    marks
  then: the product refuses the review
  when: the review is checked
