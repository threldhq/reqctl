acceptance_criteria:
- given: a repository's own copy of a [kind schema](kind_schema) states a field without
    a marker the shipped schema carries on that field
  then: the product refuses the copy and names its path, the field and the marker
  when: reqctl validate runs
- given: a repository's own copy of a [kind schema](kind_schema) states a field without
    a marker the shipped schema carries on that field
  then: the product refuses the copy
  when: any other command that reads that [kind schema](kind_schema) runs
- given: a repository's own copy of a [kind schema](kind_schema) leaves out a field
    the shipped schema states
  then: the product does not refuse the copy for that field
  when: a command reads the copy
- given: a repository's own copy of a [kind schema](kind_schema) gives a marker another
    value than the shipped schema gives it
  then: the product does not refuse the copy for that value
  when: a command reads the copy
