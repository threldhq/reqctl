acceptance_criteria:
- given: a run whose verdict raises a question the owner answered
  then: the description states the question with the owner's answer
  when: the description is rendered
- given: a run whose verdict raises a question the corpus settled
  then: the description states the question with the uid of each [item](item) that
    settled it and the clause quoted from that [item](item)
  when: the description is rendered
- given: a run whose verdict raises a question declined as naming no contradiction
    with an approved [item](item)
  then: the description states the question and that it was declined
  when: the description is rendered
- given: a run whose verdict raises a question that neither the owner's answer, corpus
    evidence nor a decline settled
  then: the product refuses and names the question, and states no question on its
    own
  when: the description is rendered
