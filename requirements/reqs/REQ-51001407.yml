acceptance_criteria:
- given: a branch changing code that a [statement citation](statement_citation) covers
  then: the body names the requirement, guard, parameter or [data item](data_item)
    the [citation](statement_citation) names and the finding of reading the code citing
    the [item](item) against the [item](item)
  when: the pre-pr skill prepares the pull request
- given: a branch changing code that a [statement citation](statement_citation) of
    one [entry](entry) of a [data item](data_item) covers
  then: the body names the [data item](data_item)
  when: the pre-pr skill prepares the pull request
- given: a branch that touches no requirement, guard, parameter or [data item](data_item)
  then: the body states that none was touched
  when: the pre-pr skill prepares the pull request
- given: the pre-pr skill as shipped
  then: no step re-runs the [tests](test) a branch adds or changes
  when: the steps of the skill are read
