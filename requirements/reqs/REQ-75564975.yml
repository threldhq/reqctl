acceptance_criteria:
- given: origin's default branch is main
  then: the product refuses the [tool call](tool_call)
  when: a [tool call](tool_call) runs git remote set-head origin feature, git symbolic-ref
    refs/remotes/origin/HEAD refs/remotes/origin/feature or git update-ref refs/remotes/origin/HEAD
    naming another commit
- given: origin's default branch is main
  then: the product does not refuse the [tool call](tool_call) on that ground
  when: a [tool call](tool_call) runs git remote set-head origin --auto or git remote
    set-head origin main
- given: a local origin/HEAD ref
  then: the product refuses the [tool call](tool_call)
  when: a [tool call](tool_call) runs git remote set-head origin -d or git update-ref
    -d refs/remotes/origin/HEAD
- given: origin cannot be reached, or has not reported its default branch within ${origin_query_seconds}
    of the product asking
  then: the product refuses the [tool call](tool_call)
  when: a [tool call](tool_call) runs git remote set-head origin main
- given: a local origin/HEAD ref
  then: the product refuses the [tool call](tool_call)
  when: a [tool call](tool_call) runs git remote remove origin or git remote rename
    origin another
- given: a local origin/HEAD ref
  then: the product refuses the [tool call](tool_call)
  when: a [tool call](tool_call) writes .git/refs/remotes/origin/HEAD or .git/packed-refs
