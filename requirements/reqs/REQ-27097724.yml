acceptance_criteria:
- given: a repository whose [settings file](settings_file) sets the uncited-code mode
    to changed_lines, and a branch adding a function no [statement citation](statement_citation)
    covers and no [citation digest](citation_digest) takes in
  then: the product reports each line of the added function as a problem
  when: trace is given a base branch
- given: a repository whose [settings file](settings_file) sets the uncited-code mode
    to changed_lines, and an uncited function the branch does not change
  then: the product reports no line of that function
  when: trace is given a base branch
- given: a repository whose [settings file](settings_file) sets the uncited-code mode
    to changed_lines, and an uncited line the branch moves to another place in its
    file without changing its text
  then: the product reports the moved line as a problem
  when: trace is given a base branch
- given: a repository whose [settings file](settings_file) sets the uncited-code mode
    to changed_lines, and an uncited function the branch moves to another file
  then: the product reports each moved line as a problem
  when: trace is given a base branch
