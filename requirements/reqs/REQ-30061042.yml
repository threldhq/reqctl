acceptance_criteria:
- given: a file of the [code base](code_base) in ${commentless_formats.json}
  then: the item holds the file's path and a digest of its entire content
  when: an item is cited against the whole file
- given: an item holding a [whole-file citation](whole_file_citation)
  then: the product reports the citation as a problem
  when: a key or value in the file changes after the item took its digest and trace
    is run
- given: an item holding a [whole-file citation](whole_file_citation) of a file that
    reads as [code tokens](code_token)
  then: the product reports no problem for the citation
  when: only the white space between its tokens changes and trace is run
- given: an item holding a [whole-file citation](whole_file_citation)
  then: the product reports no problem for the citation
  when: only the file's line endings change and trace is run
- given: a file of the [code base](code_base) in none of the ${commentless_formats}
  then: the product refuses it
  when: a [whole-file citation](whole_file_citation) of it is asked for
