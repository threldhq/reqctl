text: When a skill of the product's Claude Code plugin writes a [statement citation](statement_citation),
  the product shall make the [statement citation](statement_citation) cover the code
  that decides a clause or acceptance criterion of the [item](item) it names, or,
  for a parameter, [data item](data_item) or [entry](entry), the code stating its
  value, together with each line of code that code names, directly or through what
  those lines name, which no [citation digest](citation_digest) takes in.
