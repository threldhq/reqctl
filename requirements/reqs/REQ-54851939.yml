acceptance_criteria:
- given: an approved requirement cited by code carrying its [stamp](stamp)
  then: trace reports nothing behind the corpus for the [citation](statement_citation)
  when: the requirement's verification, type or priority is revised
- given: an approved requirement cited by code carrying its [stamp](stamp)
  then: trace reports the [citation](statement_citation) as behind the corpus
  when: the requirement's text or an acceptance criterion is revised
- given: an [item](item) binding an approved requirement
  then: the product leaves the binder [pinned](pin)
  when: the requirement's verification, type, priority or rationale is revised
- given: an [item](item) binding an approved requirement
  then: the product makes the binder suspect
  when: an acceptance criterion of the requirement is revised
