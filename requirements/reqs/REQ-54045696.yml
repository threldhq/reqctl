acceptance_criteria:
- given: a corpus stating two binding dimensions
  then: the product refuses and names the dimension that disagrees
  when: a [proposal](proposal)'s record matches its text for one and not the other
- given: a corpus stating one binding dimension
  then: the product accepts the [proposal](proposal)
  when: a [proposal](proposal)'s record matches its text
- given: a [proposal](proposal) referencing a member the dimension's item does not
    define
  then: the product refuses and names the members the item defines
  when: the run is built
