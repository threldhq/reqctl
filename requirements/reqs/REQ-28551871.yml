acceptance_criteria:
- given: a [data item](data_item) named value_types listing for duration the unit
    s with the spelling seconds
  then: the product refuses the parameter and names bananas as no unit of duration
  when: a parameter stating the value type duration and the unit bananas is written
- given: a [data item](data_item) named value_types listing for duration the unit
    s with the spelling seconds
  then: the product accepts the unit
  when: an [entry](entry) of a [data item](data_item) stating the value type duration
    and the unit seconds is written
- given: a [data item](data_item) named value_types listing the unit B for size and
    no unit spelled bytes for duration
  then: the product refuses the [data item](data_item) and names bytes as no unit
    of duration
  when: an [entry](entry) of a [data item](data_item) stating the value type duration
    and the unit bytes is written
- given: a corpus holding a [data item](data_item) named value_types, and a corpus
    holding a parameter stating the value type duration and the unit bananas
  then: the product refuses the parameter and names bananas as no unit of duration
  when: the corpus is validated
- given: a corpus holding a [data item](data_item) named value_types
  then: the product refuses nothing for the unit
  when: an [entry](entry) of a [data item](data_item) stating a unit and no value
    type is written
- given: a corpus holding no [data item](data_item) named value_types
  then: the product accepts the unit
  when: a parameter stating the value type duration and the unit bananas is written
