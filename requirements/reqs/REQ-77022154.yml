acceptance_criteria:
- given: an approved item stating conflicts_with toward a draft item
  then: the product refuses and states deprecating one, superseding both or rewriting
    both as the fix
  when: the draft item is approved
- given: an approved item on disk stating conflicts_with toward another approved item
  then: the product refuses and names both items
  when: the corpus is validated
- given: an approved item stating conflicts_with toward an item that is deprecated
    or superseded
  then: the product accepts the approved item
  when: the corpus is validated
assessed: {}
priority: medium
