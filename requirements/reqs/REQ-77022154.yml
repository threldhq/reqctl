acceptance_criteria:
- given: an approved [item](item) stating conflicts_with toward a draft [item](item)
  then: the product refuses and states deprecating one, superseding both or rewriting
    both as the fix
  when: the draft [item](item) is approved
- given: an approved [item](item) on disk stating conflicts_with toward another approved
    [item](item)
  then: the product refuses and names both [items](item)
  when: the corpus is validated
- given: an approved [item](item) stating conflicts_with toward an [item](item) that
    is deprecated or superseded
  then: the product accepts the approved [item](item)
  when: the corpus is validated
