acceptance_criteria:
- given: a parameter whose value type is text
  then: the product refuses and names the member
  when: a member that reads as a number is stated
- given: a parameter whose value type is text
  then: the product refuses and names the member
  when: a revision states a member that reads as a quantity
- given: a parameter whose value type is text
  then: the product does not refuse the member
  when: a member that reads as a word is stated
