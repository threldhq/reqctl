acceptance_criteria:
- given: a satisfied return giving lines for one of the two acceptance criteria of
    the [item](item)
  then: the [item](item) has no verdict from the [searching reader](searching_reader)
  when: the return is read
- given: a satisfied return giving a line that the file it names for the line does
    not hold
  then: the [item](item) has no verdict from the [searching reader](searching_reader)
  when: the return is read
- given: a satisfied return naming for a line a file of the corpus
  then: the [item](item) has no verdict from the [searching reader](searching_reader)
  when: the return is read
