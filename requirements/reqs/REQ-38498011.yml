acceptance_criteria:
- given: an [item](item) file holding an unresolved merge within its [pins](pin)
  then: the product refuses, naming the file, the merge and reqctl resolve, and shows
    no parse fault
  when: reqctl list, context, trace, export, revise or baseline --check is run
- given: an [item](item) file holding an unresolved merge in a field other than its
    [pins](pin) and its [citation list](citation_list)
  then: the product refuses, naming the file and the merge, and names no command as
    settling it
  when: a reqctl command other than validate and resolve reads it
- given: a corpus in which one [item](item) file holds an unresolved merge
  then: the product refuses rather than list the other [items](item)
  when: reqctl list or export is run
- given: an [item](item) file holding an unresolved merge and a YAML alias or a repeated
    top-level key
  then: the product names the merge
  when: a reqctl command other than validate and resolve reads it
- given: an [item](item) file unreadable for a reason other than an unresolved merge
  then: the product states the fault it found
  when: a reqctl command reads it
