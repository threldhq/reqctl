  when: the corpus is validated
- given: a corpus holding a [data item](data_item) named value_types, and an [entry](entry)
    of a [data item](data_item) stating a quantity and a unit and no value type
  then: the product accepts the [entry](entry), checking neither its quantity nor
    its unit
  when: the corpus is validated
- given: a corpus holding no [data item](data_item) named value_types, and a [data
    item](data_item) whose [entries](entry) state no value type, quantity, unit, at_least
    or at_most
  then: the product accepts the [data item](data_item)
  when: the corpus is validated
