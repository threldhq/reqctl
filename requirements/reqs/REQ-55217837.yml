acceptance_criteria:
- given: a review refused over a source whose page does not hold the passage quoted
    from it
  then: the prompt names the source's web address, the passage and the fault, and
    states that no [practice](practice) may name the source
  when: the review is made again
- given: two [practices](practice) quoting different passages from one source over
    which the review is refused
  then: the prompt names both passages
  when: the review is made again
- given: a run whose review was refused over one source, then made again and refused
    over another
  then: the prompt names both sources
  when: the review is made again
- given: a review refused only over [transient failures](transient_failure), whose
    [question for the owner](question_for_the_owner) the owner answers by making the
    review again
  then: the prompt names each source that failed
  when: the review is made again
