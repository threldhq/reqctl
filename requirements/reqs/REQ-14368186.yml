acceptance_criteria:
- given: an [item](item) whose link toward a term [awaits assessment](awaiting_assessment)
  then: the link toward the term by its new name still [awaits assessment](awaiting_assessment)
  when: the term is renamed
- given: an [item](item) whose link toward a term is [pinned](pin) to the [stamp](stamp)
    the term carries
  then: the link stays [pinned](pin)
  when: the term is renamed
- given: an [item](item) whose reference toward a parameter [awaits assessment](awaiting_assessment)
  then: the reference toward the [entry](entry) the parameter became still [awaits
    assessment](awaiting_assessment)
  when: the parameter is refiled as a [data item](data_item)
