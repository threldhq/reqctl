acceptance_criteria:
- given: an [item](item) whose unresolved merge reaches a field other than its [pins](pin)
    and its [citation list](citation_list)
  then: the product refuses and names the field it will not resolve
  when: that [item](item) is resolved
- given: an [item](item) whose unresolved merge falls within its [pins](pin) alone
  then: the [item](item) holds what both sides state alike and every [pin](pin) the
    merge conflicted is gone
  when: that [item](item) is resolved
- given: an [item](item) whose unresolved merge falls within its [citation list](citation_list)
    alone
  then: the [citation list](citation_list) holds what both sides hold alike, and holds
    no [citation identity](citation_identity) the merge conflicted
  when: that [item](item) is resolved
