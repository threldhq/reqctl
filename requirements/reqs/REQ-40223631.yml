acceptance_criteria:
- given: a [best-in-class check](best_in_class_check) weighing two examples that states
    that the code is to follow neither and states why
  then: the product passes it
  when: the product checks it
- given: a [best-in-class check](best_in_class_check) weighing an example that states
    that the code is to follow no example's [approach](approach) and states no reason
  then: the product refuses it
  when: the product checks it
- given: a [best-in-class check](best_in_class_check) weighing only libraries that
    names no example to follow and states no reason
  then: the product does not refuse it on that ground
  when: the product checks it
