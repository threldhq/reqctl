acceptance_criteria:
- given: a field the governing schema constrains to a date, holding a number another
    [item](item) states as a quantity
  then: the product accepts both [items](item)
  when: the corpus is validated
- given: a field the governing schema does not constrain to a date, holding a number
    another [item](item) states as a quantity
  then: the product refuses the [item](item)
  when: the corpus is validated
- given: a field the governing schema constrains to a date, holding a value that is
    not a date
  then: the product refuses the field
  when: the corpus is validated
