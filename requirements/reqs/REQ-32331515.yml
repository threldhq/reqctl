acceptance_criteria:
- given: a repository whose default branch carries a [settings file](settings_file)
    stating one judge model, and a branch whose [settings file](settings_file) states
    another
  then: each judge is spawned on the model the default branch's [settings file](settings_file)
    states
  when: a run is built on that branch
- given: a repository whose default branch carries no [settings file](settings_file),
    and a branch that adds one
  then: the product uses the values it ships
  when: a run is built on that branch
