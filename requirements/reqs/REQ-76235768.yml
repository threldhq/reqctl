acceptance_criteria:
- given: the default branch checked out
  then: the product refuses it
  when: a [tool call](tool_call) runs git update-ref, git branch -f or git reset --soft
    moving it to a commit the local remote-tracking ref of origin's default branch
    does not reach
- given: the default branch checked out
  then: the product does not refuse it on that ground
  when: a [tool call](tool_call) runs git merge --ff-only origin/main or git pull
    --ff-only
- given: a [tool call](tool_call) running git commit-tree alone
  then: the product does not refuse it on that ground
  when: the [tool call](tool_call) is made
- given: a [tool call](tool_call) pointing the default branch at what git commit-tree
    made
  then: the product refuses it
  when: the [tool call](tool_call) is made
- given: no local default branch
  then: the product does not refuse it on that ground
  when: a [tool call](tool_call) creates it at the commit the remote-tracking ref
    of origin's default branch holds
- given: a local default branch
  then: the product does not refuse it on that ground
  when: a [tool call](tool_call) deletes it
