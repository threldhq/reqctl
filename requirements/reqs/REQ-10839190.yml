acceptance_criteria:
- given: a [data item](data_item) named value_types listing for duration the unit
    d with the spelling days
  then: the product refuses the [item](item), naming the quantity and stating that
    referencing the parameter or [entry](entry) holding it is the fix
  when: a criterion writing a number in figures before days is written
- given: a [data item](data_item) named value_types listing for duration the unit
    d with the spelling days
  then: the product refuses the [item](item), naming the quantity
  when: a criterion writing a number in words before days is written
- given: a [data item](data_item) named value_types listing for duration the unit
    s
  then: the product refuses the [item](item), naming the quantity
  when: a criterion writes a number in figures joined to s
- given: a [data item](data_item) named value_types listing for duration the unit
    d with the spelling days
  then: the product accepts the statement
  when: a statement references an [entry](entry) stating the value type duration and
    writes no number before a unit
- given: a [data item](data_item) named value_types listing for duration the unit
    d with the spelling days
  then: the product accepts the rationale
  when: an [item](item)'s rationale writes a number of days in figures or in words
- given: a [data item](data_item) named value_types listing for duration the unit
    d with the spelling days
  then: the product accepts the criterion
  when: a criterion writes a number, in figures or in words, before a word that value_types
    lists as no unit
- given: a corpus holding no [data item](data_item) named value_types
  then: the product accepts the criterion
  when: a criterion writing a number in figures or in words before days is written
