acceptance_criteria:
- given: an [item](item) whose [stamp](stamp) a commit changed
  then: the committer date and time of that commit stand as the date of its last update
  when: reqctl context, export or list shows the [item](item)
- given: a commit changing a field of an [item](item) that the [stamp](stamp) does
    not cover
  then: the date of its last update is unchanged
  when: the [item](item) is shown
- given: a [data item](data_item) one of whose [entries](entry) a later commit revised
  then: the committer date and time of that later commit stand as the date of its
    last update
  when: the [data item](data_item) is shown
- given: a commit whose author date precedes its committer date
  then: the committer date stands as the date of its last update
  when: the [item](item) it changed is shown
