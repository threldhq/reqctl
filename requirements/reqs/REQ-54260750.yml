acceptance_criteria:
- given: a Read, Grep or Glob [tool call](tool_call) naming a corpus [item](item)'s
    file, a folder of corpus [items](item), the [corpus root](corpus_root) or the
    baseline
  then: the product refuses it and names reqctl context and reqctl export as the route
  when: the [tool call](tool_call) is made
- given: a shell command reading or searching a corpus [item](item)'s file or the
    baseline through cat, head, tail, wc, jq, grep, diff, cmp or a checksum, alone
    or piped onward
  then: the product refuses it
  when: the [tool call](tool_call) is made
- given: a shell command searching the [corpus root](corpus_root) recursively through
    grep
  then: the product refuses it
  when: the [tool call](tool_call) is made
- given: a shell command running ls, stat or du on a corpus [item](item)'s file
  then: the product does not refuse it
  when: the [tool call](tool_call) is made
- given: a shell command running git log, show, diff, status, blame or ls-files on
    a corpus [item](item)'s file
  then: the product does not refuse it
  when: the [tool call](tool_call) is made
- given: a Read [tool call](tool_call) naming a schema of the corpus
  then: the product does not refuse it
  when: the [tool call](tool_call) is made
