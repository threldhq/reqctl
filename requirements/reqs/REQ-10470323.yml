acceptance_criteria:
- given: a corpus stating a default model and no model for a role
  then: that role uses the default model rather than the one the product ships
  when: the challenge is prepared
- given: a corpus stating a default model and a model for one role
  then: that role uses its own model and every other uses the default
  when: the challenge is prepared
