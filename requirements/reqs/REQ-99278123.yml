acceptance_criteria:
- given: a repository whose [settings file](settings_file) states a value under review_limits.page_byte
  then: the product refuses the command, naming the file and review_limits.page_byte
  when: a command that reads the [settings file](settings_file) runs there
- given: a repository whose [settings file](settings_file) states a value for the
    definition field of an entry of git_read_forms, which neither the reqctl command
    nor the elucidate skill uses
  then: the product refuses the command, naming the file and the key
  when: a command that reads the [settings file](settings_file) runs there
- given: a repository whose [settings file](settings_file) states a value for the
    page_bytes entry of review_limits rather than for one of its fields
  then: the product refuses the command, naming the file and the key
  when: a command that reads the [settings file](settings_file) runs there
