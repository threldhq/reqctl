acceptance_criteria:
- given: a statement whose text states no obligation, or states two
  then: the product refuses and shows the five forms
  when: the statement is written
- given: a statement whose text states an obligation and no response after the obligation
  then: the product refuses and shows the five forms
  when: the statement is written
- given: a statement whose text opens with a word other than When, While, Where, If
    or The
  then: the product refuses and shows the five forms
  when: the statement is written
- given: a statement whose text opens with If and reaches a then with no comma before
    the then
  then: the product refuses and shows the five forms
  when: the statement is written
- given: a statement whose text takes one of the five forms
  then: the product accepts the statement
  when: the statement is written
