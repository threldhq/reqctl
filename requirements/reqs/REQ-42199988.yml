acceptance_criteria:
- given: a run whose corpus moved under one [proposal](proposal)'s set
  then: that [proposal](proposal)'s verdict is retired
  when: the run is judged again
- given: a run whose corpus moved under no part of a [proposal](proposal)'s set
  then: that [proposal](proposal)'s verdict stands
  when: the run is judged again
- given: a verdict for a slot the run no longer holds
  then: that verdict is retired
  when: the run is judged again
