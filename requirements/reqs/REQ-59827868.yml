acceptance_criteria:
- given: a Python [statement citation](statement_citation) over a line calling a function
    of the [code base](code_base)
  then: the product reports the [citation](statement_citation) as a problem
  when: the body of that function changes and trace is run
- given: a Python [statement citation](statement_citation) over a line calling a function
    that calls a second function of the [code base](code_base)
  then: the product reports the [citation](statement_citation) as a problem
  when: the body of the second function changes and trace is run
- given: a Python [statement citation](statement_citation) over a line reading a module-level
    constant of the [code base](code_base)
  then: the product reports the [citation](statement_citation) as a problem
  when: the constant's value changes and trace is run
- given: a function of the [code base](code_base) called by the cited lines of two
    [items](item)
  then: the product reports the [citation](statement_citation) of each [item](item)
    as a problem
  when: its body changes and trace is run
- given: a Python [statement citation](statement_citation) over a line calling a function
    of a library outside the [code base](code_base)
  then: the [citation digest](citation_digest) is unchanged
  when: the library changes
- given: a [statement citation](statement_citation) over lines of a file that is not
    Python
  then: the [citation digest](citation_digest) takes in the covered lines and no other
  when: trace is run
- given: a Python [statement citation](statement_citation) over a line naming a class
    of the [code base](code_base)
  then: the product reports the [citation](statement_citation) as a problem
  when: a method of that class changes and trace is run
- given: a Python [statement citation](statement_citation) over a line calling a function
    chosen by a name built while the code runs
  then: the function's definition is not taken in
  when: the product takes the [citation digest](citation_digest)
- given: a Python [statement citation](statement_citation) over a line calling a function
    of the [code base](code_base)
  then: the product reports no problem for the [citation](statement_citation)
  when: only the spacing of that function changes and trace is run
