acceptance_criteria:
- given: an entry stating a model and an effort for coverage
  then: the coverage agent is spawned on that model at that effort
  when: the product spawns the coverage agent
- given: an entry stating a model and an effort for best_in_class
  then: the agent making it is spawned on that model at that effort
  when: the product makes the [best-in-class review](best_in_class_review)
- given: one entry for recall and another for judge
  then: each recall agent is spawned on the recall entry's model and effort, and each
    judge, group judge and final judge on the judge entry's
  when: the product spawns a run's recall agents, judges, group judges and final judges
- given: the [elucidate workflow](elucidate_workflow) spawning a run's agents
  then: it names no model and no effort, and each agent's model and effort reach it
    as input
  when: its script is read
