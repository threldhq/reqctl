acceptance_criteria:
- given: an [item](item) holding a link that [awaits assessment](awaiting_assessment)
    and names an [item](item) the corpus does not hold
  then: the product leaves that link as it was and [pins](pin) the rest
  when: reqctl repin-links names the [item](item)
- given: an [item](item) whose term link, parameter reference and data reference each
    [await assessment](awaiting_assessment)
  then: the product [pins](pin) each to the [stamp](stamp) its target carries
  when: reqctl repin-links names the [item](item)
- given: an [item](item) whose relation toward a requirement [awaits assessment](awaiting_assessment)
    after the requirement's text changed
  then: the product [pins](pin) the relation to the requirement's [stamp](stamp)
  when: reqctl repin-links names the [item](item)
- given: a corpus in which several [items](item) hold links [awaiting assessment](awaiting_assessment)
  then: the product [pins](pin) every such link in every [item](item)
  when: reqctl repin-links is given --all
