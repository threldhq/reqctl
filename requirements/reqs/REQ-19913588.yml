acceptance_criteria:
- given: input reqctl cannot read, in a command run without --json
  then: 'the output is the single line reqctl: followed by the message'
  when: the fault reaches the caller
- given: a defect in reqctl itself rather than in what it reads
  then: the traceback stands rather than a single line
  when: the fault reaches the caller
- given: a fault raised by a library reqctl calls rather than by reqctl, in a command
    run without --json
  then: 'the output is the single line reqctl: followed by the message'
  when: the fault reaches the caller
- given: input reqctl cannot read, in a command run with --json
  then: standard output holds a JSON object holding the message under error
  when: the fault reaches the caller
