acceptance_criteria:
- given: input reqctl cannot read, in a command run without --json
  then: 'the output is reqctl: followed by the message, and holds no traceback'
  when: the fault reaches the caller
- given: a command refused for two problems the fault lists, run without --json
  then: 'the first line is reqctl: followed by the message, and each problem stands
    on a line of its own without the prefix'
  when: the fault reaches the caller
- given: a defect in reqctl itself rather than in what it reads
  then: the traceback stands
  when: the fault reaches the caller
- given: a fault raised by a library reqctl calls rather than by reqctl, in a command
    run without --json
  then: 'the output is reqctl: followed by the message, and holds no traceback'
  when: the fault reaches the caller
- given: input reqctl cannot read, in a command run with --json
  then: standard output holds a JSON object holding the whole message under error
  when: the fault reaches the caller
