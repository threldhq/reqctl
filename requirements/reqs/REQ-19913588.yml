text: 'If a fault in what reqctl reads or in the environment it runs in reaches the
  caller, then the product shall state the fault as reqctl: followed by the message,
  with each further line of the message unprefixed, or, for a command run with --json,
  as a JSON object on standard output holding the whole message under error, rather
  than as a traceback.'
