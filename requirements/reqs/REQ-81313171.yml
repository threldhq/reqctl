acceptance_criteria:
- given: a batch whose first step mints an item and whose second step holds a positional
    argument that is exactly $N with N zero
  then: the second step receives the uid the first step minted
  when: the batch is applied
- given: an option value that is exactly $N with N zero
  then: reqctl receives the uid the first step minted as that option's value
  when: the batch is applied
- given: an option value holding $N among other text, such as see $0
  then: reqctl receives the value unchanged as that option's value
  when: the batch is applied
