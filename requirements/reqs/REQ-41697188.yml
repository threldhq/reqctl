acceptance_criteria:
- given: a parameter whose value type is count
  then: the product refuses and names the key as not parsing as count
  when: an entry key stating a sign or a fraction is written
- given: a parameter whose value type is duration or size
  then: the product refuses and names the key as not parsing as that value type
  when: an entry key stating a sign is written
- given: a parameter whose value type is ratio, percentage or currency
  then: the product accepts the key
  when: an entry key stating a sign is written
- given: a parameter whose value type is boolean
  then: the product refuses and names the key as not parsing as boolean
  when: an entry key other than true or false is written
