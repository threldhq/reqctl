acceptance_criteria:
- given: an item whose rationale references a parameter the corpus resolves
  then: the export shows the parameter value in place of the reference
  when: the corpus is exported
- given: a term whose definition links another term
  then: the export renders the link as it renders a statement link
  when: the corpus is exported
- given: a parameter whose own text links a term
  then: the export renders the link
  when: the corpus is exported
- given: an item whose rationale cites a parameter the corpus cannot resolve
  then: the export shows the citation unchanged
  when: the corpus is exported
- given: a data item whose entry field the schema declares as prose links a term
  then: the export renders the link
  when: the corpus is exported
