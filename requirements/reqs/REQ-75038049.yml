acceptance_criteria:
- given: a Python file origin's default branch does not hold, naming a corpus [item](item)'s
    file
  then: the product refuses the [tool call](tool_call) and names running reqctl as
    the route
  when: a [tool call](tool_call) runs python, bash, sh, source or ./ on it
- given: a script origin's default branch holds unchanged at its path, naming a corpus
    [item](item)'s file
  then: the product does not refuse the [tool call](tool_call) on that ground
  when: a [tool call](tool_call) runs it
- given: a script naming only the corpus schemas
  then: the product does not refuse the [tool call](tool_call) on that ground
  when: a [tool call](tool_call) runs it
- given: a branch changing reqctl's own sources
  then: the product does not refuse the [tool call](tool_call) on that ground
  when: a [tool call](tool_call) runs reqctl
- given: a script naming requirements.txt and no corpus path
  then: the product does not refuse the [tool call](tool_call) on that ground
  when: a [tool call](tool_call) runs it
- given: a script importing a module that names a corpus [item](item)'s file, and
    naming none itself
  then: the product does not refuse the [tool call](tool_call) on that ground
  when: a [tool call](tool_call) runs the script
- given: origin names no default branch, or the repository cannot be read
  then: the product refuses the [tool call](tool_call)
  when: a [tool call](tool_call) runs a file naming a corpus [item](item)'s file
- given: a file the local origin/HEAD ref holds unchanged, although origin has moved
    on since the last fetch
  then: the product does not refuse the [tool call](tool_call) on that ground
  when: a [tool call](tool_call) runs it
