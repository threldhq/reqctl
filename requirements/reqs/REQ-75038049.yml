text: If a [tool call](tool_call) would run a file whose text names the path of a
  corpus [item](item)'s file, a folder of corpus [items](item), the baseline or the
  [corpus root](corpus_root), origin's default branch does not hold that file unchanged
  at its path, and the file does not both lie under the folder of the Claude Code
  plugin whose ${plugin_components.requirements_guard_hook} judges the [tool call](tool_call)
  and have a SHA-256 digest of its bytes that the plugin's [fingerprint list](fingerprint_list)
  holds, then the product shall refuse the [tool call](tool_call).
