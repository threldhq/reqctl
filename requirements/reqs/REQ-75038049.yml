acceptance_criteria:
- given: a Python file inside the working tree holding the [project root](project_root)
    that origin's default branch does not hold, naming a corpus [item](item)'s file
  then: the product refuses the [tool call](tool_call) and names running reqctl as
    the route
  when: a [tool call](tool_call) runs python, bash, sh, source or ./ on it
- given: a script origin's default branch holds unchanged at its path, naming a corpus
    [item](item)'s file
  then: the product does not refuse the [tool call](tool_call) on that ground
  when: a [tool call](tool_call) runs it
- given: a script naming only the corpus schemas
  then: the product does not refuse the [tool call](tool_call) on that ground
  when: a [tool call](tool_call) runs it
- given: a branch changing reqctl's own sources
  then: the product does not refuse the [tool call](tool_call) on that ground
  when: a [tool call](tool_call) runs reqctl
- given: a script naming requirements.txt and no corpus path
  then: the product does not refuse the [tool call](tool_call) on that ground
  when: a [tool call](tool_call) runs it
- given: a script importing a module that names a corpus [item](item)'s file, and
    naming none itself
  then: the product does not refuse the [tool call](tool_call) on that ground
  when: a [tool call](tool_call) runs the script
- given: origin names no default branch, or the repository cannot be read
  then: the product refuses the [tool call](tool_call)
  when: a [tool call](tool_call) runs a file inside the working tree holding the [project
    root](project_root), outside the plugin's folder, naming a corpus [item](item)'s
    file
- given: a file the local origin/HEAD ref holds unchanged, although origin has moved
    on since the last fetch
  then: the product does not refuse the [tool call](tool_call) on that ground
  when: a [tool call](tool_call) runs it
- given: a file under the plugin's folder naming the [corpus root](corpus_root), whose
    SHA-256 digest the [fingerprint list](fingerprint_list) holds
  then: the product does not refuse the [tool call](tool_call) on that ground
  when: a [tool call](tool_call) runs it without changing the environment
- given: a file under the plugin's folder, outside the working tree holding the [project
    root](project_root), naming a corpus [item](item)'s file, whose SHA-256 digest
    the [fingerprint list](fingerprint_list) does not hold
  then: the product refuses the [tool call](tool_call)
  when: a [tool call](tool_call) runs it with its working directory inside that working
    tree
- given: a file inside the working tree holding the [project root](project_root) and
    outside the plugin's folder, naming a corpus [item](item)'s file, that origin's
    default branch does not hold, whose SHA-256 digest the [fingerprint list](fingerprint_list)
    holds
  then: the product refuses the [tool call](tool_call)
  when: a [tool call](tool_call) runs it
- given: a script inside the working tree holding the [project root](project_root),
    committed nowhere, holding open("requirements/reqs/x.yml")
  then: the product refuses the [tool call](tool_call)
  when: a [tool call](tool_call) runs it with python
- given: a file under the plugin's folder whose digest the [fingerprint list](fingerprint_list)
    holds, naming the [corpus root](corpus_root)
  then: the product refuses the [tool call](tool_call)
  when: a [tool call](tool_call) runs it with PYTHONPATH set on its command line and
    its working directory inside the working tree holding the [project root](project_root)
- given: the same file
  then: the product refuses the [tool call](tool_call)
  when: a [tool call](tool_call) exports, unsets or clears a variable earlier in the
    same command, or runs it under env -i, then runs it from the same working directory
- given: a file in the scratchpad, or in a scratch clone made outside the top folder
    of the working tree holding the [project root](project_root), naming a corpus
    [item](item)'s file by a relative path, that origin's default branch does not
    hold
  then: the product does not refuse the [tool call](tool_call) on that ground
  when: a [tool call](tool_call) changes directory to a folder outside that working
    tree, then runs it
- given: the same file
  then: the product refuses the [tool call](tool_call) and names running it from outside
    that working tree as the route
  when: a [tool call](tool_call) runs it with its working directory inside the working
    tree holding the [project root](project_root)
- given: a file outside the working tree holding the [project root](project_root)
    whose text names a corpus [item](item)'s file by an absolute path inside that
    working tree
  then: the product refuses the [tool call](tool_call)
  when: a [tool call](tool_call) runs it from a working directory outside that working
    tree
- given: a file outside the working tree holding the [project root](project_root)
    naming a corpus [item](item)'s file
  then: the product refuses the [tool call](tool_call)
  when: a [tool call](tool_call) runs it with a working directory the product cannot
    resolve from the [tool call](tool_call)
- given: a file in a clone made under the top folder of the working tree holding the
    [project root](project_root), naming a corpus [item](item)'s file, that origin's
    default branch does not hold
  then: the product refuses the [tool call](tool_call)
  when: a [tool call](tool_call) runs it
- given: a file under the plugin's folder, outside the working tree holding the [project
    root](project_root), naming a corpus [item](item)'s file by a relative path, whose
    SHA-256 digest the [fingerprint list](fingerprint_list) does not hold
  then: the product does not refuse the [tool call](tool_call) on that ground
  when: a [tool call](tool_call) changes directory to a folder outside that working
    tree, then runs it
- given: a file the same command creates before running it, at a path that resolves
    outside the working tree holding the [project root](project_root)
  then: the product does not refuse the [tool call](tool_call) on that ground
  when: the [tool call](tool_call) runs it from a working directory outside that working
    tree
- given: a file the same command creates before running it, at a path that resolves
    inside the working tree holding the [project root](project_root) or that cannot
    be resolved from the command's text, or that the command runs with its working
    directory inside that working tree
  then: the product refuses the [tool call](tool_call)
  when: the [tool call](tool_call) is made
