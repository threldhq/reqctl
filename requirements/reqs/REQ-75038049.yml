text: If a [tool call](tool_call) would run a file that origin's default branch does
  not hold unchanged at its path, whose text names the path of a corpus [item](item)'s
  file, a folder of corpus [items](item), the baseline or the [corpus root](corpus_root),
  or cannot be read when the product judges the [tool call](tool_call), then the product
  shall refuse the [tool call](tool_call) where the file lies inside the working tree
  holding the [project root](project_root), where the [tool call](tool_call) runs
  the file with its working directory inside that working tree, where a corpus path
  the file's text names is absolute and lies inside that working tree, or where the
  product cannot resolve the file's place or that working directory from the [tool
  call](tool_call), unless the file lies under the folder of the Claude Code plugin
  whose ${plugin_components.requirements_guard_hook} judges the [tool call](tool_call),
  its bytes have a SHA-256 digest the plugin's [fingerprint list](fingerprint_list)
  holds, and the [tool call](tool_call) runs it without changing the environment.
type: functional
