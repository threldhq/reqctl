acceptance_criteria:
- given: a review the best-in-class agent wrote that does not match the review shape
  then: the product refuses the review and names the best-in-class agent to spawn
    again from the [spawn manifest](spawn_manifest) the build wrote for it
  when: the [best-in-class review](best_in_class_review) is checked
- given: a recall return from a batch of more than one [proposal](proposal) that does
    not match the recall shape
  then: the product refuses the return and lists the recall agents of the rebuilt
    shard to spawn again
  when: the recall returns are read
- given: a judge return that does not match the judge shape
  then: the product refuses the return and lists that judge to spawn again
  when: the verdicts are read
- given: coverage findings that do not match the coverage shape
  then: the product refuses the findings and names the coverage agent to spawn again
    from the [spawn manifest](spawn_manifest) the build wrote for it
  when: the findings are checked
- given: a recall return from a batch of one [proposal](proposal) that does not match
    the recall shape
  then: the product refuses the run and names no agent to spawn
  when: the recall returns are read
