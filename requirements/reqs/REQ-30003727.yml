acceptance_criteria:
- given: a session on a branch other than the default
  then: the [tool call](tool_call) is refused
  when: a [tool call](tool_call) runs git update-ref on a remote-tracking ref of origin
- given: a session
  then: the [tool call](tool_call) is refused
  when: a [tool call](tool_call) fetches from a remote other than origin into a remote-tracking
    ref of origin
- given: a session
  then: the [tool call](tool_call) is refused
  when: a [tool call](tool_call) runs git filter-branch whose state branch is a remote-tracking
    ref of origin
- given: a session
  then: the [tool call](tool_call) is not refused on that ground
  when: a [tool call](tool_call) runs git fetch origin
- given: a session on a feature branch
  then: the [tool call](tool_call) is not refused on that ground
  when: a [tool call](tool_call) pushes that branch to origin
- given: origin reporting main as its default branch
  then: the [tool call](tool_call) is not refused on that ground
  when: a [tool call](tool_call) runs git remote set-head origin main
