acceptance_criteria:
- given: a [dictionary item](dictionary_item) other than the [data item](data_item)
    named value_types
  then: the product refuses and names the key it will not accept
  when: an [entry](entry) keyed default, pinned, text or name is [minted](mint) or
    revised into it
- given: a [dictionary item](dictionary_item) other than the [data item](data_item)
    named value_types, whose governing schema declares no field of that name
  then: the product refuses the [entry](entry) just the same
  when: an [entry](entry) keyed for one of those names is [minted](mint) or revised
    into it
- given: a corpus holding a parameter whose value type is text
  then: the product [mints](mint) it, and reqctl validate passes
  when: a [data item](data_item) named value_types holding an [entry](entry) keyed
    text is [minted](mint)
