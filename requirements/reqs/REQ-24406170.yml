acceptance_criteria:
- given: a command that writes two files, and a write to the second that fails
  then: the first file holds what it held before the command
  when: the product runs the command
- given: a command that has written a file and then refuses, reports a fault, is interrupted
    or ends in a traceback
  then: the file holds what it held before the command
  when: the product runs the command
- given: an [item](item) that statements name, and a write to one of those statements
    that fails
  then: the [item](item)'s file stands where it stood holding what it held, and no
    file the rename created remains
  when: the product renames the [item](item)
- given: a run whose build has written some of its prompts, and a write that fails
  then: every file the build wrote holds what it held before the build
  when: the product builds the run
