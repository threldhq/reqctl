acceptance_criteria:
- given: a source whose host name resolves to a loopback, private, link-local or reserved
    address
  then: the product refuses the review without fetching from that address
  when: the review is checked
- given: a source at an address in the shared range 100.64.0.0/10
  then: the product refuses the review without fetching from that address
  when: the review is checked
- given: a source whose address is written in octal, hexadecimal, decimal or IPv4-mapped
    IPv6 form
  then: the product judges the address by its value, and refuses the review where
    that value is an [internal address](internal_address)
  when: the review is checked
- given: a source at a public address whose page redirects to an [internal address](internal_address)
  then: the product refuses the review without fetching from the address the redirect
    names
  when: the review is checked
- given: a host name that resolves to a public address when the review is checked
    and to an [internal address](internal_address) when the product connects
  then: the product refuses the review without fetching from the [internal address](internal_address)
  when: the review is checked
