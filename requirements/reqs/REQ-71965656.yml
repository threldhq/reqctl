acceptance_criteria:
- given: the [kind schema](kind_schema) gains a field for a kind of [item](item)
  then: reqctl accepts the flag, with no edit to reqctl's parser
  when: reqctl new runs with that field's flag for that kind
- given: the [kind schema](kind_schema) changes the values a field allows
  then: reqctl refuses the value, with no edit to reqctl's parser
  when: reqctl new runs with a value the schema no longer allows
- given: reqctl's parser
  then: it names no flag of its own for an [item](item)'s field
  when: it is read
