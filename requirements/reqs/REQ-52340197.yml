acceptance_criteria:
- given: a review whose [practices](practice) name three sources whose addresses hold
    one host name
  then: the product fetches the three one after another, starting none until the fetch
    before it has ended
  when: the review is checked
- given: a review whose [practices](practice) name sources under two host names
  then: the product fetches under the two host names at the same time
  when: the review is checked
- given: a source whose fetch redirects to another host name
  then: the product holds the host name in the source's address until the fetch ends
  when: the review is checked
