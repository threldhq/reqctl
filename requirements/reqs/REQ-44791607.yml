acceptance_criteria:
- given: prose carrying a parameter reference no [item](item) the corpus holds resolves
  then: the product refuses and names the reference
  when: the prose is written
- given: prose carrying a link no [item](item) the corpus holds resolves
  then: the product refuses and names the link
  when: the prose is written
- given: an [item](item) whose rationale carries a reference no [item](item) the corpus
    holds resolves
  then: the product refuses and names the reference
  when: the rationale is written
- given: an [item](item) on disk whose prose carries a reference or a link resolving
    to no [item](item)
  then: the product refuses and names the reference or the link
  when: the corpus is validated
