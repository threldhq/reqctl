text: If an [item](item)'s prose carries a reference or a link that resolves to no
  [item](item) the corpus holds, other than a reference or a link that reqctl new,
  revise or refile --into writes into an [item](item) already carrying that same reference
  or link, then the product shall refuse the prose.
