acceptance_criteria:
- given: the product refuses one [statement citation](statement_citation) the [code
    base](code_base) holds
  then: the product re-pins it and reports nothing of the refused [statement citation](statement_citation)
  when: the product is asked to re-pin a [statement citation](statement_citation)
    naming a different [citation identity](citation_identity)
- given: the product refuses one [statement citation](statement_citation) the [code
    base](code_base) holds
  then: the product removes it and reports nothing of the refused [statement citation](statement_citation)
  when: the product is asked to remove a [statement citation](statement_citation)
    naming a different [citation identity](citation_identity)
- given: the product refuses one [statement citation](statement_citation) the [code
    base](code_base) holds
  then: the product removes the identity and reports nothing of the refused [statement
    citation](statement_citation)
  when: the product is asked to remove from a [citation list](citation_list) a [citation
    identity](citation_identity) no [statement citation](statement_citation) names
- given: two [statement citations](statement_citation) the [code base](code_base)
    holds name one [citation identity](citation_identity)
  then: the product refuses the command
  when: a command names that identity
- given: a folder of the [code base](code_base) the product cannot read
  then: the command fails rather than passes
  when: a command names a [citation identity](citation_identity)
