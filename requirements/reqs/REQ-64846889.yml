acceptance_criteria:
- given: a [statement citation](statement_citation) whose covered lines changed after
    the [citation list](citation_list) of the requirement it names took their digest
  then: the [citation list](citation_list) holds the [citation digest](citation_digest)
    of the lines as they stand, and no other digest for the citation
  when: the product re-pins the citation
- given: a [statement citation](statement_citation) whose [citation identity](citation_identity)
    the [citation list](citation_list) of the requirement it names does not hold
  then: the [citation list](citation_list) holds the identity with the [citation digest](citation_digest)
    of the lines the citation covers
  when: the product re-pins the citation
