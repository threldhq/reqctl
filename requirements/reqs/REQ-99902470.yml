acceptance_criteria:
- given: the Claude Code plugin as shipped
  then: each file in it is part of one of the plugin components or is the [plugin
    manifest](plugin_manifest)
  when: its contents are read
- given: a file in a skill's folder, such as the elucidate skill's synthesis scripts
    or its harness/probe.py, an agent's own file, or the plugin's hooks.json or a
    file of a hook it registers
  then: the file is part of that skill, that agent or the hooks
  when: the Claude Code plugin's contents are read
- given: a README or a licence in the Claude Code plugin
  then: it is beyond the plugin components and the [plugin manifest](plugin_manifest)
  when: the Claude Code plugin's contents are read
