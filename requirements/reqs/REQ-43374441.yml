text: If a change touches both a file under the [corpus root](corpus_root) other than
  the baseline, in more than its [pins](pin), its [citation list](citation_list),
  the digest of each of its [whole-file citations](whole_file_citation) and the [entries](entry)
  the change adds to the ${plugin_components}, and a file outside the [corpus root](corpus_root)
  that no path stated by an [entry](entry) the change adds to the ${plugin_components}
  covers, in more than the [stamps](stamp) its [statement citations](statement_citation)
  name, then the product shall report a problem when the ${corpus_gates.travel_alone}
  gate checks the change against its base branch.
