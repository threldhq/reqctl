acceptance_criteria:
- given: the [kind schema](kind_schema) changes which fields a kind of item requires
  then: the form creating that kind marks exactly those fields as required, with no
    edit to the page
  when: reqctl portal serves the page
- given: a repository states its own [kind schema](kind_schema)
  then: the page's forms follow that repository's schema
  when: reqctl portal serves the page in that repository
- given: the page reqctl portal serves
  then: it holds no list of fields of its own for any kind of item
  when: it is read
- given: the [kind schema](kind_schema) holds a field the page has no display setting
    for
  then: the forms for that kind offer the field in a plain text box
  when: reqctl portal serves the page
- given: the [kind schema](kind_schema) holds text that would close a script block
  then: the text reaches the page as data and runs as no script
  when: reqctl portal serves the page
