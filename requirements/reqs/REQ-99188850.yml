acceptance_criteria:
- given: a page larger than ${review_limits.page_bytes.quantity} bytes as served
  then: the product refuses the review having read no more of the page than ${review_limits.page_bytes.quantity}
    bytes
  when: the review is checked
- given: a page served within ${review_limits.page_bytes.quantity} bytes that decompresses
    past it
  then: the product refuses the review and names the source, having decompressed no
    more of it than ${review_limits.page_bytes.quantity} bytes
  when: the review is checked
