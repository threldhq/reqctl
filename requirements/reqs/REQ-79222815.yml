acceptance_criteria:
- given: a [dictionary item](dictionary_item) two of whose [entries](entry) state
    a field true
  then: the address shows both [entries](entry)
  when: context is asked for a statement addressing the [item](item) by that field
- given: a [dictionary item](dictionary_item) holding one [entry](entry) that states
    a field true, one that states the field false and one that does not carry the
    field
