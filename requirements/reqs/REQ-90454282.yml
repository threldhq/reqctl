acceptance_criteria:
- given: a run whose [proposals](proposal) all name the product as the subject of
    the obligation
  then: every requirement the corpus holds appears in exactly one shard, with its
    status, and no guard appears
  when: the run is built
- given: a run whose [proposals](proposal) all name the build as the subject of the
    obligation
  then: every guard the corpus holds appears in exactly one shard, with its status,
    and no requirement appears
  when: the run is built
- given: a corpus holding a draft obligation of a [proposal](proposal)'s kind, left
    by an earlier run
  then: the draft appears in exactly one shard, as draft
  when: the run is built
