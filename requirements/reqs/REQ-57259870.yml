acceptance_criteria:
- given: a repository holding a README at its root
  then: the prompt states the whole text of that README
  when: the prompt of the [best-in-class review](best_in_class_review) is built
- given: a corpus stating no [field of the governed software](field_of_the_governed_software)
    and a repository holding a README
  then: the prompt states that the review takes the field from the README, and the
    owner is not asked for the field
  when: the prompt of the [best-in-class review](best_in_class_review) is built
- given: a corpus stating the [field of the governed software](field_of_the_governed_software)
    and a repository holding a README
  then: the prompt states the corpus's field as the field and the README beside it
    as a source
  when: the prompt of the [best-in-class review](best_in_class_review) is built
