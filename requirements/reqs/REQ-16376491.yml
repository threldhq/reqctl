acceptance_criteria:
- given: a [statement citation](statement_citation) [pinned](pin) to the [stamp](stamp)
    its requirement carries, over code that does not satisfy the requirement
  then: it asks the owner whether to change the code or revise the requirement
  when: the ${plugin_components.implement_skill} reads the code
- given: the ${plugin_components.pre_pr_skill} finding cited code that does not satisfy
    the requirement its [statement citation](statement_citation) names
  then: it asks the owner whether to change the code or revise the requirement, and
    writes no pull request body before the owner answers
  when: the pass reaches that finding
- given: a [statement citation](statement_citation) of a requirement the corpus has
    deprecated
  then: no [question for the owner](question_for_the_owner) is raised for it, and
    the [statement citation](statement_citation) is removed
  when: either skill reads it
