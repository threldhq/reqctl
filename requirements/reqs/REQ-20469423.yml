text: Where the corpus holds a [data item](data_item) named value_types, the product
  shall count a quantity more than one of the same value type in a different unit
  where it is more at some pair of sizes the two units can take, and less where it
  is less at some such pair, a unit taking its factor or any size from its least to
  its most.
