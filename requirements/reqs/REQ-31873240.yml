acceptance_criteria:
- given: a field of an [entry](entry) of a [data item](data_item) that the governing
    schema marks x-verbatim
  then: the product stores that text unchanged and refuses nothing for the separators
  when: SVG path data whose numbers are separated by spaces and commas is written
    to it
- given: a field the governing schema marks x-verbatim
  then: the product stores the text with its brackets and refuses nothing a set would
    be refused for
  when: a value written in brackets is written to it
- given: a field the governing schema marks x-verbatim
  then: the [item](item) reads back the text, not a number or a boolean
  when: a value that reads as a number, true or false is written to it
- given: a field the governing schema marks x-verbatim
  then: the product stores the value without them
  when: a value with leading or trailing spaces is written to it
- given: a field the governing schema marks x-verbatim
  then: the product refuses the value
  when: a value carrying a hidden character is written to it
