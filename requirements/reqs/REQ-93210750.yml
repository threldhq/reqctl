acceptance_criteria:
- given: a [kind schema](kind_schema) marking a field as taking an [entry](entry)
    of a [data item](data_item) the corpus holds
  then: the product refuses the [item](item), naming the field, the value and the
    [data item](data_item)
  when: an [item](item) whose value in that field names no [entry](entry) of that
    [data item](data_item) is written, revised or linted
- given: a [kind schema](kind_schema) marking a field as taking an [entry](entry)
    of a [data item](data_item) the corpus holds
  then: the product accepts the value
  when: an [item](item) whose value in that field names an [entry](entry) of that
    [data item](data_item) is written
- given: a [kind schema](kind_schema) marking a field as taking an [entry](entry)
    of a [data item](data_item) the corpus holds, and a list in that field
  then: the product refuses the [item](item), naming the member
  when: a member of the list names no [entry](entry) of that [data item](data_item)
- given: a [kind schema](kind_schema) marking a field as taking an [entry](entry)
    of a [data item](data_item) the corpus does not hold
  then: the product refuses nothing for that value
  when: an [item](item) stating any value in that field is written
- given: a corpus holding an [item](item) whose value in a field so marked names no
    [entry](entry) of the [data item](data_item)
  then: the product refuses the [item](item)
  when: the corpus is validated
