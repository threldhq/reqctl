acceptance_criteria:
- given: a change to a requirement's text and to a code file
  then: the product reports a problem and names the files on each side
  when: the change is checked against its base branch
- given: a change to a requirement's text and a re-pin of a [statement citation](statement_citation)
    of it
  then: the product reports no problem
  when: the change is checked against its base branch
- given: a change to the baseline and to a code file
  then: the product reports no problem
  when: the change is checked against its base branch
- given: a change only to the [pins](pin) a corpus [item](item) holds, and to a code
    file
  then: the product reports no problem
  when: the change is checked against its base branch
- given: a change to a requirement's text and an added [statement citation](statement_citation)
    of it
  then: the product reports a problem
  when: the change is checked against its base branch
- given: a change to a schema under the [corpus root](corpus_root) and to a code file
  then: the product reports a problem
  when: the change is checked against its base branch
- given: a change to the [citation list](citation_list) of a requirement and to a
    code file
  then: the product reports no problem
  when: the change is checked against its base branch
- given: a change to a file a [whole-file citation](whole_file_citation) covers, and
    only to that citation's digest in the [item](item) holding it
  then: the product reports no problem
  when: the change is checked against its base branch
- given: a change adding a [whole-file citation](whole_file_citation) to an [item](item),
    and the file it covers
  then: the product reports no problem
  when: the change is checked against its base branch
- given: a change removing a [whole-file citation](whole_file_citation) from an [item](item),
    and deleting the file it covered
  then: the product reports no problem
  when: the change is checked against its base branch
- given: a change adding a [whole-file citation](whole_file_citation) to an [item](item),
    re-pinning [statement citations](statement_citation), and changing a code file
    the [whole-file citation](whole_file_citation) does not cover
  then: the product reports no problem
  when: the change is checked against its base branch
- given: a change to a requirement's text, a [whole-file citation](whole_file_citation)
    the change adds to any [item](item), and the code file that citation covers
  then: the product reports a problem and names the files on each side
  when: the change is checked against its base branch
- given: a change to a requirement's rationale and to a code file
  then: the product reports a problem and names the files on each side
  when: the change is checked against its base branch
- given: a change adding an [entry](entry) to the plugin components and the plugin
    file its path covers
  then: the product reports no problem
  when: the change is checked against its base branch
- given: a change adding an [entry](entry) to the plugin components and a code file
    no path of the [entry](entry) covers
  then: the product reports a problem and names the files on each side
  when: the change is checked against its base branch
- given: a change to a path an existing [entry](entry) of the plugin components states,
    and to the file that path covers
  then: the product reports a problem
  when: the change is checked against its base branch
- given: a change lowering a count in the [uncited-count record](uncited_count_record)
    and adding a [statement citation](statement_citation) to a code file
  then: the product reports no problem
  when: the change is checked against its base branch
- given: a change removing a file from the [uncited-count record](uncited_count_record)
    and deleting that file
  then: the product reports no problem
  when: the change is checked against its base branch
- given: a change raising a count in the [uncited-count record](uncited_count_record)
    and adding a line to a code file
  then: the product reports a problem and names the files on each side
  when: the change is checked against its base branch
- given: a change creating the [uncited-count record](uncited_count_record), or adding
    a file to it, and changing a code file
  then: the product reports a problem and names the files on each side
  when: the change is checked against its base branch
- given: a change lowering one count and raising another in the [uncited-count record](uncited_count_record),
    and changing a code file
  then: the product reports a problem and names the files on each side
  when: the change is checked against its base branch
