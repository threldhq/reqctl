text: If a change touches both a file outside the [corpus root](corpus_root) in more
  than the [stamps](stamp) its [statement citations](statement_citation) name, and
  a file under the [corpus root](corpus_root), other than the baseline and other than
  an [uncited-count record](uncited_count_record) the change does no more to than
  lower or remove counts, in more than its [pins](pin), its [citation list](citation_list),
  its [whole-file citations](whole_file_citation) and the [entries](entry) the change
  adds to the ${plugin_components} whose paths together cover every such file outside
  the [corpus root](corpus_root), then the product shall report a problem when the
  ${corpus_gates.travel_alone} gate checks the change against its base branch.
type: functional
