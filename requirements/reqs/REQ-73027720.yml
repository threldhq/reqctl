acceptance_criteria:
- given: an approved requirement that no [statement citation](statement_citation)
    names
  then: the product warns of the requirement and reports no problem for it
  when: trace is run
- given: an approved guard that no [statement citation](statement_citation) names
  then: the product warns of the guard and reports no problem for it
  when: trace is run
- given: an approved parameter or [data item](data_item) that no [statement citation](statement_citation)
    names
  then: the product gives no warning of it
  when: trace is run
- given: an approved requirement holding a [whole-file citation](whole_file_citation)
    that no [statement citation](statement_citation) names
  then: the product gives no warning of it
  when: trace is run
- given: an approved requirement holding a [whole-file citation](whole_file_citation)
    [pinned](pin) to a [stamp](stamp) it no longer carries, that no [statement citation](statement_citation)
    names
  then: the product gives no warning of it
  when: trace is run
- given: an approved requirement whose only [whole-file citation](whole_file_citation)
    is of a [test](test) and that no [statement citation](statement_citation) names
  then: the product warns of it
  when: trace is run
