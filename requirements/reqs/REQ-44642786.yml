acceptance_criteria:
- given: an approved [item](item) the baseline does not state
  then: the product reports the [item](item) as approved but absent from the baseline
  when: baseline --check is run
- given: an [item](item) the baseline states that the corpus no longer approves
  then: the product reports the [item](item) as no longer approved
  when: baseline --check is run
- given: an [item](item) whose [stamp](stamp) differs from the [stamp](stamp) the
    baseline states
  then: the product reports the [item](item) as changed since the baseline
  when: baseline --check is run
- given: a baseline stating every approved [item](item) at the [stamp](stamp) the
    corpus holds
  then: the product reports no disagreement
  when: baseline --check is run
