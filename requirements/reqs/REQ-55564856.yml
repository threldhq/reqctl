acceptance_criteria:
- given: an [item](item) whose value ends with a hidden space
  then: the [item](item) stores the value without the hidden space, in place of the
    value it carried
  when: reqctl revise writes the [item](item), restating that value
- given: a term recording an unclaimed phrase that holds a hidden space between two
    words
  then: the term records the phrase with a plain space in place of the hidden one,
    with that reason, and no longer records the phrase it carried
  when: reqctl revise restates that phrase with a reason
- given: a term recording an unclaimed phrase that holds a hidden space between two
    words
  then: the term records that phrase with that reason, and no longer records the phrase
    it carried
  when: reqctl revise writes the phrase with a plain space in its place, with a reason
