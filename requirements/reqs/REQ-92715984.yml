acceptance_criteria:
- given: a repository with no origin to compare against
  then: the output is one line naming the script and naming --base as the step that
    clears the fault
  when: the script is asked to build the prompts
- given: a record of earlier readings that does not read as JSON
  then: the output is one line naming the script, the record and deleting the record
    as the step that clears the fault
  when: the script reads the record
- given: a defect in the script itself rather than in what it reads
  then: the traceback stands
  when: the fault reaches the caller
