acceptance_criteria:
- given: a [statement citation](statement_citation) naming a [stamp](stamp) the approved
    parameter it names no longer carries
  then: the product reports the [citation](statement_citation) as a problem
  when: trace is given no base branch
- given: a [statement citation](statement_citation) of a [data item](data_item) whose
    [citation digest](citation_digest) differs from the one the [data item](data_item)'s
    [citation list](citation_list) holds for it
  then: the product reports the [citation](statement_citation) as a problem
  when: trace is run
- given: a [test](test) carrying a [statement citation](statement_citation) of a parameter
  then: the product reports the [citation](statement_citation) as a problem and names
    no [test](test) among what cites the parameter
  when: trace is run
