acceptance_criteria:
- given: a .py file defining no function, class or method named g
  then: the product refuses, names g, and writes nothing
  when: reqctl tag is given g in place of lines
- given: a .py file whose class C defines no method m while class D does
  then: the product refuses, names C.m, and writes nothing
  when: reqctl tag is given C.m
- given: a JavaScript file
  then: the product refuses, names the name, and writes nothing
  when: reqctl tag is given a name in place of lines
