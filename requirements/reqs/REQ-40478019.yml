acceptance_criteria:
- given: a file of the [code base](code_base) in ${commentless_formats.json}
  then: the [item](item) holds the file's path and a digest of its entire content
  when: an [item](item) is cited against the whole file
- given: a lockfile of the [code base](code_base), which can carry a comment
  then: the [item](item) holds the file's path and a digest of its entire content
  when: an [item](item) is cited against the whole file
- given: an [item](item) holding a [whole-file citation](whole_file_citation)
  then: the product reports the [citation](whole_file_citation) as a problem
  when: a key or value in the file changes after the [item](item) took its digest
    and trace is run
- given: an [item](item) holding a [whole-file citation](whole_file_citation) [pinned](pin)
    to a [stamp](stamp) the [item](item) no longer carries
  then: the product reports the [citation](whole_file_citation) as a problem
  when: trace is given no base branch
- given: an [item](item) holding a [whole-file citation](whole_file_citation) of a
    file that reads as [code tokens](code_token)
  then: the product reports no problem for the [citation](whole_file_citation)
  when: only the white space between its tokens changes and trace is run
- given: an [item](item) holding a [whole-file citation](whole_file_citation)
  then: the product reports no problem for the [citation](whole_file_citation)
  when: only the file's line endings change and trace is run
