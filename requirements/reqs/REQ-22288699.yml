acceptance_criteria:
- given: a probe whose verdict never returned
  then: the report states that the figures are not comparable with a complete run
  when: the run is scored
- given: a recall return the product could not read
  then: the report names the return and states that its recall column reads no for
    a return never read
  when: the run is scored
- given: a duplicate probe that did not find its source
  then: the report states that the run did not work rather than measuring badly
  when: the run is scored
