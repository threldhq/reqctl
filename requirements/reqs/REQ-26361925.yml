acceptance_criteria:
- given: an approved requirement whose verification is inspection, cited by a [statement
    citation](statement_citation) carrying a stamp and cited by no [test](test)
  then: the product reports no problem for the requirement
  when: trace is run
- given: an approved requirement whose verification is inspection, cited only by code
    carrying a stamp the requirement no longer holds
  then: the product reports the citation as behind the corpus and reports no problem
    for want of a [test](test)
  when: trace is run
