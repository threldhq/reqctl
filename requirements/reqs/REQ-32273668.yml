acceptance_criteria:
- given: a [data item](data_item) whose [entry](entry) holds a number as a [structured
    value](structured_value), and a requirement whose text writes the same number
    before credits
  then: the product refuses the requirement and names the [structured value](structured_value)
    as the one to reference
  when: the corpus is validated
- given: a parameter whose value is a number of seconds, and a term whose definition
    writes the same number before seconds
  then: the product refuses the term and names the parameter
  when: the corpus is validated
- given: a parameter whose value is a number of seconds, and an [entry](entry) whose
    field the schema declares as prose writes the same number before seconds
  then: the product refuses the [data item](data_item) holding the [entry](entry)
  when: the corpus is validated
