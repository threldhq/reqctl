text: If the Claude Code plugin that a script belongs to and the reqctl that the script
  uses are different releases when a script that a skill of the plugin runs starts,
  compared by the version that the ${plugin_components.plugin_manifest} states and
  the version that the reqctl reports, then the product shall state on the script's
  output that they are different releases, naming both, and go on with the run of
  the script.
