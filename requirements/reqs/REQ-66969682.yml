acceptance_criteria:
- given: a script that a skill of the plugin runs, the plugin being of one release
    and the reqctl that the script uses of another
  then: the script's output names both releases and states that they differ
  when: the script starts
- given: a script that a skill of the plugin runs, the plugin and the reqctl that
    the script uses being of the same release
  then: the script's output states no difference of release
  when: the script starts
- given: a script that a skill of the plugin runs, the plugin being of one release
    and the reqctl that the script uses of another
  then: the script goes on with its run
  when: the script has stated that they differ
