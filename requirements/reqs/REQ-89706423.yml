acceptance_criteria:
- given: lines of code whose first line is blank
  then: the [code base](code_base) gains only the lines holding a comment that carries
    the [statement citation](statement_citation), and the [citation list](citation_list)
    of the requirement gains only the [statement citation](statement_citation)
  when: the product writes a [statement citation](statement_citation) naming a requirement
    at them
- given: a file whose lines end in a carriage return and a line feed
  then: every line ending the file held is unchanged
  when: the product writes a [statement citation](statement_citation) naming a requirement
    at lines of it
- given: a file whose last line ends without a line break
  then: the text of that line is unchanged and the comment closing the [statement
    citation](statement_citation) stands on a line of its own
  when: the product writes a [statement citation](statement_citation) naming a requirement
    at lines ending on that line
