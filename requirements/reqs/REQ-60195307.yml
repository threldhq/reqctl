acceptance_criteria:
- given: a [practice](practice) quoting passages from two sources, one whose [page
    text](page_text) holds words only in its title elements and not the passage, the
    other holding its passage
  then: the product sets the first source aside, keeps the [practice](practice) with
    the second source, and does not refuse the review
  when: the review is checked
- given: a source whose [page text](page_text) holds a word outside its title elements
    and does not hold the passage a [practice](practice) quotes from it
  then: the product refuses the review and names the source as not holding the passage
  when: the review is checked
