text: Where a reference, a link or reqctl revise names a [block member](block_member)
  by its [addressable block](addressable_block)'s name and its key joined by a dot,
  the product shall treat the [block member](block_member) as an [entry](entry) of
  the [data item](data_item) keyed by that name and key.
