acceptance_criteria:
- given: a judge prompt that was not split into groups holding more lines than the
    line bound
  then: the product refuses the run, naming the prompt, plan.py build with a larger
    --lines, and a smaller challenge_bounds.judge_bound in settings.yml
  when: the judge prompts are built
- given: a group prompt holding more lines than the line bound
  then: the product refuses the run, naming the prompt, plan.py build with a larger
    --lines, and a smaller challenge_bounds.judge_group in settings.yml
  when: the judge prompts are built
- given: a final prompt holding more lines than the line bound
  then: the product refuses the run, naming the prompt and plan.py build with a larger
    --lines
  when: the final prompts are built
