acceptance_criteria:
- given: an approved term, and an entry of a data item holding a field named unit
    whose value states the word the term defines
  then: the product accepts the field
  when: the corpus is validated
- given: an approved term, and an entry of a data item holding a field named unit
    whose value states the word the term defines
  then: the product accepts the field
  when: the data item is written
- given: an approved term, and an entry of a data item whose field other than unit,
    not declared as prose, states the word the term defines without a link
  then: the product refuses the field
  when: the corpus is validated
