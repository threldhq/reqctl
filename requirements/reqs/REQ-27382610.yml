acceptance_criteria:
- given: a corpus holding a [data item](data_item) named value_types, and a [data
    item](data_item) whose ceiling names an [entry](entry) stating the value type
    count and the quantity ten, holding another [entry](entry) stating the value type
    count and the quantity eleven
  then: the product refuses the [data item](data_item), naming the ceiling and the
    [entry](entry) whose quantity is more
  when: the [data item](data_item) is written
- given: a corpus holding a [data item](data_item) named value_types, and a [data
    item](data_item) whose ceiling names an [entry](entry) stating the value type
    count and the quantity ten, holding another [entry](entry) stating the value type
    count and the quantity nine
  then: the product accepts the [data item](data_item)
  when: the [data item](data_item) is written
- given: a corpus holding a [data item](data_item) named value_types, and a [data
    item](data_item) whose ceiling names an [entry](entry) stating the value type
    count, holding an [entry](entry) stating the value type duration
  then: the product holds the duration to no ceiling
  when: the [data item](data_item) is written
- given: a corpus holding no [data item](data_item) named value_types, and a [data
    item](data_item) whose ceiling names an [entry](entry) of a smaller quantity than
    another [entry](entry) of the same value type
  then: the product accepts the [data item](data_item)
  when: the corpus is validated
