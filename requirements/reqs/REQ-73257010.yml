acceptance_criteria:
- given: a Python file inside the working tree that origin's default branch does not
    hold, naming a file under the plugin's folder
  then: the product refuses the [tool call](tool_call)
  when: a [tool call](tool_call) runs it
- given: a Python file in a scratch folder outside the working tree whose text writes
    under the installed plugin's folder
  then: the product refuses the [tool call](tool_call)
  when: a [tool call](tool_call) changes directory to that scratch folder and runs
    it
- given: a script origin's default branch holds unchanged at its path, naming the
    plugin's folder
  then: the product does not refuse the [tool call](tool_call) on that ground
  when: a [tool call](tool_call) runs it
