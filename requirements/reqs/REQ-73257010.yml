text: If a [tool call](tool_call) would run a file that origin's default branch does
  not hold unchanged at its path, whose text names the folder of the Claude Code plugin
  whose ${plugin_components.requirements_guard_hook} judges the [tool call](tool_call)
  or a file or folder under it, then the product shall refuse the [tool call](tool_call),
  wherever the file lies and wherever the [tool call](tool_call) runs it from, unless
  the file lies under that folder, its bytes have a SHA-256 digest the plugin's [fingerprint
  list](fingerprint_list) holds, and the [tool call](tool_call) runs it without changing
  the environment.
