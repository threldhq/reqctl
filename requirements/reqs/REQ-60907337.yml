acceptance_criteria:
- given: a session
  then: the [tool call](tool_call) is refused
  when: a [tool call](tool_call) runs git fetch naming its remote through a command
    substitution
- given: a session
  then: the [tool call](tool_call) is refused
  when: a [tool call](tool_call) runs git pull naming its remote through a variable
- given: a session
  then: the [tool call](tool_call) is not refused on that ground
  when: a [tool call](tool_call) runs git fetch naming a remote by a literal URL
- given: a checked-out branch with an upstream remote
  then: the product judges it against the branch's upstream remote and does not refuse
    it for naming none
  when: a [tool call](tool_call) runs git fetch naming no remote
- given: a checked-out branch with no upstream remote
  then: the product judges it against origin and does not refuse it for naming none
  when: a [tool call](tool_call) runs git pull naming no remote
