acceptance_criteria:
- given: an .html file whose style element holds CSS rules
  then: the product refuses and names placing the citation outside the style element
    as the fix
  when: reqctl tag cites lines so that a citation comment would fall inside the style
    element
- given: an .html file whose style element holds CSS rules
  then: the product writes the citation
  when: reqctl tag cites lines whose citation comments fall before the style element
    opens and after it closes
- given: a .js file or a script element holding a template literal
  then: the product refuses and names placing the citation outside the template literal
    as the fix
  when: reqctl tag cites lines so that a citation comment would fall inside the template
    literal
