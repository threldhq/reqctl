acceptance_criteria:
- given: an [item](item) stating a quantity and a unit that another [item](item) already
    states
  then: the product names both [items](item) and states that a single parameter both
    reference is where the quantity belongs
  when: the [item](item) is written
- given: two [items](item) each stating the same quantity with no unit
  then: the product refuses and names both [items](item)
  when: the corpus is validated
- given: an [item](item) stating a quantity with a unit and another [item](item) stating
    the same number with no unit
  then: the product accepts both [items](item)
  when: the corpus is validated
- given: two [items](item) stating the same quantity in different units
  then: the product accepts the [items](item)
  when: the corpus is validated
