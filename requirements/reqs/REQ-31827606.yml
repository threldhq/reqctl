acceptance_criteria:
- given: two [items](item) whose rationales each write the same number in figures
    before minutes
  then: the product refuses both [items](item), names both, and states that a single
    parameter both reference is where the quantity belongs
  when: the corpus is validated
- given: two [items](item) whose prose each states the same quantity with no unit
  then: the product refuses and names both [items](item)
  when: the corpus is validated
- given: an [item](item) whose prose states a quantity with a unit and another [item](item)
    whose prose states the same number with no unit
  then: the product accepts both [items](item)
  when: the corpus is validated
- given: two [items](item) whose prose states the same quantity in different units
  then: the product accepts the [items](item)
  when: the corpus is validated
- given: a [data item](data_item) whose [entry](entry) holds a number of seconds as
    a [structured value](structured_value), and a requirement whose text writes the
    same number before seconds
  then: the product refuses the requirement and names the [structured value](structured_value)
    as the one to reference
  when: the corpus is validated
- given: a parameter whose value is a number of seconds, and a term whose definition
    writes the same number before seconds
  then: the product refuses the term and names the parameter
  when: the corpus is validated
- given: a parameter whose value is a number with no unit, and a requirement whose
    criterion writes the same number with no unit
  then: the product accepts both [items](item)
  when: the corpus is validated
- given: two [data items](data_item) whose [entries](entry) each hold the same number
    as a [structured value](structured_value)
  then: the product accepts both [data items](data_item)
  when: the corpus is validated
