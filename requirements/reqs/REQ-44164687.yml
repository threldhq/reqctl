acceptance_criteria:
- given: 'code carrying a comment that names a requirement and its stamp in the @req:
    form'
  then: the product reports a problem naming the file and the item, directing the
    reader to cite it with reqctl tag
  when: trace is run
- given: 'code carrying a module-level mapping whose values name items in the @req:
    form'
  then: the product reports a problem for each value
  when: trace is run
- given: 'a [test](test) carrying the @req: form'
  then: the product reports the problem as it does outside every [test](test)
  when: trace is run
- given: 'code naming an item''s identifier without the @req: form, as data or in
    a string'
  then: the product reports no problem for it
  when: trace is run
- given: code citing items only through [statement citations](statement_citation)
  then: the product reports no problem for the form of any citation
  when: trace is run
