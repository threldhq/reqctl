text: Where ${uncited_code.check.mode} is changed_lines, when trace is given a base
  branch, the product shall report as one problem each [unknown-syntax file](unknown_syntax_file)
  the product scans for [statement citations](statement_citation) in which the branch
  adds or changes a line of code, or moves one past another line of code or from another
  file, that no [statement citation](statement_citation) covers and no [citation digest](citation_digest)
  takes in, and of which no [item](item) holds a [whole-file citation](whole_file_citation),
  stating that the product knows no comment syntax for the file and naming as remedies
  citing the file whole and adding the file's comment syntax to the product.
