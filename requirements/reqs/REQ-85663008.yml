acceptance_criteria:
- given: a branch touching [statement citations](statement_citation) of two requirements,
    neither read before
  then: two [reading agents](reading_agent) are spawned, one for each requirement
  when: the pre-pr skill makes its pass
- given: a branch touching three [statement citations](statement_citation) of one
    requirement
  then: one [reading agent](reading_agent) is spawned for the requirement
  when: the pre-pr skill makes its pass
- given: an [item](item) whose prompt, as the script builds it, is identical to one
    already read as satisfied by a [reading agent](reading_agent)
  then: no [reading agent](reading_agent) is spawned for the [item](item), and the
    earlier verdict and its lines stand as the verdict of the [item](item)
  when: the pre-pr skill makes its pass
- given: an [item](item) whose statement, acceptance criteria or cited code changed
    since it was read as satisfied
  then: a [reading agent](reading_agent) is spawned for the [item](item)
  when: the pre-pr skill makes its pass
- given: an [item](item) whose prompt is identical to one a [searching reader](searching_reader)
    read as satisfied, and every file the reply of the [searching reader](searching_reader)
    names unchanged since
  then: no [reading agent](reading_agent) and no [searching reader](searching_reader)
    is spawned for the [item](item), and the earlier verdict and its lines stand as
    the verdict of the [item](item)
  when: the pre-pr skill makes its pass
- given: an [item](item) whose prompt is identical to one a [searching reader](searching_reader)
    read as satisfied, and a file the reply of the [searching reader](searching_reader)
    names changed since
  then: a [reading agent](reading_agent) is spawned for the [item](item)
  when: the pre-pr skill makes its pass
- given: an [item](item) whose code the owner accepted against a prompt identical
    to the one the script builds, read by no [searching reader](searching_reader)
  then: no [reading agent](reading_agent) is spawned for the [item](item)
  when: the pre-pr skill makes its pass
- given: an [item](item) whose code the owner accepted against a prompt identical
    to the one the script builds, and every file the reply of its [searching reader](searching_reader)
    names unchanged since
  then: no [reading agent](reading_agent) and no [searching reader](searching_reader)
    is spawned for the [item](item)
  when: the pre-pr skill makes its pass
- given: an [item](item) whose code the owner accepted against a prompt identical
    to the one the script builds, and a file the reply of its [searching reader](searching_reader)
    names changed since
  then: a [reading agent](reading_agent) is spawned for the [item](item)
  when: the pre-pr skill makes its pass
- given: an [item](item) whose statement, acceptance criteria or cited code changed
    since the owner accepted its code
  then: a [reading agent](reading_agent) is spawned for the [item](item)
  when: the pre-pr skill makes its pass
