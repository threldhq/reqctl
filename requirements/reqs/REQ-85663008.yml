acceptance_criteria:
- given: a branch touching [statement citations](statement_citation) of two requirements,
    neither read before
  then: two [reading agents](reading_agent) are spawned, one for each requirement
  when: the pre-pr skill makes its pass
- given: a branch touching three [statement citations](statement_citation) of one
    requirement
  then: one [reading agent](reading_agent) is spawned for the requirement
  when: the pre-pr skill makes its pass
- given: an [item](item) whose prompt, as the script builds it, is identical to one
    already read as satisfied
  then: no [reading agent](reading_agent) is spawned for the [item](item), and the
    earlier verdict and its lines stand as the verdict of the [item](item)
  when: the pre-pr skill makes its pass
- given: an [item](item) whose statement, acceptance criteria or cited code changed
    since it was read as satisfied
  then: a [reading agent](reading_agent) is spawned for the [item](item)
  when: the pre-pr skill makes its pass
