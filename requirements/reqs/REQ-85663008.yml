text: When the ${plugin_components.pre_pr_skill} makes its pass over a branch, the
  product shall spawn one [reading agent](reading_agent) for each requirement, guard,
  parameter and [data item](data_item) the product names as touched by the branch,
  other than an [item](item) for which the script builds a prompt identical to one
  that a [reading agent](reading_agent) already read as ${reading_verdicts.satisfied},
  other than an [item](item) for which the script builds a prompt identical to one
  that a [searching reader](searching_reader) already read as ${reading_verdicts.satisfied}
  while every file that the reply of the [searching reader](searching_reader) names
  is unchanged since that reading, and other than an [item](item) for which the script
  builds a prompt identical to the one against which the product recorded that the
  owner accepts the code as satisfying the [item](item) while, where a [searching
  reader](searching_reader) read the [item](item), every file that the reply of the
  [searching reader](searching_reader) names is unchanged since that reading.
