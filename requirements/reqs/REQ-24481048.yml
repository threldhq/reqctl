acceptance_criteria:
- given: an approved term recording a phrase it does not claim, with a reason, and
    prose stating that phrase with the word the term defines unlinked
  then: the product accepts the prose
  when: the corpus is validated
- given: an approved term recording a phrase it does not claim, with a reason, and
    prose stating that phrase with an alias the term carries unlinked
  then: the product accepts the prose
  when: the corpus is validated
- given: an approved term recording a phrase it does not claim, and prose stating
    the word the term defines unlinked outside any recorded phrase
  then: the product refuses the prose
  when: the corpus is validated
