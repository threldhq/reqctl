acceptance_criteria:
- given: no [pass record](pass_record)
  then: the product refuses it and names running the pre-pr pass as the route
  when: a [tool call](tool_call) would open a pull request for a branch changing a
    file outside the [corpus root](corpus_root)
- given: a [pass record](pass_record) the product cannot read or cannot parse
  then: the product refuses it
  when: a [tool call](tool_call) would open such a pull request
- given: a [pass record](pass_record) naming a commit other than the commit HEAD names
  then: the product refuses it
  when: a [tool call](tool_call) would open such a pull request
- given: a [pass record](pass_record) naming the commit HEAD names
  then: the product does not refuse it on that ground
  when: a [tool call](tool_call) would open such a pull request
- given: a branch changing only files under the [corpus root](corpus_root)
  then: the product does not refuse it on that ground
  when: a [tool call](tool_call) would open a pull request for it
- given: gh pr create after an env, command or assignment prefix or inside sh -c
  then: the product judges it as opening a pull request
  when: the [tool call](tool_call) is made
