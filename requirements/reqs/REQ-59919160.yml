acceptance_criteria:
- given: a Write [tool call](tool_call) whose file lies under the plugin's folder
  then: the product refuses the [tool call](tool_call)
  when: the [tool call](tool_call) is made
- given: a shell command that copies, moves, redirects into or removes a path under
    the plugin's folder
  then: the product refuses the [tool call](tool_call)
  when: the [tool call](tool_call) is made
- given: a shell command naming a path under the plugin's folder through quoting,
    a glob, a variable, a change of directory or a symlink, to a write
  then: the product refuses it as it refuses the path spelled plainly
  when: the [tool call](tool_call) is made
- given: a Read, Grep or Glob of a path under the plugin's folder, or a shell command
    that only reads it
  then: the product does not refuse the [tool call](tool_call) on that ground
  when: the [tool call](tool_call) is made
- given: a write to the plugin's sources in a repository, while the plugin whose hook
    judges the call is installed in another folder
  then: the product does not refuse the [tool call](tool_call) on that ground
  when: the [tool call](tool_call) is made
- given: reqctl writing a [statement citation](statement_citation) in a file under
    the plugin's folder
  then: the product does not refuse it on that ground
  when: the [tool call](tool_call) running reqctl is made
- given: a call running reqctl and, in another command, writing a path under the plugin's
    folder
  then: the product refuses the [tool call](tool_call)
  when: the [tool call](tool_call) is made
- given: a shell command whose write target under a variable, a command substitution
    or a glob cannot be resolved from its text
  then: the product refuses the [tool call](tool_call)
  when: the [tool call](tool_call) is made
- given: git commit -m, or gh pr, issue or review --title or --body, whose literal
    text names a path under the plugin's folder
  then: the product does not refuse it on that ground
  when: the [tool call](tool_call) is made
- given: a command that installs or updates the plugin and names no path under its
    folder
  then: the product does not refuse it on that ground
  when: the [tool call](tool_call) is made
- given: a shell command that removes, moves, links or changes the mode of the plugin's
    folder itself
  then: the product refuses the [tool call](tool_call) and names changing the plugin
    through a reqctl release as the route
  when: the [tool call](tool_call) is made
