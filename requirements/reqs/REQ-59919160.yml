text: If a [tool call](tool_call) names the folder of the Claude Code plugin whose
  ${plugin_components.requirements_guard_hook} judges the [tool call](tool_call),
  or a file or folder under it, as what it would write, edit, create, move, link,
  remove or change the mode of, other than in literal text, written inline or in a
  heredoc, that it passes as a commit message or as the title, body or comment of
  a pull request, an issue or a review, then the product shall refuse the [tool call](tool_call),
  however the path is spelled, unless each command or tool in the call that names
  the path is reqctl.
