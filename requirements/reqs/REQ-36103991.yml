acceptance_criteria:
- given: a Python file beginning with a UTF-8 byte order mark
  then: the file begins with the byte order mark and the comment follows it
  when: reqctl tag cites its first line
- given: a file beginning with a UTF-8 byte order mark whose first line is a comment
    carrying a [statement citation](statement_citation)
  then: the file begins with the byte order mark
  when: reqctl untag removes that comment
- given: a file beginning with a UTF-8 byte order mark and carrying a [statement citation](statement_citation)
  then: the file begins with the byte order mark
  when: reqctl repin rewrites it
