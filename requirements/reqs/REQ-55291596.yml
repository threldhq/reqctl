acceptance_criteria:
- given: a Markdown file whose first line opens its [front matter](front_matter)
  then: each comment carrying the [statement citation](statement_citation) is a YAML
    comment within the [front matter](front_matter), and the file's first line still
    opens the [front matter](front_matter)
  when: reqctl tag cites a requirement at lines within the [front matter](front_matter)
- given: a Markdown file whose [front matter](front_matter) holds a [statement citation](statement_citation)
    written as a YAML comment
  then: it reads as the mapping it held before the [statement citation](statement_citation)
    was written
  when: the [front matter](front_matter) is read as YAML
- given: a [statement citation](statement_citation) asked over lines that begin within
    a Markdown file's [front matter](front_matter) and end after it
  then: the product refuses the [statement citation](statement_citation) and writes
    nothing
  when: reqctl tag is run
- given: a [statement citation](statement_citation) asked over lines within a Markdown
    file's [front matter](front_matter) that covers a line at a [nest level](nest_level)
    shallower than the first line it covers, or opens a nest without covering every
    line that nest holds
  then: the product refuses the [statement citation](statement_citation)
  when: reqctl tag is run
