acceptance_criteria:
- given: an [item](item) whose relation [awaits assessment](awaiting_assessment)
  then: the product [pins](pin) it without running the checks validate runs over the
    whole corpus
  when: reqctl relate is run again for that relation
- given: an [item](item) whose reference [awaits assessment](awaiting_assessment)
  then: the product [pins](pin) it without running the checks validate runs over the
    whole corpus
  when: reqctl revise --ack names the reference and changes nothing else
- given: an [item](item)
  then: the product runs the checks validate runs over the whole corpus
  when: reqctl revise changes its text
