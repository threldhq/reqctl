acceptance_criteria:
- given: a repository stating its own schema for a kind
  then: each [item](item) of that kind is read through the repository's schema and
    not the packaged one
  when: the corpus is validated
- given: a repository whose own schema for a kind does not compile
  then: the product reports that schema as broken rather than falling back to the
    packaged one
  when: the corpus is validated
