acceptance_criteria:
- given: a run holding the [proposal](proposal) file numbered 23 and a criteria record
    keyed 023
  then: the product reads the key as [proposal](proposal) 23
  when: the run is built
- given: a run holding the [proposal](proposal) file numbered 29 and a trace record
    keyed 029
  then: the product reads the key as [proposal](proposal) 29
  when: the run is built
- given: a run holding the [proposal](proposal) file numbered 31 and a criteria record
    keyed "031"
  then: the product reads the key as [proposal](proposal) 31
  when: the run is built
- given: a run whose binds record names [proposal](proposal) 037 under a dimension
  then: the product reads it as [proposal](proposal) 37
  when: the run is built
- given: a run whose criteria record holds keys 041 and 41
  then: the product refuses the run, naming [proposal](proposal) 41 as recorded twice
  when: the run is built
- given: a run whose criteria record holds a key written as zeros alone
  then: the product refuses the run, the key naming no [proposal](proposal) the run
    holds
  when: the run is built
