acceptance_criteria:
- given: a branch one of whose touched [items](item) has a verdict of cannot tell
    and no recorded acceptance
  then: the product writes no [pass record](pass_record) and names the [item](item)
  when: the product is asked to record the pass
- given: a touched [item](item) with a verdict of not satisfied and a recorded acceptance
    that still counts
  then: the product does not refuse on account of that [item](item)
  when: the product is asked to record the pass
