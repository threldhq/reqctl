acceptance_criteria:
- given: a [tool call](tool_call) running find with -delete from the [project root](project_root)
    or a parent of it, named absolutely or relatively
  then: the product refuses it
  when: the [tool call](tool_call) is made
- given: a [tool call](tool_call) running find with -delete from ., .., ~, / or a
    starting point that begins with a variable or a command substitution
  then: the product refuses it
  when: the [tool call](tool_call) is made
- given: a [tool call](tool_call) running find . -name '*.pyc' -delete
  then: the product refuses it, whatever predicates come before -delete
  when: the [tool call](tool_call) is made
- given: a [tool call](tool_call) running find with -delete from a folder inside,
    beside or outside the [project root](project_root)
  then: the product does not refuse it
  when: the [tool call](tool_call) is made
