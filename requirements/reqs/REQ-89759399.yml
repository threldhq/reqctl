acceptance_criteria:
- given: a pattern admitting the [stamp](stamp) an [item](item) carries that also
    admits a string one character longer or shorter
  then: the product reports a problem
  when: the ${corpus_gates.stamp_admission} gate runs
- given: a pattern admitting a uid that also admits a kind the product does not [mint](mint)
    or a number of other than eight digits
