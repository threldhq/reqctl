acceptance_criteria:
- given: a guard carrying a parameter reference to a nominated dimension's [item](item),
    whole or by member
  then: the guard is named as binding to that dimension
  when: the corpus is validated
- given: a guard carrying a concept link to a nominated dimension's [item](item),
    whole or by member
  then: the guard is named as binding to that dimension
  when: the corpus is validated
- given: a corpus nominating no dimension
  then: no guard is named, there being no dimension for one to bind to
  when: the corpus is validated
- given: two guards each carrying a parameter reference or a concept link to a nominated
    dimension's [item](item)
  then: each guard is named as binding to that dimension
  when: the corpus is validated
