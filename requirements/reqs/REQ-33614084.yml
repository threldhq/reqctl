acceptance_criteria:
- given: an [item](item) holding a [whole-file citation](whole_file_citation) of a
    file
  then: the product names that [item](item)
  when: a change edits a key or value in that file and the product states what the
    change touches
- given: an [item](item) holding a [whole-file citation](whole_file_citation) of a
    file that reads as [code tokens](code_token)
  then: the product does not name that [item](item) on that ground
  when: a change alters only the white space between its tokens
- given: an [item](item) to which a change adds a [whole-file citation](whole_file_citation),
    or from which it removes one
  then: the product names that [item](item)
  when: the product states what the change touches
