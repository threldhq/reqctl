acceptance_criteria:
- given: a folder of the [code base](code_base) the product cannot read
  then: the product reports the folder as a problem
  when: the product scans the [code base](code_base) for [statement citations](statement_citation)
- given: a file of the [code base](code_base) the product cannot read
  then: the product reports the file as a problem
  when: the product scans the [code base](code_base) for [statement citations](statement_citation)
- given: a file or folder of the [code base](code_base) the product cannot read
  then: the command fails rather than passes
  when: trace or another command that scans for [statement citations](statement_citation)
    is run
- given: a folder or file the scan skips by design, such as the [corpus root](corpus_root),
    a build, dist or venv folder, or a binary file
  then: the product reports no problem for it
  when: the product scans the [code base](code_base) for [statement citations](statement_citation)
