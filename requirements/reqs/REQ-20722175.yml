- given: an approved requirement that constrains another approved requirement
  then: a probe drawn from it expects the other as a neighbour
  when: probes are minted
- given: an approved requirement whose only relation targets a deprecated requirement
  then: a probe drawn from it expects no neighbour
  when: probes are minted
- given: an approved requirement that another approved requirement derives from
