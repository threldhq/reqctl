acceptance_criteria:
- given: an approved [item](item) and a still-approved [item](item) the approved [item](item)
    would supersede
  then: the product refuses and names superseded or deprecated as the revision that
    settles the pair
  when: relate is run to record the supersedes
- given: an approved [item](item) already superseding an [item](item)
  then: the product refuses and names superseded or deprecated as the revision that
    settles the pair
  when: revise is run to set the superseded [item](item) to approved
- given: a draft [item](item) superseding an approved [item](item)
  then: the product refuses and names superseded or deprecated as the revision that
    settles the pair
  when: revise is run to approve the superseding [item](item)
