acceptance_criteria:
- given: an edit changing a line that two [statement citations](statement_citation)
    cover, each naming a requirement
  then: the session is shown the text and acceptance criteria of both requirements,
    and the product does not refuse the call on that ground
  when: the [tool call](tool_call) is made
- given: an edit deleting a line a [statement citation](statement_citation) of a parameter
    covers
  then: the session is shown the parameter's text, value and unit
  when: the [tool call](tool_call) is made
- given: a write inserting a line within the lines a [statement citation](statement_citation)
    of one [entry](entry) of a [data item](data_item) covers
  then: the session is shown the [data item](data_item)'s text and that [entry](entry)
  when: the [tool call](tool_call) is made
- given: an edit changing no line a [statement citation](statement_citation) covers
  then: the session is shown no [item](item)
  when: the [tool call](tool_call) is made
- given: a shell command that writes a file holding [statement citations](statement_citation)
  then: the session is shown no [item](item) on that ground
  when: the [tool call](tool_call) is made
