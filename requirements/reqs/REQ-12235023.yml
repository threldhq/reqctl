acceptance_criteria:
- given: a line inside a [multiline comment](multiline_comment) holds what would otherwise
    read as a [statement citation](statement_citation)
  then: the product reports the line as a problem and takes no [statement citation](statement_citation)
    from it
  when: the product reads the [code base](code_base)
- given: a line holds code and then a comment holding what would otherwise read as
    a [statement citation](statement_citation)
  then: the product reports the line as a problem and takes no [statement citation](statement_citation)
    from it
  when: the product reads the [code base](code_base)
- given: a line holds white space and then one [single-line comment](single_line_comment)
    carrying a [statement citation](statement_citation)
  then: the product takes the [statement citation](statement_citation) from it
  when: the product reads the [code base](code_base)
