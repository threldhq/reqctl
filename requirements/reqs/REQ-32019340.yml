acceptance_criteria:
- given: a run that was never built
  then: the product refuses and names the build as the step to run first
  when: its judges, final judges or description are asked for
- given: a run whose judge prompts were never built
  then: the product refuses and names the judge step as the step to run first
  when: its verdicts are read
- given: a run whose verdicts were never read
  then: the product refuses and names reading the verdicts as the step to run first
  when: its description is asked for
- given: a probe folder holding no key
  then: the product refuses and names minting the probes as the step to run first
  when: the run is scored
