acceptance_criteria:
- given: a field within an [entry](entry) holds a mapping
  then: each field of the mapping stands on a separate line
  when: the corpus is exported
- given: a field of that mapping holds a mapping of its own
  then: each field of the deeper mapping stands on a separate line
  when: the corpus is exported
- given: an [entry](entry) whose fields hold no mapping
  then: the export writes the [entry](entry) on one line
  when: the corpus is exported
- given: a term recording two unclaimed phrases, each with its reason
  then: each phrase and its reason stand on a line of their own under the term
  when: the corpus is exported
