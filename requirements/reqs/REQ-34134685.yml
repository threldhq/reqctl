acceptance_criteria:
- given: a corpus holding a [data item](data_item) named value_types, and an [entry](entry)
    of a [data item](data_item) stating a list holding count as its value_type
  then: the product refuses the [data item](data_item), naming its value_type as a
    list
  when: the corpus is validated
- given: a corpus holding a [data item](data_item) named value_types, and an [entry](entry)
    of a [data item](data_item) stating a mapping as its value_type
  then: the product refuses the [data item](data_item), naming its value_type as a
    mapping
  when: the corpus is validated
- given: a corpus holding a [data item](data_item) named value_types
  then: the product refuses the [data item](data_item) and writes nothing
  when: an [entry](entry) of a [data item](data_item) stating a list as its value_type
    is written
- given: a corpus holding no [data item](data_item) named value_types, and an [entry](entry)
    of a [data item](data_item) stating a list holding count as its value_type
  then: the product refuses nothing for that value_type
  when: the corpus is validated
