acceptance_criteria:
- given: a value whose first character is hidden
  then: the product refuses the value
  when: the value is written
- given: a value whose last character is hidden
  then: the product refuses the value
  when: the value is written
- given: a value carrying a hidden character that is neither first nor last
  then: the product refuses the value
  when: the value is written
- given: a value carrying no hidden character
  then: the product writes the value
  when: the value is written
- given: a corpus holding an [item](item) whose value carries a hidden character
  then: the product refuses the corpus, naming the [item](item) and the field
  when: the corpus is validated
- given: an [item](item) whose value carries a hidden character
  then: the product refuses nothing for the hidden character
  when: reqctl revise writes the [item](item), restating that value
- given: an [item](item) whose value carries a hidden character
  then: the product refuses nothing for the hidden character
  when: reqctl refile --into writes the [item](item), that value unchanged
- given: an [item](item) whose value carries a hidden character
  then: the product refuses the value
  when: reqctl revise writes a different value carrying a hidden character into the
    same field
