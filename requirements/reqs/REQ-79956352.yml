acceptance_criteria:
- given: a value whose first character is hidden
  then: the product refuses the value
  when: the value is written
- given: a value whose last character is hidden
  then: the product refuses the value
  when: the value is written
- given: a value carrying a hidden character that is neither first nor last
  then: the product refuses the value
  when: the value is written
- given: a value carrying no hidden character
  then: the product writes the value
  when: the value is written
- given: a corpus holding an item whose value carries a hidden character
  then: the product refuses the corpus, naming the item and the field
  when: the corpus is validated
