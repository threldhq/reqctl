acceptance_criteria:
- given: a statement referencing an [entry](entry) of a [data item](data_item) that
    states a quantity and a unit
  then: the product shows the quantity and the unit beside the reference
  when: reqctl context is run for the statement, with or without --json
- given: a statement referencing the quantity field of an [entry](entry)
  then: the product shows the quantity beside the reference
  when: reqctl context is run for the statement
- given: a statement referencing an [entry](entry) the [data item](data_item) does
    not hold
  then: the product shows the reference as missing
  when: reqctl context is run for the statement
