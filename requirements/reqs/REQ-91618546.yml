acceptance_criteria:
- given: a repository whose [settings file](settings_file) sets the uncited-code mode
    to ratchet, and an [uncited-count record](uncited_count_record) stating for a
    file one fewer than its number of [uncited lines](uncited_line)
  then: the product reports the file and both numbers
  when: trace is run
- given: a repository whose [settings file](settings_file) sets the uncited-code mode
    to ratchet, and a file holding [uncited lines](uncited_line) that the [uncited-count
    record](uncited_count_record) does not state
  then: the product reports the file, its number of [uncited lines](uncited_line)
    and zero
  when: trace is run
- given: a repository whose [settings file](settings_file) sets the uncited-code mode
    to ratchet, and an [uncited-count record](uncited_count_record) stating for a
    file exactly its number of [uncited lines](uncited_line)
  then: the product reports no problem for that file
  when: trace is run
