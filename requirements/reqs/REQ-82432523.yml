acceptance_criteria:
- given: a run whose owner's words hold an idea
  then: the product makes the [best-in-class review](best_in_class_review) before
    the skill puts to the owner any [question for the owner](question_for_the_owner)
    the conversion raises
  when: the elucidate skill converts the owner's words for the first time in the run
- given: a [best-in-class review](best_in_class_review)
  then: it holds each [practice](practice) it found, naming the [leaders](leader)
    that show the [practice](practice) and the sources it rests on, each source with
    a passage quoted from it
  when: it is made
- given: a [best-in-class review](best_in_class_review)
  then: it records for each [practice](practice) its fit to the project as assessed
    against the README at the [project root](project_root), or that no README was
    found
  when: it is made
