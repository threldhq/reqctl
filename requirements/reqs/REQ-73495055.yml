acceptance_criteria:
- given: a [citation marker](citation_marker) falling within the lines of another
    [statement citation](statement_citation)
  then: the line holding the marker is in no [citation digest](citation_digest)
  when: the product takes the [citation digest](citation_digest) of the other
- given: a [citation marker](citation_marker) falling within the lines of a [statement
    citation](statement_citation) written as [exclusive](exclusive)
  then: the line holding the marker is in no [citation digest](citation_digest)
  when: the product takes the [citation digest](citation_digest) of each
- given: a line inside a [multiline comment](multiline_comment) that holds a [citation
    marker](citation_marker) and falls within the lines of a [statement citation](statement_citation)
  then: the line is in it
  when: the product takes that [citation digest](citation_digest)
