text: When the product judges which file a shell command in a [tool call](tool_call)
  would run, the product shall take as that file each file the program the command
  runs would read as a script to run, however the command hands the file to that program,
  taking each file a command earlier in the same pipeline names where that program
  reads its script from standard input, and no other word of the command.
