acceptance_criteria:
- given: uv python find 3.9
  then: the product takes no word of it as a file to run
  when: the [tool call](tool_call) is judged
- given: python script.py
  then: the product takes script.py as the file to run
  when: the [tool call](tool_call) is judged
- given: python3 < script.py, or cat script.py piped to python3
  then: the product takes script.py as the file to run
  when: the [tool call](tool_call) is judged
- given: python -m pdb script.py, python -m cProfile script.py or python -m trace
    script.py
  then: the product takes script.py as the file to run
  when: the [tool call](tool_call) is judged
- given: pytest script.py or ipython script.py
  then: the product takes script.py as the file to run
  when: the [tool call](tool_call) is judged
- given: env -S holding python3 script.py
  then: the product takes script.py as the file to run
  when: the [tool call](tool_call) is judged
- given: a shell command that runs python3 script.py inside bash -c
  then: the product takes script.py as the file to run
  when: the [tool call](tool_call) is judged
