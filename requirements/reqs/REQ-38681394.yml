acceptance_criteria:
- given: uv python find 3.9
  then: the product takes no word of it as a file to run
  when: the [tool call](tool_call) is judged
- given: python script.py
  then: the product takes script.py as the file to run
  when: the [tool call](tool_call) is judged
- given: python3 < script.py, or cat script.py piped to python3
  then: the product takes script.py as the file to run
  when: the [tool call](tool_call) is judged
- given: python -m pdb script.py, python -m cProfile script.py or python -m trace
    script.py
  then: the product takes script.py as the file to run
  when: the [tool call](tool_call) is judged
- given: pytest script.py or ipython script.py
  then: the product takes script.py as the file to run
  when: the [tool call](tool_call) is judged
- given: env -S holding python3 script.py
  then: the product takes script.py as the file to run
  when: the [tool call](tool_call) is judged
- given: a shell command that runs python3 script.py inside bash -c
  then: the product takes script.py as the file to run
  when: the [tool call](tool_call) is judged
- given: head FILE piped to python3
  then: the product takes FILE as the file to run
  when: the [tool call](tool_call) is judged
- given: uv run or uvx followed by a word that the program it launches does not read
    as a script to run
  then: the product does not take that word as a file to run
  when: the [tool call](tool_call) is judged
- given: a script runner followed by an option and that option's value, as pytest
    -k NAME
  then: the product does not take the option's value as a file to run
  when: the [tool call](tool_call) is judged
- given: cat data.csv piped to python3 run.py
  then: the product takes run.py and not data.csv
  when: the [tool call](tool_call) is judged
