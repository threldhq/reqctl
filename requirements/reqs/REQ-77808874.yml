acceptance_criteria:
- given: a requirement recording derives_from toward another requirement
  then: the product refuses, names derives_from and reqctl unrelate, and changes nothing
  when: reqctl relate names depends_on toward the same requirement
- given: a requirement recording derives_from toward another requirement
  then: the product [pins](pin) the link
  when: reqctl relate names derives_from toward the same requirement
- given: a requirement toward which another records conflicts_with, recording no link
    of its own toward it
  then: the product does not refuse on the ground that the second records a kind
  when: reqctl relate names depends_on from the first toward the second
