acceptance_criteria:
- given: a [data item](data_item) whose [entry](entry) holds a number and the unit
    days as [structured values](structured_value) and whose definition writes that
    number in figures before days, and a parameter whose value is that number of days
  then: the product accepts both
  when: the corpus is validated
- given: a [data item](data_item) whose [entry](entry) holds a number and the unit
    days as [structured values](structured_value) and whose definition writes a different
    number in figures before days, and a parameter whose value is that different number
    of days
  then: the product refuses the [data item](data_item) and names the parameter
  when: the corpus is validated
- given: a [data item](data_item) whose [entry](entry) holds a number and the unit
    days as [structured values](structured_value), and a requirement whose text writes
    that number in figures before days
  then: the product refuses the requirement and names the [structured value](structured_value)
    as the one to reference
  when: the corpus is validated
- given: a [data item](data_item) whose [entry](entry) holds a number and the unit
    hours as [structured values](structured_value) and whose definition writes that
    number in figures before days, and a parameter whose value is that number of days
  then: the product refuses the [data item](data_item) and names the parameter
  when: the corpus is validated
- given: two [data items](data_item) whose [entries](entry) each hold the same number
    and the unit days as [structured values](structured_value) and whose definitions
    each write that number in figures before days
  then: the product accepts both [data items](data_item)
  when: the corpus is validated
