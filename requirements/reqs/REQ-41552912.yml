text: Where a [statement citation](statement_citation) is written in a Python or a
  YAML file, if it covers a line at a [nest level](nest_level) shallower than the
  first line it covers, or covers a line opening a nest without covering every line
  that nest holds, then the product shall refuse the [statement citation](statement_citation).
