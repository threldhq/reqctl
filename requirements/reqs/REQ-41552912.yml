acceptance_criteria:
- given: a [statement citation](statement_citation) in a Python file covering a line
    at a [nest level](nest_level) shallower than the first line it covers
  then: the product refuses the [statement citation](statement_citation)
  when: the product reads the [statement citation](statement_citation)
- given: a [statement citation](statement_citation) in a YAML file covering a line
    that opens a nest and not every line that nest holds
  then: the product refuses the [statement citation](statement_citation)
  when: the product reads the [statement citation](statement_citation)
- given: a [statement citation](statement_citation) in a JavaScript file covering
    a line that opens a block and not every line the block holds
  then: the product does not refuse it on that ground
  when: the product reads the [statement citation](statement_citation)
