acceptance_criteria:
- given: a data item is given a name and no entry
  then: reqctl refuses the item, naming --entry, and writes no file
  when: reqctl new runs
- given: a parameter is given a name, a text and a value, and no value type
  then: reqctl refuses the item, naming --value-type
  when: reqctl new runs
- given: a requirement is given a text and no verification
  then: reqctl mints the requirement
  when: reqctl new runs
