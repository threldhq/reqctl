acceptance_criteria:
- given: a reference naming no [item](item) the corpus holds
  then: the product shows the reference as written
  when: the statement is exported
- given: a reference naming an [item](item) that carries no [entries](entry)
  then: the product shows the reference as written
  when: the statement is exported
- given: a reference selecting the default of an [item](item) that names no default
  then: the product shows the reference as written
  when: the statement is exported
- given: a reference naming an [entry](entry) the [item](item) does not hold
  then: the product shows the reference as written
  when: the statement is exported
- given: a reference naming a field the named [entry](entry) does not hold
  then: the product shows the reference as written
  when: the statement is exported
