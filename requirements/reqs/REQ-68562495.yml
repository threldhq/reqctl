acceptance_criteria:
- given: a citation naming no item the corpus holds
  then: the product shows the citation as written
  when: the statement is exported
- given: a citation naming an item that carries no entries
  then: the product shows the citation as written
  when: the statement is exported
- given: a citation selecting the default of an item that names no default
  then: the product shows the citation as written
  when: the statement is exported
- given: a citation naming an entry the item does not hold
  then: the product shows the citation as written
  when: the statement is exported
- given: a citation naming a field the named entry does not hold
  then: the product shows the citation as written
  when: the statement is exported
