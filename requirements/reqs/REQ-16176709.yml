acceptance_criteria:
- given: a check refused over a source whose page does not hold the passage quoted
    from it
  then: the prompt names the source's web address, the passage and the fault, and
    states that no library or example may name the source
  when: the check is made again for the same code
- given: two libraries quoting different passages from one source over which the check
    is refused
  then: the prompt names both passages
  when: the check is made again for the same code
- given: a check refused over one source, then made again for the same code and refused
    over another
  then: the prompt names both sources
  when: the check is made again
