acceptance_criteria:
- given: a repository whose remote named origin names no default branch, holding a
    [settings file](settings_file)
  then: the product refuses the run, naming git remote set-head origin --auto and
    git fetch origin
  when: a run is built there
- given: a repository whose remote named origin names a default branch that names
    no commit here
  then: trace fails rather than passes
  when: trace is run
- given: a repository whose default branch's [settings file](settings_file) states
    changed_lines for the uncited-code mode, and whose remote named origin names no
    default branch
  then: trace fails rather than passes without checking uncited code
  when: trace is run with a base branch
