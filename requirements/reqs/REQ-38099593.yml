acceptance_criteria:
- given: an edit, multi-edit or write that adds, removes or changes a comment carrying
    a [statement citation](statement_citation), including by deleting cited code together
    with its [citation](statement_citation)
  then: the product refuses it and names reqctl tag, repin and untag as the route
  when: the [tool call](tool_call) is made
- given: a shell command that names the text opening a [statement citation](statement_citation)
    other than to read it, however that text is quoted, split or continued across
    lines
  then: the product refuses it
  when: the [tool call](tool_call) is made
- given: an edit that carries every comment carrying a [statement citation](statement_citation)
    through unchanged
  then: the product does not refuse it on that ground
  when: the [tool call](tool_call) is made
- given: a shell command on one line that searches for [statement citations](statement_citation),
    with its pattern in single quotes and its output piped only to commands that read
  then: the product does not refuse it
  when: the [tool call](tool_call) is made
- given: reqctl citing, re-pinning or removing a [statement citation](statement_citation)
  then: the product does not refuse it
  when: the [tool call](tool_call) running reqctl is made
- given: a shell command whose only naming of the text opening a [statement citation](statement_citation)
    is in literal text, written inline or in a heredoc, that it passes as a commit
    message or as the title, body or comment of a pull request, an issue or a review
  then: the product does not refuse it on that ground
  when: the [tool call](tool_call) is made
- given: such text holding a command substitution or a process substitution
  then: the product judges the substitution as it judges any other part of the command
  when: the [tool call](tool_call) is made
