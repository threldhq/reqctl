acceptance_criteria:
- given: a [reading agent](reading_agent) whose verdict for an [item](item) is cannot
    tell
  then: one [searching reader](searching_reader) is spawned for the [item](item)
  when: the pass reaches the verdict
- given: a [reading agent](reading_agent) whose return states none of the three verdicts
  then: one [searching reader](searching_reader) is spawned for the [item](item)
  when: the pass reaches the [item](item)
- given: a [reading agent](reading_agent) whose verdict for an [item](item) is satisfied
    or not satisfied
  then: no [searching reader](searching_reader) is spawned for the [item](item)
  when: the pass reaches the verdict
