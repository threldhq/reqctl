acceptance_criteria:
- given: a .py file defining a function named f
  then: the product cites the lines f spans
  when: reqctl tag is given f in place of lines
- given: a .py file whose class C defines a method m
  then: the product cites the lines m spans
  when: reqctl tag is given C.m in place of lines
- given: a .py file whose class Outer holds a class Inner defining a method m
  then: the product cites the lines m spans
  when: reqctl tag is given Outer.Inner.m
- given: a .py file whose function f carries a decorator
  then: the cited lines open at the decorator
  when: reqctl tag is given f
- given: a command giving both a name and lines for one [statement citation](statement_citation)
  then: the product refuses and writes nothing
  when: reqctl tag is run
