acceptance_criteria:
- given: a deprecated [data item](data_item) referencing an [entry](entry) of another
    [data item](data_item), the [entry](entry) since revised
  then: the product reports nothing for the reference
  when: the corpus is validated
- given: a superseded requirement whose link toward an approved requirement [awaits
    assessment](awaiting_assessment)
  then: the product accepts the superseded requirement
  when: the corpus is validated
- given: a deprecated [item](item) whose link toward a term [awaits assessment](awaiting_assessment)
  then: the product shows the link without marking it suspect
  when: reqctl context names the [item](item) or the term
- given: an approved [item](item) whose reference toward a deprecated parameter [awaits
    assessment](awaiting_assessment)
  then: the product reports the reference
  when: the corpus is validated
- given: a deprecated [item](item) holding a [pin](pin) naming an address the [item](item)
    neither links nor references
  then: the product reports the [pin](pin)
  when: the corpus is validated
- given: a deprecated [item](item) depending on an [item](item) that cannot be read
  then: the product names the dependency
  when: the corpus is validated
- given: a draft requirement whose reference toward a parameter [awaits assessment](awaiting_assessment)
  then: the product reports the reference
  when: the corpus is validated
