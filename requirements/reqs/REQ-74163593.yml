acceptance_criteria:
- given: a [data item](data_item) named value_types listing for duration the unit
    d with the spelling days, and a deprecated requirement whose criterion writes
    a number in figures before days
  then: the product accepts the requirement
  when: the corpus is validated
- given: a [data item](data_item) named value_types listing for duration the unit
    d with the spelling days, and a superseded guard whose statement writes a number
    in words before days
  then: the product accepts the guard
  when: the corpus is validated
- given: a deprecated [item](item) and an approved [item](item) each stating the same
    quantity in the same unit
  then: the product accepts both [items](item)
  when: the corpus is validated
- given: a [data item](data_item) named value_types listing for duration the unit
    d with the spelling days, and a draft requirement whose criterion writes a number
    in figures before days
  then: the product refuses the requirement, naming the quantity
  when: the corpus is validated
