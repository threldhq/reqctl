text: If the payload the [portal](portal) sends is not a mapping holding a non-empty
  list of steps, each a mapping whose arguments, if given, are a list of text and
  whose options, if given, map each name to nothing, to text or to a non-empty list
  of text, then the product shall refuse the payload.
