acceptance_criteria:
- given: a payload that is empty or is not JSON
  then: the product refuses it, stating which, and opens no pull request
  when: the payload is applied
- given: a payload that is not a mapping, or whose steps are missing, not a list or
    empty
  then: the product refuses it
  when: the payload is applied
- given: a step that is not a mapping, whose arguments are not a list of text, or
    whose options are not a mapping
  then: the product refuses it, naming what is wrong
  when: the payload is applied
- given: an option whose value is neither absent, text nor a non-empty list of text
  then: the product refuses it, naming the option
  when: the payload is applied
