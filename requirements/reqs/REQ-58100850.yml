acceptance_criteria:
- given: a corpus holding a [data item](data_item) named value_types, and an [entry](entry)
    stating the value type count and the quantity twenty whose at_most names an [entry](entry)
    of the same [data item](data_item) stating the value type count and the quantity
    forty-five
  then: the product accepts the [data item](data_item)
  when: the [data item](data_item) is written
- given: a corpus holding a [data item](data_item) named value_types, and an [entry](entry)
    stating the quantity fifty whose at_most names an [entry](entry) stating the quantity
    forty-five in the same unit
  then: the product refuses the [data item](data_item), naming both [entries](entry)
    and their quantities
  when: the [data item](data_item) is written
- given: a corpus holding a [data item](data_item) named value_types, and an [entry](entry)
    whose at_least names an [entry](entry) stating a greater quantity in the same
    unit
  then: the product refuses the [data item](data_item), naming both [entries](entry)
  when: the [data item](data_item) is written
- given: a corpus holding no [data item](data_item) named value_types, and an [entry](entry)
    whose quantity exceeds that of the [entry](entry) its at_most names
  then: the product accepts the [data item](data_item)
  when: the corpus is validated
