acceptance_criteria:
- given: a Python file holding an import spread over three lines
  then: no line of the import is taken as code
  when: the product checks the file for uncited code
- given: a JavaScript file holding an import statement
  then: no line of the import is taken as code
  when: the product checks the file for uncited code
- given: a file holding a blank line, a line holding only a comment, and the lines
    of a [multiline comment](multiline_comment) from its opening to its closing delimiter
  then: none of those lines is taken as code
  when: the product checks the file for uncited code
- given: a line holding a statement followed by a comment
  then: the line is taken as code
  when: the product checks the file for uncited code
- given: a JSON file
  then: each line holding a key or a value is taken as code
  when: the product checks the file for uncited code
- given: a file holding a constant assignment
  then: the line of the assignment is taken as code
  when: the product checks the file for uncited code
