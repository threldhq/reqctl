acceptance_criteria:
- given: a batch of three steps whose second step reqctl refuses
  then: the third step does not run, no pull request opens, nothing the first step
    wrote reaches the repository, and the product states the second step's command
    with reqctl's reason
  when: the batch is applied
- given: a step naming an option of the right shape that reqctl does not define
  then: reqctl refuses the step and the product abandons the batch there
  when: the batch is applied
- given: a step whose reqctl run prints nothing, or prints other than JSON
  then: the product abandons the batch at that step
  when: the batch is applied
