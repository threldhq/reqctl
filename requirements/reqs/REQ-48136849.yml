acceptance_criteria:
- given: a repository stating a schema named for an [item](item) the corpus does not
    hold
  then: the product refuses and names the schema and the [item](item) it found none
    of
  when: the corpus is validated
- given: a repository stating a schema named for an [item](item) the corpus holds
  then: the product accepts it
  when: the corpus is validated
- given: a repository stating only the [kind schemas](kind_schema)
  then: the product accepts it, a [kind schema](kind_schema) naming no [item](item)
  when: the corpus is validated
