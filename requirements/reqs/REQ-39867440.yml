acceptance_criteria:
- given: a [data item](data_item) named value_types listing for duration a unit stating
    no factor, no least and no most
  then: the product refuses value_types and names the unit
  when: the corpus is validated
- given: a [data item](data_item) named value_types listing for duration a unit stating
    a least and no most
  then: the product refuses value_types and names the unit
  when: the corpus is validated
- given: a [data item](data_item) named value_types listing for duration a unit stating
    a least and a most
  then: the product accepts the unit
  when: the corpus is validated
- given: a [data item](data_item) named value_types listing for duration a unit stating
    a factor beside a least and a most
  then: the product refuses value_types and names the unit
  when: the corpus is validated
