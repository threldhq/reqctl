acceptance_criteria:
- given: reqctl --json context naming an item the corpus does not hold
  then: 'standard error holds the one line reqctl: followed by the message, and reqctl
    ends with a non-zero exit status'
  when: the standard output is closed before the fault is written
- given: a command run with --json that cannot put back a file the command wrote,
    with the standard output closed
  then: standard error names the file not put back
  when: the command ends
- given: a fault stated as JSON on an open standard output
  then: the fault appears on standard output alone
  when: the command ends
