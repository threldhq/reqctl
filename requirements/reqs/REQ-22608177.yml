acceptance_criteria:
- given: a .js file with a [statement citation](statement_citation) over a line calling
    a function declared at its top level
  then: the product reports the [citation](statement_citation) as a problem
  when: the body of that function changes and trace is run
- given: an .html file with a [statement citation](statement_citation) in one classic
    script element over a line calling a function declared at the top level of another
    classic script element of the same file
  then: the product reports the [citation](statement_citation) as a problem
  when: the body of that function changes and trace is run
- given: a JavaScript [statement citation](statement_citation) over a line calling
    a top-level function that calls a second top-level function
  then: the product reports the [citation](statement_citation) as a problem
  when: the body of the second function changes and trace is run
- given: a JavaScript [statement citation](statement_citation) over a line reading
    a top-level const binding
  then: the product reports the [citation](statement_citation) as a problem
  when: the value the binding is given changes and trace is run
- given: a .js file with a [statement citation](statement_citation) over a line calling
    a function declared only in another .js file
  then: the product reports no problem for the [citation](statement_citation)
  when: that function changes and trace is run
