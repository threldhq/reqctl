acceptance_criteria:
- given: a [gate results file](gate_results_file) that does not read as JSON
  then: the product refuses and names running the gates again or deleting the file
  when: the [evidence block](evidence_block) is asked for
- given: a [gate results file](gate_results_file) whose step states an outcome that
    is none of the three
  then: the product refuses
  when: the [evidence block](evidence_block) is asked for
- given: a [gate results file](gate_results_file) stating a commit and no list of
    steps
  then: the product refuses
  when: the [evidence block](evidence_block) is asked for
- given: a folder at the place of the [gate results file](gate_results_file)
  then: the product states the fault and prints no [evidence block](evidence_block)
  when: the [evidence block](evidence_block) is asked for
