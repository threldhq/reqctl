acceptance_criteria:
- given: a [tool call](tool_call) running rm with -r, -R, --recursive or a flag cluster
    holding r on the [project root](project_root) or a parent of it, named absolutely
    or relatively
  then: the product refuses it and names the target
  when: the [tool call](tool_call) is made
- given: a [tool call](tool_call) running a recursive rm on ., .., ~, / or *
  then: the product refuses it
  when: the [tool call](tool_call) is made
- given: a [tool call](tool_call) running a recursive rm on a target that begins with
    a variable or a command substitution
  then: the product refuses it
  when: the [tool call](tool_call) is made
- given: a [tool call](tool_call) running a recursive rm on a folder beside or outside
    the [project root](project_root), or on a glob inside such a folder
  then: the product does not refuse it
  when: the [tool call](tool_call) is made
