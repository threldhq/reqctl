acceptance_criteria:
- given: a draft statement carrying a word an approved term defines, unlinked
  then: the fault validate states for an unlinked term is reported
  when: the statement is linted
- given: a draft statement carrying two shalls
  then: the fault validate states for more than one shall is reported
  when: the statement is linted
- given: any draft statement
  then: the corpus is unchanged
  when: the statement is linted
- given: a draft term claiming a word another term claims
  then: the product reports the fault, naming both terms
  when: the term is linted
- given: a corpus already holding a fault, and a draft statement that adds none
  then: the product reports no fault
  when: the statement is linted
- given: a check validate runs that fails unexpectedly
  then: the product reports the failure as a corpus problem naming the check
  when: a draft statement is linted
- given: a draft statement linking an approved term
  then: the product reports nothing for the link, which [awaits assessment](awaiting_assessment)
  when: the statement is linted
