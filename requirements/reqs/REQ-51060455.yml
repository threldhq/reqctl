acceptance_criteria:
- given: a [tool call](tool_call) the product does not refuse
  then: it exits zero and states no decision
  when: the hook exits
- given: a fault inside the hook while it judges a [tool call](tool_call), with standard
    output writable
  then: it exits zero with the whole of its deny decision on standard output
  when: the hook exits
- given: the hook's source
  then: every exit it holds is a zero exit except the one a failed write of a deny
    decision reaches, and it raises no exit of its own
  when: it is read
