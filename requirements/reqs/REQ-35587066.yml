acceptance_criteria:
- given: a Markdown file whose [front matter](front_matter) holds a YAML comment carrying
    a [citation marker](citation_marker)
  then: the product reads the comment as a [statement citation](statement_citation)
    of the [item](item) it names
  when: trace is run
- given: a Markdown file whose [front matter](front_matter) holds a YAML comment carrying
    no [citation marker](citation_marker)
  then: the product reads no [statement citation](statement_citation) from it
  when: trace is run
