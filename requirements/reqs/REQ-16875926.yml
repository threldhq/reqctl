acceptance_criteria:
- given: a source whose server answers 503
  then: the product refuses the review, names the source, and names its failure as
    transient
  when: the review is checked
- given: a source whose fetch takes more than ${review_fetch_seconds} seconds
  then: the product refuses the review, names the source, and names its failure as
    transient
  when: the review is checked
- given: a source whose server answers 404
  then: the product refuses the review and names the source without naming its failure
    as transient
  when: the review is checked
