acceptance_criteria:
- given: a term recording an unclaimed phrase that holds neither its word nor any
    of its aliases
  then: the product refuses the term and names the phrase
  when: the corpus is validated
- given: a term recording an unclaimed phrase that holds one of its aliases in capitals
  then: the product refuses nothing on that ground
  when: the corpus is validated
- given: a term recording an unclaimed phrase that holds its word only inside a longer
    word
  then: the product refuses the term and names the phrase
  when: the corpus is validated
