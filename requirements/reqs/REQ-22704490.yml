text: If a [tool call](tool_call) names the path of a corpus [item](item)'s file,
  a folder of corpus [items](item), the baseline or the [corpus root](corpus_root),
  then the product shall refuse the [tool call](tool_call), however the path is spelled,
  unless each command or tool in the call that names the path is reqctl or one the
  product can tell only reads.
