acceptance_criteria:
- given: a statement carrying an [EARS fault](ears_fault)
  then: the product refuses nothing for the fault
  when: reqctl revise would write a changed text failing in the same ways, wherever
    in the text the change falls
- given: a statement whose text fails in one way
  then: the product refuses the command and writes nothing
  when: reqctl revise would write a text that fails in a way the statement's text
    did not
