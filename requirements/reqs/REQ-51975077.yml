acceptance_criteria:
- given: a review refused only because every attempt at the source of one [practice](practice)
    ended in a [transient failure](transient_failure), and the owner answers the question
    by declining
  then: the product fetches none of the sources of that [practice](practice) and passes
    the review
  when: the review is checked again
- given: the owner answers the question by declining
  then: the product states which [practices](practice) it removed
  when: the product removes the [practices](practice)
- given: a [practice](practice) the product removed from the review on the owner's
    answer
  then: the run's declined list states the [practice](practice)
  when: the run's pull request description is rendered
- given: a review that passes after the product removed a [practice](practice)
  then: neither holds the removed [practice](practice)
  when: the check prints the review's summary and table
- given: a review that passed, whose table the owner answers by declining a [practice](practice)
  then: the product removes nothing from the review
  when: the owner answers
