acceptance_criteria:
- given: a run holding a proposal whose verdict names a covering obligation
  then: the description states the obligation under that proposal with the verdict
    and the reason the verdict gives
  when: the description is rendered
- given: a run holding a declined line
  then: the description states the line and the reason it was declined
  when: the description is rendered
- given: a run holding a proposal traced to a passage of the owner's words
  then: the description quotes the passage under that proposal
  when: the description is rendered
