acceptance_criteria:
- given: an approved statement leaning on a draft statement
  then: the product reports the approved statement and names the status of the statement
    leaned on
  when: the corpus is validated
- given: an approved statement leaning on a deprecated or a superseded statement
  then: the product reports the approved statement and names the status of the statement
    leaned on
  when: the corpus is validated
- given: an approved statement superseding a deprecated statement
  then: the product accepts the statement
  when: the corpus is validated
