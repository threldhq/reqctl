acceptance_criteria:
- given: the first line a [statement citation](statement_citation) is asked to cover
    lies inside a [multiline comment](multiline_comment) that opens on an earlier
    line
  then: the product refuses and writes no [statement citation](statement_citation)
  when: the product is asked to write the [statement citation](statement_citation)
- given: the last line a pair of comments is asked to cover lies inside a [multiline
    comment](multiline_comment) that closes on a later line
  then: the product refuses and writes no [statement citation](statement_citation)
  when: the product is asked to write the [statement citation](statement_citation)
    they carry
- given: a [multiline comment](multiline_comment) lies wholly within lines that also
    hold a [code statement](code_statement)
  then: the product writes the [statement citation](statement_citation)
  when: the product is asked to write a [statement citation](statement_citation) over
    those lines
