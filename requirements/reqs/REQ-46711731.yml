acceptance_criteria:
- given: a review refused only over sources whose servers answered 503 to every attempt
  then: the product raises one [question for the owner](question_for_the_owner) naming
    each source as having failed every attempt and offering checking the same review
    again, declining every [practice](practice) that names one of those sources, or
    making the review again
  when: the review is checked
- given: the question raised over a review refused only over [transient failures](transient_failure)
  then: the product checks the same review again, and raises the question again if
    every fault is again a [transient failure](transient_failure)
  when: the owner answers by checking the same review again
- given: the question raised over a review refused only over [transient failures](transient_failure)
  then: the product removes every [practice](practice) naming one of the sources and
    checks the same review again
  when: the owner answers by declining
- given: two [practices](practice) naming one source whose server answered 503 to
    every attempt
  then: the product removes both [practices](practice) from the review
  when: the owner answers the question by declining
- given: the question raised over a review refused only over [transient failures](transient_failure)
  then: the product makes the review again
  when: the owner answers by making the review again
- given: a review refused over a source whose server answered 503 to every attempt
    and another whose page does not hold its passage
  then: the product names making the review again as the way to clear the refusal
  when: the review is checked
- given: a review refused over a source whose server answered 503 to every attempt
    and a [practice](practice) that names no source
  then: the product names making the review again as the way to clear the refusal
  when: the review is checked
