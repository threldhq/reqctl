acceptance_criteria:
- given: each skill of the plugin that writes [statement citations](statement_citation),
    as shipped
  then: they direct the [statement citation](statement_citation) to cover the code
    that decides a clause or acceptance criterion of the item it names, or the code
    stating the value of the parameter, data item or entry it names
  when: its steps for citing code are read
- given: a helper that the code deciding a clause calls
  then: the [statement citation](statement_citation) does not cover the helper
  when: a skill of the plugin cites the item
- given: code incidental to every clause and acceptance criterion of an item
  then: the [statement citation](statement_citation) does not cover that code
  when: a skill of the plugin cites the item
- given: a data item whose entries one part of the code states and another part reads
  then: the [statement citation](statement_citation) covers the code stating the entries
    and not the code reading them
  when: a skill of the plugin cites the data item
