acceptance_criteria:
- given: an implement run about to write a new unit of code
  then: it reads the code of products solving the same kind of problem before writing
    any
  when: the session begins the work
- given: an implement run that extends code already citing the requirement
  then: no research is required of it
  when: the run proceeds
- given: an implement run that researched and wrote code
  then: its body names the sources the session read and the example it chose, or states
    that none could be read
  when: the pull request carrying the code is prepared
