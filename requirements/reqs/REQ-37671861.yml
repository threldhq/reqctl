acceptance_criteria:
- given: a [statement citation](statement_citation) naming a stamp that the approved
    requirement it names no longer carries
  then: the product reports the citation as behind the corpus and reports no problem
    for it
  when: trace is given a base branch from which the change touches a file under the
    [corpus root](corpus_root) in more than its [citation list](citation_list)
- given: a [statement citation](statement_citation) naming a stamp that the approved
    requirement it names no longer carries
  then: the product reports the citation as a problem
  when: trace is given a base branch from which the change touches no file under the
    [corpus root](corpus_root)
- given: a [statement citation](statement_citation) naming a stamp that the approved
    requirement it names no longer carries
  then: the product reports the citation as a problem
  when: trace is given no base branch
- given: a pull request that touches no file under the [corpus root](corpus_root)
    and carries a [statement citation](statement_citation) naming a stamp that the
    approved requirement it names no longer carries
  then: the product refuses the pull request
  when: the ${corpus_gates.traceability} gate runs trace against the pull request's
    base branch
- given: a [statement citation](statement_citation) naming a stamp that the approved
    requirement it names no longer carries
  then: the product reports the citation as a problem
  when: trace is given a base branch from which the change touches files under the
    [corpus root](corpus_root) only in their [citation lists](citation_list)
