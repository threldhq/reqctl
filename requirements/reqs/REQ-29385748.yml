text: If git status reports that a tracked file differs, in the index or in the working
  tree, from the commit HEAD names when the product is asked for the [evidence block](evidence_block)
  of a branch, then the product shall state in the [evidence block](evidence_block)
  that tracked files have uncommitted changes.
