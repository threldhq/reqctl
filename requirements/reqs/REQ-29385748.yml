acceptance_criteria:
- given: a working tree and an index whose tracked files match the commit HEAD names
  then: the [evidence block](evidence_block) states nothing about uncommitted changes
  when: the [evidence block](evidence_block) is asked for
- given: an untracked file and no change to a tracked file
  then: the [evidence block](evidence_block) states nothing about uncommitted changes
  when: the [evidence block](evidence_block) is asked for
- given: a new file added to the index and not committed
  then: the [evidence block](evidence_block) states that tracked files have uncommitted
    changes
  when: the [evidence block](evidence_block) is asked for
- given: two tracked files changed in the working tree
  then: the [evidence block](evidence_block) states once that tracked files have uncommitted
    changes and names neither file
  when: the [evidence block](evidence_block) is asked for
