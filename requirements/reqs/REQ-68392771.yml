acceptance_criteria:
- given: a [tool call](tool_call) whose command field holds more than ${guard_input_limit}
    characters
  then: the product refuses it, naming the field and its length
  when: the [tool call](tool_call) is made
- given: a connector call whose path field holds more than ${guard_input_limit} characters
  then: the product refuses it
  when: the [tool call](tool_call) is made
- given: an edit whose new text holds more than ${guard_input_limit} characters and
    whose path is short
  then: the product does not refuse it on that ground
  when: the [tool call](tool_call) is made
