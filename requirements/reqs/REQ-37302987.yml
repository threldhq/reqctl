status: approved
text: If a value written as a parameter's value, or to a field of an [entry](entry)
  that the governing schema does not mark as verbatim, holds between two digits a
  character that Unicode classes as a space separator or whose Unicode name holds
  COMMA, SEPARATOR, APOSTROPHE or QUOTATION, other than the comma and space separating
  two members of a bracketed set, then the product shall refuse the value.
