acceptance_criteria:
- given: a field the governing schema does not mark x-verbatim
  then: the product refuses the value
  when: a number grouped by a space or a comma is written to it
- given: a parameter
  then: the product does not refuse it on that ground
  when: its value is stated as a bracketed set whose members are separated by a comma
    and a space
