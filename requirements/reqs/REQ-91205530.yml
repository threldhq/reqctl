acceptance_criteria:
- given: the [kind schema](kind_schema) gains a field for a kind of [item](item)
  then: reqctl accepts the flag, with no edit to reqctl's parser
  when: reqctl revise runs with that field's flag on an [item](item) of that kind
- given: the [kind schema](kind_schema) lets an [item](item) leave a field out
  then: it takes a flag that clears the field
  when: reqctl revise runs on an [item](item) of that kind
- given: the [kind schema](kind_schema) marks a field as the address the corpus reaches
    an [item](item) by
  then: reqctl refuses the flag and names reqctl rename
  when: reqctl revise runs with that field's flag
