text: If a parameter, or an [entry](entry) of a [data item](data_item) that states
  a value type where the corpus holds a [data item](data_item) named value_types,
  states a unit where its value type carries no unit, or states no unit where its
  value type requires one, then the product shall refuse the [item](item).
