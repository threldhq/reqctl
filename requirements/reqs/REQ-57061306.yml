acceptance_criteria:
- given: a parameter whose value type is count, ratio, boolean or text
  then: the product refuses and states that a unit does not apply to that value type
  when: a unit is stated
- given: a parameter whose value type is duration, size, percentage or currency
  then: the product refuses and states that the value type carries a unit
  when: the parameter states no unit
- given: a corpus holding a [data item](data_item) named value_types, and an [entry](entry)
    of a [data item](data_item) stating the value type count
  then: the product refuses the [data item](data_item) and states that a unit does
    not apply to count
  when: the [entry](entry) states a unit
- given: a corpus holding a [data item](data_item) named value_types, and an [entry](entry)
    of a [data item](data_item) stating the value type duration
  then: the product refuses the [data item](data_item) and states that duration carries
    a unit
  when: the [entry](entry) states no unit
- given: a corpus holding no [data item](data_item) named value_types, and an [entry](entry)
    of a [data item](data_item) stating the value type count and a unit
  then: the product accepts the [entry](entry)
  when: the corpus is validated
