acceptance_criteria:
- given: an .html file whose script element has type application/json
  then: the product refuses, states that the element's content cannot carry a comment,
    and writes nothing
  when: reqctl tag cites lines so that a citation comment would fall inside that element
- given: an .html file whose script element has type importmap
  then: the product refuses and writes nothing
  when: reqctl tag cites lines so that a citation comment would fall inside that element
- given: an .html file whose script element has type text/template
  then: the product refuses and writes nothing
  when: reqctl tag cites lines so that a citation comment would fall inside that element
