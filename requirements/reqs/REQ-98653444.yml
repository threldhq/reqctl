acceptance_criteria:
- given: a requirement or a guard carrying a criterion whose given begins with the
    word given
  then: the product refuses the [item](item), naming the criterion and the part
  when: the [item](item) is [minted](mint) or revised to carry the criterion
- given: a corpus holding a requirement whose criterion has a when beginning with
    the word when
  then: the product refuses the corpus, naming the requirement and the part
  when: the corpus is validated
- given: a criterion whose then begins with Then
  then: the product refuses the requirement
  when: a requirement carrying the criterion is [minted](mint)
- given: a criterion whose when begins with whenever
  then: the product accepts the requirement
  when: a requirement carrying the criterion is [minted](mint)
