acceptance_criteria:
- given: a change touching no [statement citation](statement_citation) that names
    a [stamp](stamp) its requirement no longer carries, while another file holds one
  then: the product reports that [statement citation](statement_citation) as behind
    the corpus and reports no problem for it
  when: trace is given the change's base branch
- given: a pull request touching no file under the [corpus root](corpus_root) whose
    base branch carries a [statement citation](statement_citation) naming a [stamp](stamp)
    its requirement no longer carries, which the pull request leaves untouched
  then: the product does not refuse the pull request on that ground
  when: the ${corpus_gates.traceability} gate runs trace against the pull request's
    base branch
