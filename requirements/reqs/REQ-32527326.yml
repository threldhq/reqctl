acceptance_criteria:
- given: a corpus holding a [data item](data_item) named value_types, a parameter
    holding one value, a [data item](data_item) the corpus holds, and a key the [data
    item](data_item) does not hold
  then: the [data item](data_item) holds an [entry](entry) under the key stating the
    parameter's value as its quantity, the parameter's value type and unit, and the
    parameter's text as its definition
  when: reqctl refile files the parameter into the [data item](data_item) under the
    key
- given: a corpus holding a [data item](data_item) named value_types, a parameter
    holding one value, a [data item](data_item) the corpus holds, and a key the [data
    item](data_item) does not hold
  then: every reference to the parameter references the [entry](entry) instead, and
    renders as it did
  when: reqctl refile files the parameter into the [data item](data_item) under the
    key
- given: a corpus holding a [data item](data_item) named value_types, a parameter
    holding one value, a [data item](data_item) the corpus holds, and a key the [data
    item](data_item) does not hold
  then: the parameter is deprecated
  when: reqctl refile files the parameter into the [data item](data_item) under the
    key
- given: a corpus holding a [data item](data_item) named value_types, and a parameter
    holding more than one value
  then: the product refuses, naming the values, and writes nothing
  when: reqctl refile is asked to file the parameter into a [data item](data_item)
- given: a corpus holding a [data item](data_item) named value_types, and a [data
    item](data_item) already holding the key given
  then: the product refuses, naming the key, and writes nothing
  when: reqctl refile is asked to file a parameter under that key
