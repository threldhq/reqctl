acceptance_criteria:
- given: an example under a licence whose SPDX identifier is one of the ${copyable_licences}
    and is compatible with the receiving repository's licence
  then: the session copies it and meets the licence's conditions in the third-party
    notices file
  when: the session would copy its code
- given: an example in a repository that states no licence, or whose licence resolves
    to no SPDX identifier
  then: the session copies none of it and writes its own code from the idea
  when: the session would copy its code
- given: an example under a copyleft licence, weak copyleft included
  then: the session copies none of it and writes its own code from the idea
  when: the session would copy its code
- given: an example under one of the ${copyable_licences} whose compatibility with
    the receiving repository's licence the session cannot tell
  then: the session copies none of it and writes its own code from the idea
  when: the session would copy its code
- given: a receiving repository whose licence resolves to no SPDX identifier
  then: the session copies none of it and writes its own code from the idea
  when: the session would copy an example's code
