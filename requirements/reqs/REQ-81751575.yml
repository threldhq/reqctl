acceptance_criteria:
- given: a source whose page as served holds words only in its title element, its
    script elements and its meta description, and not the passage a [practice](practice)
    quotes from it
  then: the product refuses the review, names the source as serving no readable text
    without running scripts and names citing another page as the way to clear it,
    and does not name the source as not holding the passage
  when: the review is checked
- given: a source whose [page text](page_text) holds a word outside its title elements
    and does not hold the passage a [practice](practice) quotes from it
  then: the product refuses the review and names the source as not holding the passage
  when: the review is checked
