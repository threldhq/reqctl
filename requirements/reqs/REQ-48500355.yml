acceptance_criteria:
- given: a field the governing schema states records a value observed outside the
    corpus, holding a quantity another item states
  then: the product accepts both items
  when: the corpus is validated
- given: a field the governing schema states records a value observed outside the
    corpus, holding the word of an approved term outside a link
  then: the product accepts the field
  when: the corpus is validated
- given: a field the governing schema does not state records a value observed outside
    the corpus, holding a quantity another item states
  then: the product refuses the item
  when: the corpus is validated
