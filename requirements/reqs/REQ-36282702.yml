acceptance_criteria:
- given: a tracked file holding uncommitted changes
  then: the product refuses it and lists the changes
  when: a [tool call](tool_call) runs git checkout or git restore naming it, git checkout
    ., git checkout -f, git switch -f, git switch --discard-changes or git reset --hard
- given: an untracked file
  then: the product refuses it and lists the file
  when: a [tool call](tool_call) runs a forced git clean that would delete it
- given: an ignored file
  then: the product refuses it
  when: a [tool call](tool_call) runs a forced git clean with -x or -X
- given: a working tree holding nothing the command would discard
  then: the product does not refuse it on that ground
  when: a [tool call](tool_call) runs git checkout, switch, reset, clean or restore
- given: uncommitted changes
  then: the product does not refuse it
  when: a [tool call](tool_call) runs git reset --soft, git restore --staged, git
    clean -n or a git checkout that only switches branch
- given: a repository the product cannot read
  then: the product refuses it
  when: a [tool call](tool_call) runs git checkout, switch, reset, clean or restore
