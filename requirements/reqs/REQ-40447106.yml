text: Where a repository's [settings file](settings_file) states a value for one of
  the product's own parameters, or for a field of an [entry](entry) of one of its
  own [data items](data_item), and the reqctl command or the elucidate skill uses
  the value that parameter or field holds, the product shall use the stated value
  in that repository in place of the value the product ships.
