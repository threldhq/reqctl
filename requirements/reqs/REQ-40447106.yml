acceptance_criteria:
- given: a repository whose [settings file](settings_file) states 10485760 for the
    quantity of the page_bytes [entry](entry) of review_limits
  then: the product reads no more of a page than 10485760 bytes
  when: the [best-in-class review](best_in_class_review) is checked there
- given: a repository whose [settings file](settings_file) states, for the judge [entry](entry)
    of elucidate_agents, a [pinned model ID](pinned_model_id) of a lower tier than
    the model the product ships for the judge, at effort low
  then: each judge is spawned on that model at that effort
  when: a run's judges are spawned there
- given: a repository whose [settings file](settings_file) states 100000 for the quantity
    of the agent_ceiling [entry](entry) of challenge_bounds
  then: the product does not refuse the run for the count of its agents
  when: a run that would spawn 200 agents is built there
- given: a repository whose [settings file](settings_file) states read for the access
    field of the actions [entry](entry) of portal_token_permissions
  then: the screen asks for a token granting read access to actions
  when: reqctl portal serves the setup screen there
