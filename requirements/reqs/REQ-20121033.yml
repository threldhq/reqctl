acceptance_criteria:
- given: a run with two [proposals](proposal) split into groups, one of whose group
    returns is refused
  then: the product writes the final judge prompt of the other [proposal](proposal),
    writes none for the [proposal](proposal) whose group return is refused, and lists
    that group judge to spawn again
  when: the final judges are built
- given: a run with a [proposal](proposal) split into groups, one of whose group judges
    has written no return
  then: the product writes no final judge prompt for that [proposal](proposal)
  when: the final judges are built
