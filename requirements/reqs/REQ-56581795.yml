acceptance_criteria:
- given: an [item](item) another [item](item) binds
  then: the product makes the binder suspect
  when: the text, the value type, the unit or the default of the bound [item](item)
    is changed
- given: an [item](item) another [item](item) binds
  then: the product leaves the binder [pinned](pin)
  when: a field the [stamp](stamp) does not cover is changed on the bound [item](item)
- given: an [item](item) binding an [item](item) whose links a rename rewrites
  then: the product makes the binder suspect
  when: the rename is made
- given: an [item](item) binding an [item](item) whose links a reword rewrites
  then: the product makes the binder suspect
  when: the reword is made
