entries:
  copy:
    definition: shutil.copyfile, shutil.copy, shutil.copy2 or shutil.copytree
  create:
    definition: Path.touch, Path.symlink_to, Path.hardlink_to, os.link, os.symlink,
      or the mkstemp, NamedTemporaryFile or TemporaryFile of tempfile
  delete:
    definition: Path.unlink, os.remove, os.unlink or shutil.rmtree
  open_to_write:
    definition: open, io.open or Path.open in a mode that writes, appends, creates
      or updates, or os.open with a flag that writes, appends, creates or truncates
  rename:
    definition: Path.rename, Path.replace, os.rename, os.renames, os.replace or shutil.move
  write:
    definition: Path.write_text or Path.write_bytes
